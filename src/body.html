<div id="app">
  <header class="bar" role="toolbar" aria-label="Tools" data-t-aria-label="page.tools">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="1.5" width="14" height="6" rx="3" fill="var(--f-term)" stroke="var(--s-term)" stroke-width="1.5"></rect><path d="M16 7.5V11" stroke="var(--flow)" stroke-width="1.5"></path><path d="M16 11L24 17L16 23L8 17Z" fill="var(--f-cond)" stroke="var(--s-cond)" stroke-width="1.5"></path><path d="M24 17H28V27H16M8 17H4V27H16V30.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <div class="bt"><b>FlowLab</b><button type="button" id="progName" title="Program properties" data-t="model.program" data-t-title="ui.programProperties2">Program</button></div>
    </div>
    <button class="tb" id="fileBtn" type="button" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg><span class="lbl" data-t="page.file">File</span></button>
    <button class="tb icon" id="openBtn" type="button" title="Open .fprg file (Ctrl+O)" aria-label="Open" data-t-title="page.openFprgFileCtrlO" data-t-aria-label="ui.open"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
    <button class="tb icon" id="saveBtn" type="button" title="Save as .fprg (Ctrl+S)" aria-label="Save" data-t-title="page.saveAsFprgCtrlS" data-t-aria-label="ui.save"><svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-2zM8 3v5h7V3M8 21v-7h8v7"></path></svg></button>
    <button class="tb icon" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" data-t-title="page.undoCtrlZ" data-t-aria-label="page.undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
    <button class="tb icon" id="redoBtn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" data-t-title="page.redoCtrlY" data-t-aria-label="page.redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"></path></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <div class="viewsw" role="radiogroup" aria-label="Program view" data-t-aria-label="page.programView">
      <button type="button" class="vbtn" id="viewFn" role="radio" aria-checked="true" aria-label="Functions view" title="Functions view: the program is a set of functions (Ctrl+Alt+F)" data-t-title="page.functionsViewTheProgramIsA" data-t-aria-label="page.functionsView"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h-1.5A3.5 3.5 0 0 0 10 7.5V20M6.5 11H14"></path><path d="M15.5 13.5l5 5M20.5 13.5l-5 5"></path></svg><span class="lbl" data-t="page.functions">Functions</span></button>
      <button type="button" class="vbtn" id="viewOo" role="radio" aria-checked="false" aria-label="Objects view" title="Objects view: UML class diagram (Ctrl+Alt+O)" data-t-title="page.objectsViewUmlClassDiagramCtrl" data-t-aria-label="page.objectsView"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3" width="9" height="11" rx="1.2"></rect><path d="M2.5 7h9M2.5 10.5h9"></path><rect x="13.5" y="10" width="8" height="11" rx="1.2"></rect><path d="M13.5 14h8M7 14v3.5h6.5"></path></svg><span class="lbl" data-t="page.objects">Objects</span></button>
    </div>
    <div class="funcbox">
      <label for="funcSel" id="funcLbl" data-t="ui.function">Function</label>
      <select id="funcSel" class="fsel"></select>
      <button class="iconbtn" id="funcAdd" type="button" title="New function (N)" aria-label="New function" data-t-title="ui.newFunctionN" data-t-aria-label="ui.newFunction"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button class="iconbtn" id="funcEdit" type="button" title="Edit function or program properties (F2)" aria-label="Edit function" data-t-title="ui.editFunctionOrProgramPropertiesF2" data-t-aria-label="page.editFunction"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg></button>
      <button class="iconbtn" id="funcDel" type="button" title="Delete function (Shift+Del)" aria-label="Delete function" data-t-title="ui.deleteFunctionShiftDel" data-t-aria-label="page.deleteFunction"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg></button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb run" id="runBtn" type="button" title="Run (F5)" data-t-title="page.runF5"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"></path></svg><span class="lbl" data-t="ui.run">Run</span></button>
    <button class="tb" id="stepBtn" type="button" title="Run one step (F10)" data-t-title="page.runOneStepF10"><svg viewBox="0 0 24 24"><path d="M5 5v14M10 6l9 6-9 6z"></path></svg><span class="lbl" data-t="ui.step">Step</span></button>
    <button class="tb icon" id="overBtn" type="button" title="Step over (F8): runs the whole call of the current block without entering the function or method" aria-label="Step over" data-t-title="page.stepOverF8RunsTheWhole" data-t-aria-label="page.stepOver"><svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 15-3.5"></path><path d="M20 5v5h-5"></path><circle cx="12" cy="18" r="2"></circle></svg></button>
    <button class="tb icon" id="outBtn" type="button" title="Step out (Shift+F8): runs the rest of the current function or method and stops at the next block of its caller" aria-label="Step out" data-t-title="page.stepOutShiftF8RunsThe" data-t-aria-label="page.stepOut"><svg viewBox="0 0 24 24"><path d="M5 4v16h6"></path><path d="M12 12h8M16 8l4 4-4 4"></path></svg></button>
    <button class="tb icon" id="pauseBtn" type="button" title="Pause (F6)" aria-label="Pause" disabled="" data-t-title="page.pauseF6" data-t-aria-label="chart.pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"></path></svg></button>
    <button class="tb icon" id="stopBtn" type="button" title="Stop (Shift+F5)" aria-label="Stop" disabled="" data-t-title="page.stopShiftF5" data-t-aria-label="ui.stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></svg></button>
    <label class="speed" for="speed"><span class="lbl" data-t="page.speed">Speed</span> <span class="spd-ico" title="Slow" data-t-title="ui.slow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5c0-4 3.2-7 7-7s7 3 7 7z"/><path d="M7.2 11.5l3.8 4M14.8 11.5L11 15.5M11 8.5v7"/><path d="M18 15.5h1.8a1.8 1.8 0 0 0 1.7-2.3l-.3-.9a1.5 1.5 0 0 0-2.1-.9L18 12M6 15.5v2.5M15.5 15.5v2.5M3 15.5l-1 1"/></svg></span><input id="speed" type="range" min="0" max="3" step="1" value="1" title="Speed of the execution: to the right faster" aria-label="Speed of the execution" data-t-title="ui.speedOfTheExecutionRightFaster" data-t-aria-label="ui.speedOfTheExecution"><span class="spd-ico" title="Fast" data-t-title="ui.fast"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18c0-4 3-7 7.5-7 1.8 0 3 .5 4 1.3"/><path d="M16.5 12.3c1.5-.3 3 .4 3.5 1.7.4 1-.3 2-1.3 2H17M12.5 11C12 8 12.5 4.5 14 3.5c1 1.5.8 4.5-.3 7.7M15 11.2c.8-2.7 2.5-5.4 4-5.7.4 1.8-1 4.5-2.8 6.4"/><path d="M5 18h10.5a2.5 2.5 0 0 0 2.5-2M8 18l-1.5 2M13 18l1 2M5 18c-1.3 0-2-.8-2-1.8"/><circle cx="18" cy="13.6" r=".5"/></svg></span><output id="speedVal" data-t="ui.medium">Medium</output></label>
    <span class="grow"></span>
    <button class="tb" id="exBtn" type="button" aria-haspopup="menu" title="Example programs" data-t-title="ui.examplePrograms"><svg viewBox="0 0 24 24"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z"></path></svg><span class="lbl" data-t="page.examples">Examples</span></button>
    <button class="tb" id="modBtn" type="button" title="Import a module: ready-made classes and functions to reuse (Ctrl+I)" data-t-title="page.importAModuleReadyMadeClasses"><svg viewBox="0 0 24 24"><path d="M9 3h6v3a2 2 0 1 0 4 0V5h2v6h-3a2 2 0 1 0 0 4h3v6h-6v-3a2 2 0 1 0-4 0v3H5v-6h1a2 2 0 1 0 0-4H5V5h4z"></path></svg><span class="lbl" data-t="page.importModule">Import module</span></button>
    <button class="tb icon" id="helpBtn" type="button" title="Quick guide (F1)" aria-label="Quick guide" data-t-title="page.quickGuideF1" data-t-aria-label="ui.quickGuide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"></path></svg></button>
    <button class="tb icon" id="themeBtn" type="button" title="Light/dark theme" aria-label="Change theme" data-t-title="page.lightDarkTheme" data-t-aria-label="page.changeTheme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"></path></svg></button>
  </header>

  <main class="work">
    <section class="canvas-col" aria-label="Flowchart" data-t-aria-label="page.flowchart">
      <div id="canvasWrap"><div id="chart" class="vchart"></div></div>
      <div id="modBar" hidden=""><button type="button" id="modToggle" data-t="ui.collapseModules">⊟ Collapse modules</button></div><div id="chartTools"><button type="button" id="compactBtn" aria-pressed="false" title="Compact view: blocks in sequence touch each other (Shift+K)" aria-label="Compact view" data-t-title="ui.compactViewBlocksInSequenceTouch" data-t-aria-label="page.compactView"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="cb1" x="6" y="2.5" width="12" height="5" rx="1"></rect><path class="cb-arrow" d="M12 7.5v3"></path><rect class="cb2" x="6" y="10.5" width="12" height="5" rx="1"></rect><path class="cb-arrow" d="M12 15.5v3"></path><rect class="cb3" x="6" y="18.5" width="12" height="3.5" rx="1"></rect></svg><span class="lbl" data-t="ui.compact">Compact</span></button><div id="crumbBar" hidden=""><button type="button" id="backUml" title="Back to the class diagram (U)" data-t-title="page.backToTheClassDiagramU"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg><span data-t="ui.classDiagram">Class diagram</span></button><span id="crumbWhere"></span></div></div>
      <div class="zoombar" role="group" aria-label="Zoom" data-t-aria-label="page.zoom">
        <button type="button" id="zoomOut" aria-label="Zoom out" data-t-aria-label="ui.zoomOut">−</button>
        <button type="button" id="zoomVal" title="Back to 100% (Ctrl+0)" data-t-title="page.backTo100Ctrl0">100%</button>
        <button type="button" id="zoomIn" aria-label="Zoom in" data-t-aria-label="ui.zoomIn">+</button>
        <button type="button" id="zoomFit" title="Fit to window (Shift+1)" aria-label="Fit to window" data-t-title="page.fitToWindowShift1" data-t-aria-label="ui.fitToWindow">⤢</button>
        <button type="button" id="panBtn" class="panbtn" aria-pressed="false" title="Hand: drag to move the sheet (H, or hold Space)" aria-label="Hand: drag to move the sheet (H, or hold Space)" data-t-title="ui.handMoveTheSheet" data-t-aria-label="ui.handMoveTheSheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V12M17 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.6 14.9a1.5 1.5 0 0 1 2.3-1.9L8 14.3"/></svg></button>
        <span class="zsep" aria-hidden="true"></span>
        <button type="button" id="viewAdd" title="New view: another window on the program, to see and edit another diagram or another part of this one (Ctrl+Alt+V)" aria-label="New view" data-t-title="ui.newViewAnotherWindowOnThe" data-t-aria-label="ui.newView"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3"></path></svg><span data-t="ui.newView">New view</span></button>
      </div>
      <footer class="statusbar">
        <span id="status" class="status" role="status"><span id="statusText" data-t="ui.ready">Ready</span></span>
        <span id="stepCount"></span>
        <span class="hint-add" data-t="ui.clickAnArrowToAddA">Click an arrow to add a block · double-click to edit it · drag to move it</span>
      </footer>
    </section>
    <div id="grip" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0" data-t-aria-label="page.resizePanel"><button id="sideToggle" type="button" title="Hide the panel (Ctrl+B)" aria-label="Hide the panel" aria-expanded="true" data-t-title="page.hideThePanelCtrlB" data-t-aria-label="ui.hideThePanel"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6L4.5 9.5"></path></svg></button></div>
    <aside id="side" aria-label="Panels" data-t-aria-label="page.panels">
      <div id="tabs" role="tablist" aria-label="Panels" data-t-aria-label="page.panels"></div>
      <section class="pane" id="pane-console" role="tabpanel" aria-label="Console" data-t-aria-label="page.console">
        <div class="panehead"><span data-t="page.programOutputAndKeyboardInput">Program output and keyboard input</span><span class="grow"></span><button class="btn small" id="conClear" type="button" data-t="page.clear">Clear</button></div>
        <div id="conOut" aria-live="polite"></div>
        <form id="conForm" autocomplete="off" onsubmit="return false">
          <span id="conPrompt">›</span>
          <input id="conInput" type="text" disabled="" placeholder="Input becomes active when the program asks for a value" aria-label="Input value" data-t-aria-label="page.inputValue" data-t-placeholder="ui.inputBecomesActiveWhenTheProgram">
          <button id="conSend" type="button" disabled="" data-t="page.send">Send</button>
        </form>
      </section>
      <section class="pane" id="pane-vars" role="tabpanel" aria-label="Variables" hidden="" data-t-aria-label="ui.variables">
        <div class="panehead"><span data-t="page.valuesDuringExecutionJustChangedOnes">Values during execution · just-changed ones in yellow</span></div>
        <div id="varsBody"></div>
      </section>
      <section class="pane" id="pane-code" role="tabpanel" aria-label="Source code" hidden="" data-t-aria-label="page.sourceCode">
        <div class="panehead"><label for="langSel" data-t="page.language">Language</label><select id="langSel" class="fsel"></select><span class="grow"></span><span class="vzoom codesize" role="group" aria-label="Text size" data-t-aria-label="ui.codeTextSize"><button type="button" id="codeSmaller" title="Smaller text" aria-label="Smaller text" data-t-title="ui.smallerText" data-t-aria-label="ui.smallerText">A−</button><button type="button" id="codeSizeVal" title="Back to 13" aria-label="Back to 13" data-t-title="ui.backToTheNormalSize" data-t-aria-label="ui.backToTheNormalSize">13</button><button type="button" id="codeBigger" title="Bigger text" aria-label="Bigger text" data-t-title="ui.biggerText" data-t-aria-label="ui.biggerText">A+</button></span><button class="btn small" id="codeCopy" type="button" data-t="ui.copy">Copy</button></div>
        <pre id="codeOut"></pre>
      </section>
      <section class="pane" id="pane-files" role="tabpanel" aria-label="Text files" hidden="" data-t-aria-label="page.textFiles">
        <div class="panehead"><span data-t="page.textFilesForTheOpenRead">Text files for the Open, Read, Write blocks</span><span class="grow"></span><button class="btn small" id="fileNew" type="button" data-t="page.new">New</button><button class="btn small" id="fileUpload" type="button" data-t="page.upload">Upload…</button></div>
        <div id="filesBody"></div>
      </section>
    </aside>
  </main>
  <input type="file" id="fileInput" accept=".fprg,.xml,.txt,.flstage" multiple="" hidden="">
  <input type="file" id="txtInput" accept=".txt,.csv,text/plain" multiple="" hidden="">
  <div id="floatLayer"></div>
  <div id="pop" hidden=""></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
