<title>FlowLab</title>
<meta name="description" content="Editor ed esecutore di diagrammi di flusso compatibile con i file .fprg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra strumenti in alto · foglio quadrettato al centro · pannello laterale a schede (console, variabili, codice, file) */
:root {
  --bg: #e9edf1; --panel: #f7f9fb; --paper: #fdfefe; --grid: rgba(44, 92, 132, 0.075); --grid-strong: rgba(44, 92, 132, 0.13);
  --ink: #17222d; --muted: #5a6875; --faint: #8693a0; --line: #cfd8e1; --line-soft: #e1e7ed;
  --accent: #0c6c80; --accent-ink: #ffffff; --accent-soft: #d5ecf0;
  --exec: #f2a21b; --exec-soft: #fff1d3; --err: #cf3d3d; --err-soft: #fbe0de; --ok: #2b8a4a;
  --flow: #4c5b69; --sel: #0c6c80;
  --sh-text: #1b2631;
  --f-term: #e8e2f5; --s-term: #74609e;
  --f-decl: #f3efd8; --s-decl: #9f9150;
  --f-assign: #fcf4cf; --s-assign: #ae9533;
  --f-in: #d9e9fb; --s-in: #4e7cab;
  --f-out: #d9f1df; --s-out: #47925b;
  --f-cond: #fadedb; --s-cond: #b45d54;
  --f-loop: #fde6c9; --s-loop: #b57d32;
  --f-call: #ebe4f6; --s-call: #8167b0;
  --f-comment: #ffffff; --s-comment: #9aa6b2;
  --f-brk: #f6d8d8; --s-brk: #ad4545;
  --f-file: #e6e9ef; --s-file: #687384;
  --f-inc: #eceff2; --s-inc: #8f9aa6;
  --con-bg: #10161c; --con-ink: #dbe6ee; --con-echo: #7fd1e3; --con-sys: #7f8d99; --con-err: #ff8f8f;
  --shadow: 0 10px 30px rgba(20, 40, 60, 0.18), 0 2px 6px rgba(20, 40, 60, 0.12);
  --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, "Liberation Mono", monospace;
  --side-w: 420px;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --panel: #151c22; --paper: #182027; --grid: rgba(140, 190, 230, 0.06); --grid-strong: rgba(140, 190, 230, 0.1);
    --ink: #e2e9ef; --muted: #9aa8b5; --faint: #6c7a87; --line: #2b3741; --line-soft: #222c35;
    --accent: #4cc1d6; --accent-ink: #062228; --accent-soft: #173944;
    --exec: #f5b33c; --exec-soft: #3d3016; --err: #ff6b6b; --err-soft: #43201f; --ok: #5bc77c;
    --flow: #8e9dab; --sel: #4cc1d6; --sh-text: #e9eef3;
    --f-term: #352d48; --s-term: #a996d6; --f-decl: #37352a; --s-decl: #c9bb78; --f-assign: #3c3622; --s-assign: #d6bd5c;
    --f-in: #1f3249; --s-in: #7eabdb; --f-out: #1f3a29; --s-out: #74c08a; --f-cond: #462826; --s-cond: #e08b81;
    --f-loop: #43331d; --s-loop: #e0a85a; --f-call: #332a45; --s-call: #ae95dc; --f-comment: #1b232b; --s-comment: #6d7b88;
    --f-brk: #452424; --s-brk: #e07a7a; --f-file: #262d36; --s-file: #9aa5b3;
    --f-inc: #232a31; --s-inc: #6d7883;
    --con-bg: #0a0e11; --shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #151c22; --paper: #182027; --grid: rgba(140, 190, 230, 0.06); --grid-strong: rgba(140, 190, 230, 0.1);
  --ink: #e2e9ef; --muted: #9aa8b5; --faint: #6c7a87; --line: #2b3741; --line-soft: #222c35;
  --accent: #4cc1d6; --accent-ink: #062228; --accent-soft: #173944;
  --exec: #f5b33c; --exec-soft: #3d3016; --err: #ff6b6b; --err-soft: #43201f; --ok: #5bc77c;
  --flow: #8e9dab; --sel: #4cc1d6; --sh-text: #e9eef3;
  --f-term: #352d48; --s-term: #a996d6; --f-decl: #37352a; --s-decl: #c9bb78; --f-assign: #3c3622; --s-assign: #d6bd5c;
  --f-in: #1f3249; --s-in: #7eabdb; --f-out: #1f3a29; --s-out: #74c08a; --f-cond: #462826; --s-cond: #e08b81;
  --f-loop: #43331d; --s-loop: #e0a85a; --f-call: #332a45; --s-call: #ae95dc; --f-comment: #1b232b; --s-comment: #6d7b88;
  --f-brk: #452424; --s-brk: #e07a7a; --f-file: #262d36; --s-file: #9aa5b3;
  --f-inc: #232a31; --s-inc: #6d7883;
  --con-bg: #0a0e11; --shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- App shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.bar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand .bt { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand b { font-size: 15px; letter-spacing: 0.01em; }
.brand button { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand button:hover { color: var(--accent); }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
.grow { flex: 1; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid transparent; background: transparent; cursor: pointer; white-space: nowrap; }
.tb:hover:not(:disabled) { background: var(--line-soft); }
.tb:disabled { opacity: 0.4; cursor: default; }
.tb svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb.icon { padding: 0 7px; }
.tb.run { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0 14px; }
.tb.run:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.tb.run svg { fill: currentColor; stroke: none; }
.funcbox { display: inline-flex; align-items: center; gap: 2px; }
.funcbox label { font-size: 12px; color: var(--muted); margin-right: 4px; }
select.fsel { height: 32px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); padding: 0 8px; max-width: 220px; }
.speed { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.speed input { width: 86px; accent-color: var(--accent); }
.speed output { min-width: 62px; color: var(--ink); }

main.work { display: grid; grid-template-columns: minmax(0, 1fr) 6px var(--side-w); min-height: 0; }
#grip { cursor: col-resize; background: var(--line-soft); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
#grip:hover, #grip:focus-visible { background: var(--accent-soft); }
#grip { position: relative; }
#sideToggle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 48px; padding: 0; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; cursor: pointer; z-index: 27; box-shadow: 0 1px 4px rgba(20, 40, 60, 0.12); }
#sideToggle:hover, #sideToggle:focus-visible { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#sideToggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
body.side-hidden main.work { grid-template-columns: minmax(0, 1fr) 6px 0; }
body.side-hidden #side { display: none; }
body.side-hidden #grip { cursor: default; }
body.side-hidden #sideToggle svg { transform: rotate(180deg); }
body.side-hidden #sideToggle { left: auto; right: 3px; transform: translateY(-50%); }

/* ---------- Foglio del diagramma ---------- */
.canvas-col { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: 1fr auto; }
#canvasWrap {
  overflow: auto; min-height: 0; position: relative;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
}
#chart { display: flex; justify-content: center; min-width: max-content; padding: 12px 12px 80px; }
#chart svg { display: block; overflow: visible; }
.zoombar { position: absolute; left: 12px; bottom: 44px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.zoombar button { border: 0; background: transparent; height: 28px; min-width: 28px; border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoombar button:hover { background: var(--line-soft); }
#zoomVal { min-width: 50px; font-size: 12px; }
.statusbar { display: flex; align-items: center; gap: 12px; padding: 6px 14px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--muted); min-height: 32px; }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.status.running::before { background: var(--exec); box-shadow: 0 0 0 3px var(--exec-soft); animation: pulse 1s infinite; }
.status.input::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.status.paused::before { background: var(--exec); }
.status.done::before { background: var(--ok); }
.status.error::before { background: var(--err); }
@keyframes pulse { 50% { opacity: 0.45; } }
#stepCount { font-variant-numeric: tabular-nums; }
.hint-add { margin-left: auto; color: var(--faint); }

/* Forme SVG */
.chart text { font: 700 12.5px var(--font-ui); fill: var(--sh-text); pointer-events: none; }
.chart .shape text { text-anchor: middle; }
.chart .badge { font: 700 11px var(--font-ui); letter-spacing: 0.02em; }
.chart .c-in .badge { fill: var(--s-in); }
.chart .c-decl .badge { fill: var(--s-decl); }
.chart .c-out .badge { fill: var(--s-out); }
.chart .blabel { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: 0.02em; }
.chart .flow { fill: none; stroke: var(--flow); stroke-width: 1.6; }
.chart .ahead, .chart .joint { fill: var(--flow); }
.chart .shape { cursor: pointer; }
.chart .shape > path, .chart .shape > rect { stroke-width: 1.6; transition: stroke-width .12s, filter .12s; }
.chart .shape .inner { fill: none !important; stroke-width: 1.2; }
.chart .shape .note { stroke-dasharray: 4 3; }
.chart .shape.comment text { font-weight: 400; font-style: italic; fill: var(--muted); }
.chart .shape.comment.open text.cline-t { text-anchor: start; }
.chart .ctoggle { cursor: pointer; pointer-events: all; }
.chart .ctoggle circle { fill: var(--paper); stroke: var(--s-comment); stroke-width: 1.3; }
.chart .ctoggle path { stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; fill: none; }
.chart .ctoggle:hover circle { fill: var(--accent); stroke: var(--accent); }
.chart .ctoggle:hover path { stroke: var(--accent-ink); }
.chart .shape.c-inc text { font-weight: 400; fill: var(--muted); font-style: italic; }
.chart .shape.c-inc > path, .chart .shape.c-inc > rect { stroke-dasharray: 5 3; }
.c-term > path, .c-term > rect { fill: var(--f-term); stroke: var(--s-term); }
.c-decl > path, .c-decl > rect { fill: var(--f-decl); stroke: var(--s-decl); }
.c-assign > path, .c-assign > rect { fill: var(--f-assign); stroke: var(--s-assign); }
.c-in > path, .c-in > rect { fill: var(--f-in); stroke: var(--s-in); }
.c-out > path, .c-out > rect { fill: var(--f-out); stroke: var(--s-out); }
.c-cond > path, .c-cond > rect { fill: var(--f-cond); stroke: var(--s-cond); }
.c-loop > path, .c-loop > rect { fill: var(--f-loop); stroke: var(--s-loop); }
.c-call > path, .c-call > rect { fill: var(--f-call); stroke: var(--s-call); }
.c-comment > path, .c-comment > rect { fill: var(--f-comment); stroke: var(--s-comment); }
.c-brk > path, .c-brk > rect { fill: var(--f-brk); stroke: var(--s-brk); }
.c-file > path, .c-file > rect { fill: var(--f-file); stroke: var(--s-file); }
.c-inc > path, .c-inc > rect { fill: var(--f-inc); stroke: var(--s-inc); }
.chart .shape:hover > path, .chart .shape:hover > rect { stroke-width: 2.4; }
.chart .shape.sel > path:not(.inner), .chart .shape.sel > rect { stroke: var(--sel); stroke-width: 3; }
.chart .shape.exec > path:not(.inner), .chart .shape.exec > rect { fill: var(--exec-soft); stroke: var(--exec); stroke-width: 3.2; filter: drop-shadow(0 0 6px var(--exec)); }
.chart .shape.exec > path:not(.inner), .chart .shape.exec > rect { animation: lit 0.32s ease-out; }
@keyframes lit { 0% { filter: drop-shadow(0 0 0 var(--exec)); stroke-width: 1.6; } 45% { filter: drop-shadow(0 0 14px var(--exec)); } 100% { filter: drop-shadow(0 0 6px var(--exec)); } }
.chart .shape.err > path:not(.inner), .chart .shape.err > rect { fill: var(--err-soft); stroke: var(--err); stroke-width: 3.2; }
.chart .trail { pointer-events: none; }
.chart .trail-path { fill: none; stroke: var(--exec); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
.chart .trail-cursor { fill: var(--exec); stroke: var(--paper); stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--exec)); }
.chart .ins { cursor: copy; }
.chart .ins rect { fill: transparent; }
.chart .ins circle { fill: var(--accent); opacity: 0; transition: opacity .12s, transform .12s; }
.chart .ins path { stroke: var(--accent-ink); stroke-width: 2; opacity: 0; }
.chart .ins:hover circle, .chart .ins:focus circle { opacity: 1; }
.chart .ins:hover path { opacity: 1; }
body.dragging .chart .ins circle { opacity: 0.25; }
body.dragging .chart .ins.drop circle { opacity: 1; }
body.dragging .chart .ins.drop path { opacity: 1; }
body.dragging, body.dragging * { cursor: grabbing !important; }
body[data-run="running"] .chart .ins, body[data-run="paused"] .chart .ins, body[data-run="input"] .chart .ins { cursor: not-allowed; }
.ghost { position: fixed; z-index: 60; pointer-events: none; background: var(--panel); border: 1px solid var(--accent); color: var(--ink); padding: 4px 10px; border-radius: 6px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Pannello laterale ---------- */
#side { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; background: var(--panel); }
#tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
#tabs { align-items: stretch; }
.tabw { display: flex; align-items: center; border-bottom: 2px solid transparent; border-radius: 7px 7px 0 0; }
.tabw:has([aria-selected=true]) { border-bottom-color: var(--accent); }
.tabw.dragging { opacity: 0.4; }
.tabw.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
.tabw.drop-after { box-shadow: inset -3px 0 0 var(--accent); }
#tabs [role=tab] { border: 0; background: transparent; padding: 8px 4px 9px 11px; cursor: grab; color: var(--muted); white-space: nowrap; font-weight: 700; font-size: 13px; }
#tabs [role=tab][aria-selected=true] { color: var(--ink); }
#tabs [role=tab]:hover { color: var(--ink); }
.tabw .detach { border: 0; background: transparent; width: 24px; height: 24px; margin-right: 4px; border-radius: 5px; color: var(--faint); cursor: pointer; display: grid; place-items: center; padding: 0; }
.tabw .detach svg, .fwin .dock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabw .detach:hover, .tabw .detach:focus-visible { background: var(--line-soft); color: var(--accent); }
body.side-empty main.work { grid-template-columns: minmax(0, 1fr); }
body.side-empty #side, body.side-empty #grip { display: none; }
body.panedrag #canvasWrap { outline: 2px dashed var(--accent); outline-offset: -8px; }

/* Finestre mobili sopra l'area del diagramma */
.fwin { position: absolute; z-index: 30; pointer-events: auto; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; resize: both; min-width: 260px; min-height: 160px; }
.fwin.active { border-color: var(--accent); }
.fwin-head { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 12px; cursor: move; user-select: none; touch-action: none; background: var(--bg); border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.fwin.active .fwin-head { background: var(--accent-soft); }
.fwin.moving { opacity: 0.92; }
.fwin-body { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); }
.fwin-body > .pane { min-height: 0; }
.fwin .dock, .fwin .minbtn { width: 28px; height: 28px; }
.fwin .minbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fwin.min { height: auto !important; min-height: 0; resize: none; }
.fwin.min .fwin-body { display: none; }
.fwin.min .fwin-head { border-bottom: 0; }
#floatLayer { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.pane { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
.pane[hidden] { display: none !important; }
.panehead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; color: var(--muted); min-height: 44px; flex-wrap: wrap; }
.panehead .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary.danger, .btn.danger:hover { background: var(--err); border-color: var(--err); color: #fff; }
.btn.danger { color: var(--err); }
.iconbtn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.iconbtn:hover:not(:disabled) { background: var(--line-soft); color: var(--ink); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.empty { color: var(--muted); padding: 14px 16px; margin: 0; max-width: 46ch; }

/* Console */
#pane-console { grid-template-rows: auto 1fr auto; }
#conOut { background: var(--con-bg); color: var(--con-ink); font: 13.5px/1.55 var(--font-mono); padding: 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word; min-height: 0; }
.cline { min-height: 1.55em; }
.cline.echo { color: var(--con-echo); }
.cline.echo::before { content: "› "; opacity: .6; }
.echo-inline { color: var(--con-echo); }
.cline.sys { color: var(--con-sys); font-size: 12px; }
.cline.error { color: var(--con-err); }
#conForm { display: flex; gap: 6px; padding: 8px; background: var(--con-bg); border-top: 1px solid rgba(255,255,255,.08); align-items: center; }
#conPrompt { color: var(--con-sys); font: 600 13px var(--font-mono); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
#conForm.waiting #conPrompt { color: var(--con-echo); }
#conInput { flex: 1; min-width: 0; height: 34px; border-radius: 6px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: var(--con-ink); padding: 0 10px; font: 13.5px var(--font-mono); }
#conInput:disabled { opacity: .55; }
#conForm.waiting #conInput { border-color: var(--con-echo); box-shadow: 0 0 0 3px rgba(127, 209, 227, .18); }
#conSend { height: 34px; border-radius: 6px; border: 0; background: var(--con-echo); color: #08242b; font-weight: 700; padding: 0 12px; cursor: pointer; }
#conSend:disabled { opacity: .35; cursor: default; }

/* Variabili */
#varsBody { overflow: auto; min-height: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 10px 12px 4px; font-size: 12.5px; }
.crumbs button { border: 0; background: transparent; padding: 3px 7px; border-radius: 5px; cursor: pointer; color: var(--muted); font-weight: 700; }
.crumbs button.on { background: var(--accent-soft); color: var(--ink); }
.crumbs .sep { color: var(--faint); }
table.vars { width: 100%; border-collapse: collapse; font-size: 13px; }
table.vars th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 12px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
table.vars td { padding: 5px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.vars td:first-child { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
table.vars td:last-child { font-family: var(--font-mono); word-break: break-all; }
table.vars tr.item td:first-child { padding-left: 26px; color: var(--muted); font-weight: 400; }
table.vars tr.changed td { background: var(--exec-soft); }
.undef { color: var(--faint); font-family: var(--font-ui); font-style: italic; font-size: 12px; }
.v-String { color: var(--s-out); }
.v-Boolean { color: var(--s-call); }
.ptag { font: 700 9.5px var(--font-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }

/* Codice */
#codeOut { margin: 0; overflow: auto; padding: 12px 0; font: 13px/1.6 var(--font-mono); background: var(--paper); min-height: 0; counter-reset: ln; tab-size: 4; }
#codeOut .ln { counter-increment: ln; display: inline-block; width: 3.4em; padding-right: 1em; text-align: right; color: var(--faint); user-select: none; }
#codeOut .ln::before { content: counter(ln); }
.tk { color: var(--s-call); font-weight: 600; }
.ts { color: var(--s-out); }
.tn { color: var(--s-loop); }
.tc { color: var(--faint); font-style: italic; }

/* File */
#filesBody { overflow: auto; min-height: 0; }
ul.files { list-style: none; margin: 0; padding: 6px 0; }
ul.files li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.fname { display: flex; flex-direction: column; flex: 1; min-width: 120px; }
.fname strong { font-family: var(--font-mono); font-size: 13px; word-break: break-all; }
.factions { display: flex; gap: 6px; }

/* ---------- Visualizzatore di array ---------- */
:root { --av-paper: #fffef8; --av-grid: #cfe0ee; --av-paper-edge: #f3f1e6; --av-paper-line: #d6d2bf; --av-odd: rgba(12, 108, 128, 0.055); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --av-paper: #1d252c; --av-grid: #2f4252; --av-paper-edge: #232c34; --av-paper-line: #3a4752; --av-odd: rgba(76, 193, 214, 0.07); } }
:root[data-theme="dark"] { --av-paper: #1d252c; --av-grid: #2f4252; --av-paper-edge: #232c34; --av-paper-line: #3a4752; --av-odd: rgba(76, 193, 214, 0.07); }
.avwin { min-width: 240px; min-height: 150px; }
.av-main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.av-bar { grid-row: 1; }
.av-stage { grid-row: 2; }
.av-foot { grid-row: 3; }
.av-state { font-size: 11.5px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.av-bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
.av-bar[hidden] { display: none; }
.av-lead { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.av-step { display: inline-flex; align-items: center; gap: 2px; }
.av-step .iconbtn { width: 24px; height: 24px; font-size: 16px; line-height: 1; }
.av-lbl { color: var(--muted); margin-right: 2px; }
.av-idx { min-width: 2.2em; text-align: center; font: 700 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.av-max { color: var(--faint); font: 12px var(--font-mono); }
.av-bookbar { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; }
.av-bookbar input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); }
.av-cube svg { width: 34px; height: 30px; display: block; }
.av-cube .cb { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linejoin: round; }
.av-cube .sl2 { fill: var(--exec); fill-opacity: 0.55; stroke: var(--exec); stroke-width: 1.2; }
.av-stage { min-height: 0; padding: 12px 14px 10px; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); perspective: 1400px; background: var(--bg); }
.av-page { min-height: 0; min-width: 0; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); background: var(--av-paper); border: 1px solid var(--av-paper-line); border-radius: 4px; transform-origin: left center; }
.avwin[data-mode="book"] .av-stage { padding: 14px 26px 18px; }
.avwin[data-mode="book"] .av-page { background-color: var(--av-paper); background-image: linear-gradient(var(--av-grid) 1px, transparent 1px), linear-gradient(90deg, var(--av-grid) 1px, transparent 1px); background-size: 10px 10px; }
.av-page.turn-next { animation: av-turn-next 0.42s cubic-bezier(.2,.7,.2,1); transform-origin: left center; }
.av-page.turn-prev { animation: av-turn-prev 0.42s cubic-bezier(.2,.7,.2,1); transform-origin: right center; }
@keyframes av-turn-next { from { transform: rotateY(-62deg); opacity: 0.35; } to { transform: none; opacity: 1; } }
@keyframes av-turn-prev { from { transform: rotateY(62deg); opacity: 0.35; } to { transform: none; opacity: 1; } }
.av-grid { position: relative; min-height: 0; display: grid; grid-template-columns: 46px minmax(0, 1fr); grid-template-rows: 24px minmax(0, 1fr); }
.av-grid.strip { grid-template-columns: 0 minmax(0, 1fr); }
.av-corner { font: 10.5px var(--font-ui); color: var(--faint); display: grid; place-items: center; }
.av-colhead, .av-rowhead { position: relative; overflow: hidden; font: 600 11px var(--font-mono); color: var(--muted); }
.av-colhead span { position: absolute; top: 0; height: 24px; display: grid; place-items: center; }
.av-rowhead span { position: absolute; left: 0; width: 46px; height: 30px; display: grid; place-items: center; }
.av-body { position: relative; overflow: auto; min-height: 0; outline: none; scrollbar-width: thin; }
.av-spacer { position: absolute; left: 0; top: 0; pointer-events: none; }
.av-cells { position: absolute; left: 0; top: 0; }
/* sfumatura verso la trasparenza dove ci sono altre celle oltre il bordo */
.av-body, .av-colhead, .av-rowhead {
  --fl: 0px; --fr: 0px; --ft: 0px; --fb: 0px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%), linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%), linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
  mask-composite: intersect;
}
.av-c { position: absolute; height: 30px; display: grid; place-items: center; padding: 0 4px; font: 13px var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); color: var(--ink); }
.av-c.odd { background: var(--av-odd); }
.avwin[data-mode="book"] .av-c { background: transparent; border-color: var(--av-grid); }
.avwin[data-mode="book"] .av-c.odd { background: var(--av-odd); }
.av-c.undef { color: var(--faint); }
.av-c.t-String { color: var(--s-out); }
.av-c.t-Boolean { color: var(--s-call); }
.av-c.chg { background: var(--exec-soft) !important; box-shadow: inset 0 0 0 2px var(--exec); font-weight: 700; animation: av-chg 0.9s ease-out; }
@keyframes av-chg { 0% { box-shadow: inset 0 0 0 2px var(--exec), 0 0 14px 2px var(--exec); } 100% { box-shadow: inset 0 0 0 2px var(--exec); } }
.av-foot { padding: 4px 12px 6px; font: 12px var(--font-mono); color: var(--muted); border-top: 1px solid var(--line-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.vars .caret { width: 18px; height: 18px; padding: 0; margin: 0 2px 0 -6px; border: 0; background: none; color: var(--muted); cursor: pointer; vertical-align: -3px; border-radius: 4px; }
table.vars .caret:hover, table.vars .caret:focus-visible { color: var(--ink); background: var(--line-soft); }
table.vars .caret svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s ease; }
table.vars .caret.open svg { transform: rotate(90deg); }
table.vars tr.detail td { padding: 0; }
table.vars tr.detail:not(.open) td { border-bottom-color: transparent; }
table.vars .det-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.22s ease; }
table.vars tr.detail.open .det-wrap { grid-template-rows: 1fr; }
table.vars .det-inner { overflow: hidden; min-height: 0; }
table.vars .det-inner .avlink { margin: 5px 12px 7px 28px; }
table.vars td .avopen { width: 24px; height: 24px; margin-left: 4px; vertical-align: middle; color: var(--accent); }
table.vars td .avopen svg { width: 15px; height: 15px; }
table.vars .avlink { border: 0; background: none; padding: 0; color: var(--accent); font: 600 12.5px var(--font-ui); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
table.vars .avlink:hover, table.vars .avlink:focus-visible { color: var(--ink); }

/* ---------- Popover e menu ---------- */
#pop { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; max-height: calc(100vh - 16px); overflow: auto; }
.pophead { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 6px 8px 4px; }
.insmenu { width: min(460px, calc(100vw - 32px)); }
.insgroup { padding: 2px 4px 6px; }
.glabel { font-size: 11px; color: var(--faint); padding: 2px 4px 3px; }
.insgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 4px; }
.insbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border: 1px solid transparent; border-radius: 7px; background: transparent; cursor: pointer; font-size: 12px; }
.insbtn:hover, .insbtn:focus-visible { background: var(--accent-soft); border-color: var(--accent); outline: none; }
.mini { width: 32px; height: 26px; overflow: visible; }
.mini path, .mini rect, .mini circle { stroke-width: 1.5; }
.mini .inner { fill: none !important; stroke-width: 1.4; }
.ilabel { line-height: 1.15; text-align: center; }
.pastebtn { width: 100%; margin-top: 4px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 7px; padding: 8px; cursor: pointer; font-weight: 700; }
.ctxmenu { min-width: 220px; display: flex; flex-direction: column; }
.ctxmenu button { display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.ctxmenu button:hover, .ctxmenu button:focus-visible { background: var(--accent-soft); outline: none; }
.ctxmenu button.danger { color: var(--err); }
.ctxmenu kbd { font: 11px var(--font-mono); color: var(--faint); }
.ctxmenu hr { border: 0; border-top: 1px solid var(--line-soft); margin: 4px 0; }
.ctxmenu.examples { min-width: 290px; }
.ctxmenu .tag { font-size: 11.5px; color: var(--faint); }

/* ---------- Finestre modali ---------- */
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(10, 20, 30, 0.42); display: grid; place-items: center; padding: 16px; }
.modal { width: min(460px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.modal.wide { width: min(640px, 100%); }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px 20px; }
.modal h2 { margin: 0; font-size: 17px; text-wrap: balance; }
.modal-body { padding: 4px 20px 6px; overflow: auto; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; }
.formerr { color: var(--err); font-size: 13px; padding: 0 20px; min-height: 0; }
.formerr:not(:empty) { padding-top: 6px; }
.fields { display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; }
.fields .row { display: flex; gap: 10px; flex-wrap: wrap; }
.fields .row > .field { flex: 1 1 120px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field[hidden] { display: none; }
.flabel { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.field input[type=text], .field select, .field textarea, .modal textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 8px 10px; min-height: 38px; }
.field textarea, .modal textarea { resize: vertical; }
.field.bad input { border-color: var(--err); }
.fmsg { font-size: 12px; color: var(--faint); min-height: 0; }
.field.bad .fmsg { color: var(--err); }
.help { margin: 0 0 2px; color: var(--muted); font-size: 13px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); align-self: flex-start; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 12px; cursor: pointer; border-right: 1px solid var(--line-soft); font-size: 13px; }
.seg label:last-child { border-right: 0; }
.seg input:checked + label { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 20px; padding: 1px 9px; font: 12px var(--font-mono); cursor: pointer; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.params { display: flex; flex-direction: column; gap: 6px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto 30px 30px; gap: 6px; align-items: center; }
.prow.rrow { grid-template-columns: minmax(0, 1fr) 110px 30px 30px; }
.prow input[type=text], .prow select { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 8px; min-width: 0; height: 34px; }
.confirm { margin: 4px 0 8px; }
.help-body { font-size: 13.5px; }
.help-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
table.ref { width: 100%; border-collapse: collapse; }
table.ref td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.ref td:first-child { white-space: nowrap; width: 1%; padding-right: 18px; }

/* ---------- Avvisi ---------- */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 70; background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; box-shadow: var(--shadow); transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: var(--exec); color: #2a1c00; }
.toast.error { background: var(--err); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
body.filedrag #canvasWrap { outline: 3px dashed var(--accent); outline-offset: -10px; }

/* ---------- Schermi stretti ---------- */
@media (max-width: 1700px) {
  .funcbox label, .speed .lbl, #exBtn .lbl { display: none; }
  select.fsel { max-width: 170px; }
}
@media (max-width: 1480px) {
  .funcbox label, .speed .lbl { display: none; }
  .bar { gap: 4px; }
  select.fsel { max-width: 150px; }
  #exBtn .lbl { display: none; }
}
@media (max-width: 1400px) {
  #stepBtn .lbl { display: none; }
}
@media (max-width: 1500px) {
  .viewsw .lbl { display: none; }
  .viewsw .vbtn { padding: 0 7px; }
}
@media (max-width: 1120px) {
  #stepBtn .lbl, #exBtn .lbl, #fileBtn .lbl { display: none; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .bar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  .bar > * { flex: none; }
  .bar .grow { flex: 1 0 8px; }
  #app { height: auto; min-height: 100%; }
  main.work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(420px, 62vh) auto; }
  #grip { display: none; }
  #side { border-top: 1px solid var(--line); min-height: 460px; }
  .speed input { width: 70px; }
  .hint-add { display: none; }
  .tb .lbl { display: none; }
  .tb.run .lbl { display: inline; }
  .brand button { max-width: 130px; }
}
@media (max-width: 520px) {
  .funcbox label { display: none; }
  select.fsel { max-width: 130px; }
  .prow { grid-template-columns: minmax(0, 1fr) 96px auto 30px; }
  .prow .iconbtn[title="Sposta su"] { display: none; }
  .prow.rrow { grid-template-columns: minmax(0, 1fr) 96px 30px; }
}

@media print {
  body { overflow: visible; background: #fff; }
  .bar, #side, #grip, .statusbar, .zoombar, #pop, .toast, .fwin, #floatLayer { display: none !important; }
  main.work { display: block; }
  #canvasWrap { overflow: visible; background: #fff; }
  #chart { padding: 0; }
  .chart .ins { display: none; }
}

/* ---------- Vista Funzioni / Oggetti ---------- */
.viewsw { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
.viewsw .vbtn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; font-size: 13px; }
.viewsw .vbtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.viewsw .vbtn:hover { color: var(--ink); background: var(--line-soft); }
.viewsw .vbtn[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
#crumbBar { position: absolute; left: 12px; top: 10px; z-index: 3; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 3px 10px 3px 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 2px 8px rgba(0,0,0,.08); font-size: 13px; }
#crumbBar[hidden] { display: none; }
#crumbBar button { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px 0 5px; border: 0; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-weight: 700; cursor: pointer; white-space: nowrap; }
#crumbBar button:hover { background: var(--accent); color: var(--accent-ink); }
#crumbBar button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#crumbWhere { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.oo:not(.umlmode) #canvasWrap { padding-top: 34px; }

/* ---------- Diagramma delle classi ---------- */
svg.uml { display: block; }
svg.uml text { pointer-events: none; }
.uml .ubox { cursor: grab; }
body.udragging, body.udragging .uml .ubox { cursor: grabbing; }
.uml .ubg { fill: var(--paper); stroke: var(--s-call); stroke-width: 1.6; filter: drop-shadow(0 1px 2px rgba(20, 40, 60, 0.12)); }
.uml .uheadbg { fill: var(--f-call); }
.uml .ubox.main .uheadbg { fill: var(--f-term); }
.uml .ubox.main .ubg { stroke: var(--s-term); }
.uml .usep { stroke: var(--s-call); stroke-width: 1.2; }
.uml .ubox.main .usep { stroke: var(--s-term); }
.uml .uhit { fill: transparent; }
.uml .uname { font: 700 14px var(--font-ui); fill: var(--sh-text); text-anchor: middle; }
.uml .ustereo { font: italic 400 11.5px var(--font-ui); fill: var(--muted); text-anchor: middle; }
.uml .umem { font: 400 12.5px var(--font-mono); fill: var(--sh-text); }
.uml .urow { cursor: pointer; }
.uml .urow:hover .uhit { fill: var(--line-soft); }
.uml .urow.method:hover .uhit { fill: var(--accent-soft); }
.uml .ubox.abstract .uname, .uml .urow.abs .umem { font-style: italic; }
.uml .ubox.warn .ubg { stroke: var(--err); stroke-dasharray: 6 3; }
.uml .uwarn circle { fill: var(--err); }

<script>
/* ==========================================================================
   FlowLab — motore delle espressioni
   Lessico, parser (precedenze compatibili con i file .fprg), valori tipizzati,
   funzioni integrate, valutatore a generatore (per eseguire funzioni utente
   passo-passo dentro le espressioni) e inferenza statica dei tipi.
   ========================================================================== */
'use strict';

class FlowError extends Error {
  constructor(msg, extra) { super(msg); Object.assign(this, extra || {}); }
}

const TYPES = ['Integer', 'Real', 'String', 'Boolean'];
const TYPE_IT = { Integer: 'Intero', Real: 'Reale', String: 'Stringa', Boolean: 'Booleano', None: 'Nessuno', Object: 'Oggetto' };
/* nome leggibile di un tipo: i tipi base in italiano, le classi con il loro nome */
const typeName = (t) => TYPE_IT[t] || t;
const isBaseType = (t) => TYPES.includes(t);

/* ---------------------------- Lessico ---------------------------------- */
const SYM = [
  ['<=', '<='], ['>=', '>='], ['==', '=='], ['!=', '!='], ['<>', '!='], ['&&', 'and'], ['||', 'or'],
  ['≤', '<='], ['≥', '>='], ['≠', '!='], ['∧', 'and'], ['∨', 'or'], ['¬', 'not'],
  ['×', '*'], ['∗', '*'], ['÷', '/'], ['⁄', '/'], ['∕', '/'], ['↑', '^'], ['⭡', '^'], ['−', '-'],
  ['(', '('], [')', ')'], ['[', '['], [']', ']'], [',', ','], ['<', '<'], ['>', '>'], ['=', '=='],
  ['&', '&'], ['+', '+'], ['-', '-'], ['*', '*'], ['/', '/'], ['%', '%'], ['^', '^'], ['!', 'not'], ['.', '.'],
];
const WORD_OPS = { and: 'and', or: 'or', not: 'not', mod: '%' };

function tokenize(src) {
  const toks = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    const start = i;
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      let s = '';
      while (i < n && /[0-9]/.test(src[i])) s += src[i++];
      let real = false;
      if (src[i] === '.' && /[0-9]/.test(src[i + 1] || '')) {
        real = true; s += src[i++];
        while (i < n && /[0-9]/.test(src[i])) s += src[i++];
      } else if (src[i] === '.' && !/[A-Za-z_]/.test(src[i + 1] || '')) {
        real = true; i++; // "3." -> 3.0
      }
      if (/[eE]/.test(src[i] || '') && /[-+0-9]/.test(src[i + 1] || '')) {
        let j = i + 1; let e = 'e';
        if (/[-+]/.test(src[j])) e += src[j++];
        if (/[0-9]/.test(src[j] || '')) {
          while (j < n && /[0-9]/.test(src[j])) e += src[j++];
          s += e; i = j; real = true;
        }
      }
      toks.push({ k: 'num', v: Number(s), real, pos: start, text: s });
      continue;
    }
    if (c === '"' || c === "'") {
      i++;
      let s = '';
      while (i < n && src[i] !== c) s += src[i++];
      if (i >= n) throw new FlowError('Stringa non terminata: manca la virgoletta di chiusura ' + c, { pos: start });
      i++;
      toks.push({ k: 'str', v: s, pos: start });
      continue;
    }
    if (/[\p{L}_]/u.test(c)) {
      let s = '';
      while (i < n && /[\p{L}\p{N}_]/u.test(src[i])) s += src[i++];
      const low = s.toLowerCase();
      if (WORD_OPS[low]) toks.push({ k: 'op', v: WORD_OPS[low], pos: start, text: s });
      else toks.push({ k: 'id', v: s, pos: start });
      continue;
    }
    let matched = false;
    for (const [sym, op] of SYM) {
      if (src.startsWith(sym, i)) {
        toks.push({ k: 'op', v: op, pos: start, text: sym });
        i += sym.length; matched = true; break;
      }
    }
    if (!matched) throw new FlowError(`Carattere non valido "${c}"`, { pos: start });
  }
  toks.push({ k: 'eof', pos: n });
  return toks;
}

/* ----------------------------- Parser ---------------------------------- */
/* Precedenze (dalla più bassa):
   or < and < not < relazionali < & < + - < * / % < ^ < meno unario     */
function parseExpr(src) {
  if (src == null || String(src).trim() === '') throw new FlowError('Espressione vuota');
  const toks = tokenize(String(src));
  let p = 0;
  const peek = () => toks[p];
  const isOp = (v) => toks[p].k === 'op' && toks[p].v === v;
  const eat = (v) => {
    if (!isOp(v)) {
      const t = toks[p];
      throw new FlowError(t.k === 'eof' ? `Manca "${v}" alla fine dell'espressione` : `Atteso "${v}" ma trovato "${t.text ?? t.v}"`, { pos: t.pos });
    }
    return toks[p++];
  };
  const node = (o, t) => { o.pos = t ? t.pos : 0; return o; };

  function orE() {
    let l = andE();
    while (isOp('or')) { const t = toks[p++]; l = node({ k: 'bin', op: 'or', l, r: andE() }, t); }
    return l;
  }
  function andE() {
    let l = notE();
    while (isOp('and')) { const t = toks[p++]; l = node({ k: 'bin', op: 'and', l, r: notE() }, t); }
    return l;
  }
  function notE() {
    if (isOp('not')) { const t = toks[p++]; return node({ k: 'un', op: 'not', e: notE() }, t); }
    return relE();
  }
  function relE() {
    let l = catE();
    while (['==', '!=', '<', '<=', '>', '>='].some(isOp)) {
      const t = toks[p++]; l = node({ k: 'bin', op: t.v, l, r: catE() }, t);
    }
    return l;
  }
  function catE() {
    let l = addE();
    while (isOp('&')) { const t = toks[p++]; l = node({ k: 'bin', op: '&', l, r: addE() }, t); }
    return l;
  }
  function addE() {
    let l = mulE();
    while (isOp('+') || isOp('-')) { const t = toks[p++]; l = node({ k: 'bin', op: t.v, l, r: mulE() }, t); }
    return l;
  }
  function mulE() {
    let l = powE();
    while (isOp('*') || isOp('/') || isOp('%')) { const t = toks[p++]; l = node({ k: 'bin', op: t.v, l, r: powE() }, t); }
    return l;
  }
  function powE() {
    const l = unE();
    if (isOp('^')) { const t = toks[p++]; return node({ k: 'bin', op: '^', l, r: powE() }, t); }
    return l;
  }
  function unE() {
    if (isOp('-')) { const t = toks[p++]; return node({ k: 'un', op: 'neg', e: unE() }, t); }
    if (isOp('+')) { p++; return unE(); }
    if (isOp('not')) { const t = toks[p++]; return node({ k: 'un', op: 'not', e: unE() }, t); }
    return primary();
  }
  function args() {
    eat('(');
    const out = [];
    if (!isOp(')')) {
      out.push(orE());
      while (isOp(',')) { p++; out.push(orE()); }
    }
    eat(')');
    return out;
  }
  function indexList() {
    // indici: v[i]  m[i, j]  m[i][j]  (anche misti)
    const indices = [];
    while (isOp('[')) {
      p++;
      indices.push(orE());
      while (isOp(',')) { p++; indices.push(orE()); }
      eat(']');
    }
    return indices;
  }
  /* atomo seguito da accessi con il punto: p.x  p.sposta(1, 2)  v[i].nome  this.dati[k] */
  function primary() {
    let e = atom();
    while (isOp('.')) {
      p++;
      const t = peek();
      if (t.k !== 'id') throw new FlowError('Dopo il punto serve il nome di un attributo o di un metodo', { pos: t.pos });
      p++;
      if (isOp('(')) { e = node({ k: 'mcall', obj: e, name: t.v, args: args() }, t); continue; }
      if (isOp('[')) { const indices = indexList(); e = node({ k: 'member', obj: e, name: t.v, index: indices[0], indices }, t); continue; }
      e = node({ k: 'member', obj: e, name: t.v }, t);
    }
    return e;
  }
  function atom() {
    const t = peek();

          case 'do': o.line('RIPETI'); o.in(); block(s.body, sc); o.out(); o.line(`MENTRE ${E(s.expression, sc)}`); break;
          case 'for': {
            const st = String(s.step).trim();
            o.line(`PER ${E(s.variable, sc)} DA ${E(s.start, sc)} A ${E(s.end, sc)}${s.direction === 'dec' ? ' INDIETRO' : ''}${st && st !== '1' ? ' PASSO ' + E(st, sc) : ''} ESEGUI`);
            o.in(); block(s.body, sc); o.out(); o.line('FINE PER'); break;
          }
          case 'call': o.line(`CHIAMA ${/\(/.test(s.expression) ? E(s.expression, sc) : fname(s.expression.trim(), sc) + '()'}`); break;
          case 'comment': for (const l of String(s.text).split('\n')) o.line('// ' + l); break;
          case 'breakpoint': o.line(`// punto di interruzione${s.always ? '' : ' se ' + s.expression}`); break;
          case 'open': o.line(`APRI ${E(s.expression, sc)} IN ${s.mode === 'read' ? 'LETTURA' : 'SCRITTURA'}`); break;
          case 'close': o.line(`CHIUDI FILE IN ${s.mode === 'read' ? 'LETTURA' : 'SCRITTURA'}`); break;
          case 'read': o.line(`LEGGI ${E(s.variable, sc)} DAL FILE`); break;
          case 'write': o.line(`SCRIVI ${E(s.expression, sc)} NEL FILE`); break;
        }
      }
    };
    const T = (t) => TIPO[t] || t;
    const psig = (f) => f.params.map((p) => `${p.name} : ${p.array ? ((p.dims || 1) > 1 ? `array a ${p.dims} dimensioni di ` : 'array di ') : ''}${T(p.type)}`).join(', ');
    if (_CM.hasClasses(prog)) {
      const main = _CM.mainClass(prog);
      const V = (v) => _CM.VISIBILITY[v || 'public'];
      OO.ordered(prog, true).forEach((c, ci) => {
        if (ci) o.line('');
        o.line(`${c.abstract ? 'CLASSE ASTRATTA' : 'CLASSE'} ${c.name}${c.parent ? ' EREDITA DA ' + c.parent : ''}${c === main ? '   // classe principale: il programma parte da Main' : ''}`);
        o.in();
        if (c.attributes.length) {
          o.line('ATTRIBUTI'); o.in();
          for (const a of c.attributes) {
            const sc = OO.classScope(prog, c, a.static);
            o.line(`${V(a.visibility)} ${a.name}${a.array ? '[' + _CE.splitTop(a.size).map((x) => E(x, sc)).join(', ') + ']' : ''} : ${T(a.type)}${a.static ? ' STATICO' : ''}${String(a.init || '').trim() ? ' = ' + E(a.init, sc) : ''}`);
          }
          o.out();
        }
        for (const f of [...OO.ctors(prog, c), ...OO.methods(prog, c)]) {
          const sc = buildScope(prog, f);
          const rl = _CM.rets(f);
          o.line('');
          const kw = f.ctor ? 'COSTRUTTORE' : (f.static ? 'METODO STATICO' : f.abstract ? 'METODO ASTRATTO' : 'METODO');
          if (f.abstract) { o.line(`${kw} ${V(f.visibility)} ${f.name}(${psig(f)})${rl.length ? ' : ' + rl.map((r) => T(r.type)).join(', ') : ''}   // senza corpo: lo definiscono le sottoclassi`); continue; }
          o.line(`${kw} ${V(f.visibility)} ${f.name}(${psig(f)})${rl.length ? ' : ' + rl.map((r) => T(r.type)).join(', ') : ''}`);
          o.in(); block(f.body, sc);
          if (rl.length) o.line(`RESTITUISCI ${rl.map((r) => r.name).join(', ')}`);
          o.out(); o.line(f.ctor ? 'FINE COSTRUTTORE' : 'FINE METODO');
        }
        o.out(); o.line('FINE CLASSE');
      });
      return o.text();
    }
    prog.functions.forEach((f, i) => {
      const sc = buildScope(prog, f);
      if (i > 0) o.line('');
      if (i === 0) o.line(`ALGORITMO ${prog.attrs.name ? prog.attrs.name.replace(/\s+/g, '_') : 'Main'}`);
      else {
        const ps = f.params.map((p) => `${p.name} : ${p.array ? ((p.dims || 1) > 1 ? `array a ${p.dims} dimensioni di ` : 'array di ') : ''}${TIPO[p.type]}`).join(', ');
        const rl = _CM.rets(f);
        o.line(!rl.length ? `PROCEDURA ${f.name}(${ps})` : `FUNZIONE ${f.name}(${ps}) : ${rl.map((r) => TIPO[r.type]).join(', ')}`);
      }
      o.in(); block(f.body, sc);
      if (i > 0 && _CM.rets(f).length) o.line(`RESTITUISCI ${_CM.rets(f).map((r) => r.name).join(', ')}`);
      o.out();
      o.line(i === 0 ? 'FINE' : (!_CM.rets(f).length ? 'FINE PROCEDURA' : 'FINE FUNZIONE'));
    });
    return o.text();
  },
};

/* =============================== PYTHON ================================== */
LANGS.python = {

  keywords: ['def', 'return', 'if', 'elif', 'else', 'while', 'for', 'in', 'range', 'and', 'or', 'not', 'True', 'False', 'import', 'break', 'print', 'input', 'int', 'float', 'str', 'len', 'None', 'pass', 'global', 'open', 'with', 'as', 'class', 'self', 'super', 'is', 'elif', 'staticmethod', 'isinstance', 'raise', 'type', 'args', 'abstractmethod', 'from'],
  generate(prog) {
    const used = new Set();
    const L = {
      str: (s) => escStr(s, '"'), T: 'True', F: 'False', pi: 'math.pi', use: (x) => used.add(x === 'pi' ? 'math' : x), not: 'not ', notPrec: P.notLow, or: 'or', and: 'and', pow: '**',
      rel: { '==': '==', '!=': '!=', '<': '<', '<=': '<=', '>': '>', '>=': '>=' },
      nul: 'None', self: 'self', newObj: (c, a) => `${c}(${a})`, superCtor: (a) => `super().__init__(${a})`, superMethod: (m, a) => `super().${m}(${a})`,
      field: (h, sc) => (h.attr.static ? `${h.owner.name}.${h.attr.name}` : `self.${h.attr.name}`),
      bin(n, sc, pr, generic) {

      },
      call(n, sc, pr) {
        const a = n.args.map((x) => pr(x, sc));
        const A = (i) => (a[i] ? a[i].s : '');
        const At = (i) => (a[i] ? (a[i].p < P.atom ? `(${a[i].s})` : a[i].s) : '');
        if (sc.funcs.has(n.name.toLowerCase())) return { s: `${ucall(sc.funcs.get(n.name.toLowerCase()), sc, 'self')}${fname(n.name, sc)}(${a.map((x) => x.s).join(', ')})`, p: P.atom };
        const low = n.name.toLowerCase();
        const M = (f) => { used.add('math'); return { s: `math.${f}(${A(0)})`, p: P.atom }; };
        switch (low) {
          case 'abs': return { s: `abs(${A(0)})`, p: P.atom };
          case 'arccos': return M('acos'); case 'arcsin': return M('asin'); case 'arctan': return M('atan');
          case 'cos': case 'sin': case 'tan': case 'cosh': case 'sinh': case 'tanh': case 'sqrt': case 'log10': return M(low);
          case 'arccosh': return M('acosh'); case 'arcsinh': return M('asinh'); case 'arctanh': return M('atanh');
          case 'ln': case 'log': return M('log');
          case 'int': return { s: `int(${A(0)})`, p: P.atom };
          case 'sgn': return { s: `((${A(0)} > 0) - (${A(0)} < 0))`, p: P.atom };
          case 'random': used.add('random'); return { s: `random.randrange(${A(0)})`, p: P.atom };
          case 'len': return { s: `len(${A(0)})`, p: P.atom };
          case 'size': return { s: `len(${A(0)}${'[0]'.repeat(sizeInfo(n, sc).d)})`, p: P.atom };
          case 'char': return { s: `${At(0)}[${A(1)}]`, p: P.atom };
          case 'tochar': return { s: `chr(${A(0)})`, p: P.atom };
          case 'tocode': return { s: `ord(${A(0)})`, p: P.atom };
          case 'tofixed': return { s: `"{:.{}f}".format(${A(0)}, ${A(1)})`, p: P.atom };

    };
    const pr = exprPrinter(L);
    const E = (src, sc) => { const t = tryParse(src); return t ? pr(t, sc).s : src; };
    const DEF = { Integer: '0', Real: '0.0', String: '""', Boolean: 'False' };
    const DEFT = (t) => DEF[t] || 'None';
    const CAST = { Integer: 'int(input())', Real: 'float(input())', String: 'input()', Boolean: 'input().strip().lower() == "true"' };
    const lvType = (v, sc) => lvTypeOf(v, sc);
    const body = new Out();
    const block = (stmts, sc, o) => {
      const start = o.lines.length;
      for (let si = 0; si < stmts.length; si++) {
        const s = stmts[si];
        switch (s.kind) {
          case 'const': o.line(`${vname(s.name.trim(), sc)} = ${E(s.expression, sc)}  # costante`); break;
          case 'declare': {
            const init = initOf(s, stmts[si + 1]);
            if (init != null) { o.line(`${s.name.trim()} = ${asReal(init, s.type, E, sc)}`); si++; break; }
            for (const nm of s.name.split(',').map((x) => x.trim()).filter(Boolean)) {
              if (!s.array) { o.line(`${nm} = ${DEFT(s.type)}`); continue; }
              const D = dimsOf(s, E, sc);
              let init = `[${DEFT(s.type)}] * (${D[D.length - 1]})`;
              for (let k = D.length - 2; k >= 0; k--) init = `[${init} for _ in range(${D[k]})]`;
              o.line(`${nm} = ${init}`);
            }
            break;
          }
          case 'assign': { const tg = targetsOf(s); o.line(`${tg.map((x) => E(x, sc)).join(', ')} = ${tg.length === 1 ? asReal(s.expression, lvType(s.variable, sc), E, sc) : E(s.expression, sc)}`); break; }
          case 'input': o.line(`${E(s.variable, sc)} = ${CAST[lvType(s.variable, sc)]}`); break;
          case 'output': o.line(s.newline ? `print(${E(s.expression, sc)})` : `print(${E(s.expression, sc)}, end="")`); break;
          case 'if': {
            o.line(`if ${E(s.expression, sc)}:`); o.in(); block(s.then, sc, o); o.out();
            if (s.else.length === 1 && s.else[0].kind === 'if') {
              // catena elif
              let cur = s.else[0];
              for (;;) {
                o.line(`elif ${E(cur.expression, sc)}:`); o.in(); block(cur.then, sc, o); o.out();
                if (cur.else.length === 1 && cur.else[0].kind === 'if') { cur = cur.else[0]; continue; }
                if (cur.else.length) { o.line('else:'); o.in(); block(cur.else, sc, o); o.out(); }
                break;
              }
            } else if (s.else.length) { o.line('else:'); o.in(); block(s.else, sc, o); o.out(); }
            break;
          }
          case 'while': o.line(`while ${E(s.expression, sc)}:`); o.in(); block(s.body, sc, o); o.out(); break;
          case 'do': {
            o.line('while True:'); o.in(); block(s.body, sc, o);
            const t = tryParse(s.expression); const c = t ? pr(t, sc) : { s: s.expression, p: 0 };
            o.line(`if not ${c.p <= P.notLow ? '(' + c.s + ')' : c.s}:`); o.in(); o.line('break'); o.out(); o.out();
            break;
          }
          case 'for': {
            const step = String(s.step).trim() || '1';
            const isReal = lvType(s.variable, sc) === 'Real';
            if (isReal) {
              o.line(`${E(s.variable, sc)} = ${E(s.start, sc)}`);
              o.line(`while ${E(s.variable, sc)} ${s.direction === 'dec' ? '>=' : '<='} ${E(s.end, sc)}:`); o.in(); block(s.body, sc, o);
              o.line(`${E(s.variable, sc)} ${s.direction === 'dec' ? '-=' : '+='} ${E(step, sc)}`); o.out();
            } else {
              const endT = tryParse(s.end); const endP = endT ? pr(endT, sc) : { s: s.end, p: 0 };
              const endS = endP.p < P.add ? `(${endP.s})` : endP.s;
              const lim = s.direction === 'dec' ? `${endS} - 1` : `${endS} + 1`;
              const stepS = step === '1' ? '' : `, ${s.direction === 'dec' ? '-' : ''}${E(step, sc)}`;
              o.line(`for ${E(s.variable, sc)} in range(${E(s.start, sc)}, ${lim}${s.direction === 'dec' && step === '1' ? ', -1' : stepS}):`);
              o.in(); block(s.body, sc, o); o.out();
            }
            break;
          }
          case 'call': o.line(/\(/.test(s.expression) ? E(s.expression, sc) : fname(s.expression.trim(), sc) + '()'); break;
          case 'comment': for (const l of String(s.text).split('\n')) o.line('# ' + l); break;
          case 'breakpoint': o.line(`# punto di interruzione${s.always ? '' : ': ' + s.expression}`); break;
          case 'open': used.add('files'); o.line(s.mode === 'read' ? `file_lettura = open(${E(s.expression, sc)}, "r")` : `file_scrittura = open(${E(s.expression, sc)}, "w")`); break;
          case 'close': used.add('files'); o.line(s.mode === 'read' ? 'file_lettura.close()' : 'file_scrittura.close()'); break;
          case 'read': {
            used.add('files'); const t = lvType(s.variable, sc);
            const raw = 'file_lettura.readline().rstrip("\\n")';
            o.line(`${E(s.variable, sc)} = ${t === 'Integer' ? `int(${raw})` : t === 'Real' ? `float(${raw})` : t === 'Boolean' ? `${raw}.lower() == "true"` : raw}`);
            break;
          }
          case 'write': used.add('files'); o.line(`file_scrittura.write(str(${E(s.expression, sc)}) + "\\n")`); break;
        }
      }
      if (o.lines.length === start) o.line('pass');
    };
    const pyArr = (D, def) => { let init = `[${def}] * (${D[D.length - 1]})`; for (let k = D.length - 2; k >= 0; k--) init = `[${init} for _ in range(${D[k]})]`; return init; };
    const head = () => {
      const hd = [];
      if (prog.attrs.name) hd.push(`# ${prog.attrs.name}`);
      if (used.has('math')) hd.push('import math');
      if (used.has('random')) hd.push('import random');
      if (used.has('abc')) hd.push('from abc import ABC, abstractmethod');
      if (hd.length) hd.push('');
      if (used.has('eof')) hd.push('def fine_file():', '    pos = file_lettura.tell()', '    riga = file_lettura.readline()', '    file_lettura.seek(pos)', '    return riga == ""', '', '');
      return hd.join('\n') + (hd.length ? '\n' : '');
    };
    if (_CM.hasClasses(prog)) {
      // ---------------- programma a oggetti ----------------
      const o = new Out();
      const main = _CM.mainClass(prog);
      const attrInit = (a, sc) => (a.array ? pyArr(_CE.splitTop(a.size).map((x) => E(x, sc)), DEFT(a.type)) : (String(a.init || '').trim() ? E(a.init, sc) : DEFT(a.type)));
      const pyType = { Integer: (x) => `type(${x}) is int`, Real: (x) => `isinstance(${x}, (int, float))`, String: (x) => `isinstance(${x}, str)`, Boolean: (x) => `isinstance(${x}, bool)` };
      const test = { len: (n) => `len(args) == ${n}`, type: (p, i) => (p.array ? `isinstance(args[${i}], list)` : (pyType[p.type] || ((x) => `isinstance(${x}, ${p.type})`))(`args[${i}]`)) };
      for (const c of OO.ordered(prog, false)) {
        // classe astratta: deriva da ABC (se la madre non lo è già)
        const par = _CM.classByName(prog, c.parent);
        const bases = [...(c.parent ? [c.parent] : []), ...(c.abstract && !(par && _CM.chainOf(prog, par).some((k) => k.abstract)) ? ['ABC'] : [])];
        if (c.abstract) used.add('abc');
        o.line(`class ${c.name}${bases.length ? `(${bases.join(', ')})` : ''}:`); o.in();
        const start = o.lines.length;
        for (const a of c.attributes.filter((x) => x.static)) o.line(`${a.name} = ${attrInit(a, OO.classScope(prog, c, true))}  # statico, ${OO.tag(a.visibility)}`);
        const inst = c.attributes.filter((x) => !x.static);
        const fieldLines = (out) => { const sc = OO.classScope(prog, c, false); for (const a of inst) out.line(`self.${a.name} = ${attrInit(a, sc)}${a.visibility !== 'public' ? '  # ' + OO.tag(a.visibility) : ''}`); };
        // corpo di un costruttore: super, attributi, blocchi
        const ctorBody = (f, out) => {
          const sp = OO.splitSuper(f); const sc = buildScope(prog, f);
          if (sp.args) out.line(`super().__init__(${sp.args.map((x) => pr(x, sc).s).join(', ')})`);

          fieldLines(out);
          block(sp.rest, sc, out);
          if (out.lines[out.lines.length - 1].trim() === 'pass' && out.lines.length > 1 && /self\.|super\(\)/.test(out.lines[out.lines.length - 2])) out.lines.pop();
        };
        const methodBody = (f, out) => {
          if (f.abstract) { out.line(`raise NotImplementedError("${f.name}() è astratto: lo definiscono le sottoclassi")`); return; }
          const before = out.lines.length;
          block(f.body, buildScope(prog, f), out);
          const rl = _CM.rets(f);
          if (rl.length) {
            if (out.lines.length === before + 1 && out.lines[out.lines.length - 1].trim() === 'pass') out.lines.pop();
            out.line(`return ${rl.map((r) => r.name).join(', ')}`);
          }
        };
        const ctors = OO.ctors(prog, c);
        if (!ctors.length && (inst.length || c.parent)) {
          if (o.lines.length > start) o.line('');

          if (o.lines.length > start) o.line('');
          const f0 = group[0];
          const isStatic = !isCtor && f0.static;
          const name = isCtor ? '__init__' : (OO.isMain(prog, f0) ? 'main' : f0.name);
          const note = (f) => ((f.visibility || 'public') !== 'public' ? '  # ' + OO.tag(f.visibility) : '');
          if (isStatic) o.line('@staticmethod');
          if (group.length === 1 && f0.abstract) {
            used.add('abc');
            o.line('@abstractmethod');
            o.line(`def ${name}(${['self', ...f0.params.map((x) => x.name)].join(', ')}):${note(f0)}`);
            o.in(); o.line('pass'); o.out();
            return;
          }
          if (group.length === 1) {
            o.line(`def ${name}(${[...(isStatic ? [] : ['self']), ...f0.params.map((x) => x.name)].join(', ')}):${note(f0)}`);
            o.in(); (isCtor ? ctorBody : methodBody)(f0, o); o.out();
            return;
          }
          // overloading: si sceglie la versione dal numero e dal tipo degli argomenti
          o.line(`def ${name}(${isStatic ? '' : 'self, '}*args):  # ${group.length} versioni${note(f0)}`); o.in();
          group.forEach((f, k) => {
            o.line(`${k ? 'elif' : 'if'} ${dispatchCond(f, group, ' and ', test)}:`); o.in();
            if (f.params.length) o.line(`${f.params.map((x) => x.name).join(', ')}${f.params.length === 1 ? ',' : ''} = args`);
            (isCtor ? ctorBody : methodBody)(f, o); o.out();
          });
          o.line('else:'); o.in(); o.line(`raise TypeError("${isCtor ? c.name : f0.name}: nessuna versione accetta questi argomenti")`); o.out();
          o.out();
        };
        if (ctors.length) emitGroup(ctors, true);
        for (const g of OO.groups(OO.methods(prog, c))) emitGroup(g, false);
        if (o.lines.length === start) o.line('pass');
        o.out(); o.line(''); o.line('');
      }
      o.line(`${main.name}.main()`);
      return head() + o.text();
    }
    const funcs = new Out();
    prog.functions.slice(1).forEach((f) => {
      const sc = buildScope(prog, f);
      funcs.line(`def ${f.name}(${f.params.map((p) => p.name).join(', ')}):`);
      funcs.in();
      const before = funcs.lines.length;
      block(f.body, sc, funcs);
      const rl = _CM.rets(f);
      if (rl.length) {
        if (funcs.lines.length === before + 1 && funcs.lines[funcs.lines.length - 1].trim() === 'pass') funcs.lines.pop();
        funcs.line(`return ${rl.map((r) => r.name).join(', ')}`);
      }
      funcs.out(); funcs.line(''); funcs.line('');
    });
    const main = prog.functions[0];
    block(main.body, buildScope(prog, main), body);
    return head() + (funcs.lines.length ? funcs.text() : '') + '# Main\n' + body.text();
  },
};

/* ======================== Famiglia C (C++, Java, C#, JS) ================= */
function cFamily(cfg) {
  return {
    label: cfg.label, ext: cfg.ext, comment: '//', keywords: cfg.keywords,
    generate(prog) {
      const used = new Set();
      const L = {
        idx: cfg.idx, str: (s) => cfg.strLit(s), T: 'true', F: 'false', pi: cfg.pi, use: () => used.add('pi'),
        not: '!', notPrec: P.un, or: '||', and: '&&', pow: '**',
        rel: { '==': cfg.eq || '==', '!=': cfg.neq || '!=', '<': '<', '<=': '<=', '>': '>', '>=': '>=' },
        nul: cfg.nul, self: cfg.self, arrow: cfg.arrow, staticSep: cfg.staticSep, newObj: cfg.newObj, superCtor: cfg.superCtor, superMethod: cfg.superMethod, field: cfg.field,
        bin(n, sc, pr) {
          const lt = _CE.inferType(n.l, sc), rt = _CE.inferType(n.r, sc);
