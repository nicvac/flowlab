/* funzione chiamata a destra di un'assegnazione multipla */
function calleeOf(s, sc) { const e = strip(tryParse(s.expression)); const g = e && e.k === 'call' && sc.funcs.get(e.name.toLowerCase()); return g ? g.f : null; }
/* nome come è stato dichiarato (il formato .fprg non distingue maiuscole e minuscole, i linguaggi sì) */
const vname = (n, sc) => { const v = sc.vars.get(String(n).toLowerCase()); return v ? v.name : n; };
const fname = (n, sc) => { const f = sc.funcs.get(String(n).toLowerCase()); return f ? f.name : n; };

/* --------------------------- Linguaggi ----------------------------------- */
const LANGS = {};

function escStr(s, q) { return q + s.replace(/\\/g, '\\\\').replace(new RegExp(q, 'g'), '\\' + q) + q; }

/* Stampa generica di espressioni, con regole per linguaggio */
function exprPrinter(L) {
  function pr(n, sc) {
    switch (n.k) {
      case 'par': return pr(n.e, sc);
      case 'num': return { s: n.t === 'Real' ? (n.text && /[.eE]/.test(n.text) ? n.text : String(n.v) + '.0') : String(n.v), p: P.atom };
      case 'str': return { s: L.str(n.v), p: P.atom };
      case 'bool': return { s: n.v ? L.T : L.F, p: P.atom };
      case 'pi': L.use && L.use('pi'); return { s: L.pi, p: P.atom };
      case 'var': { const nm = vname(n.name, sc); return { s: n.index ? `${nm}[${pr(n.index, sc).s}]` : nm, p: P.atom }; }
      case 'un':
        if (n.op === 'neg') { const e = pr(n.e, sc); return { s: '-' + (e.p < P.un ? `(${e.s})` : e.s), p: P.un }; }
        { const np = L.notPrec; const e = pr(n.e, sc); return { s: L.not + (e.p < np || (np === P.un && e.p === P.un && e.s[0] === '-') ? `(${e.s})` : e.s), p: np }; }
      case 'call': return L.call(n, sc, pr);
      case 'bin': return bin(n, sc);
    }
    return { s: '?', p: P.atom };
  }
  function wrap(x, cond) { return cond ? `(${x.s})` : x.s; }
  function generic(n, sc, opText, prec, assoc) {
    const l = pr(n.l, sc), r = pr(n.r, sc);
    const ls = wrap(l, assoc === 'right' ? l.p <= prec : (assoc === 'none' ? l.p <= prec : l.p < prec));
    const rs = wrap(r, assoc === 'right' ? r.p < prec : r.p <= prec);
    return { s: `${ls} ${opText} ${rs}`, p: prec };
  }
  function bin(n, sc) {
    const op = n.op;
    if (L.bin) { const r = L.bin(n, sc, pr, generic); if (r) return r; }
    if (op === 'or') return generic(n, sc, L.or, P.or, 'left');
    if (op === 'and') return generic(n, sc, L.and, P.and, 'left');
    if (REL.includes(op)) return generic(n, sc, L.rel[op], P.rel, 'none');
    if (op === '+' || op === '-') return generic(n, sc, op, P.add, 'left');
    if (op === '*') return generic(n, sc, '*', P.mul, 'left');
    if (op === '/') return generic(n, sc, '/', P.mul, 'left');
    if (op === '%') return generic(n, sc, L.mod || '%', P.mul, 'left');
    if (op === '^') return generic(n, sc, L.pow, P.pow, 'right');
    return { s: '?', p: P.atom };
  }
  return pr;
}

/* Elenco piatto degli operandi di una catena di & */
function concatParts(n) {
  n = strip(n);
  if (n.k === 'bin' && n.op === '&') return [...concatParts(n.l), ...concatParts(n.r)];
  return [n];
}

/* ------------------------------ Emettitore ------------------------------- */
class Out {
  constructor(ind) { this.lines = []; this.lvl = 0; this.ind = ind || '    '; }
  line(s) { this.lines.push(s === '' ? '' : this.ind.repeat(this.lvl) + s); }
  in() { this.lvl++; } out() { this.lvl--; }
  text() { return this.lines.join('\n') + '\n'; }
}

/* ============================ PSEUDOCODICE =============================== */
const TIPO = { Integer: 'intero', Real: 'reale', String: 'stringa', Boolean: 'booleano' };
LANGS.pseudo = {
  label: 'Pseudocodice', ext: 'txt', comment: '//',
  keywords: ['ALGORITMO', 'FINE', 'FUNZIONE', 'PROCEDURA', 'VARIABILI', 'SE', 'ALLORA', 'ALTRIMENTI', 'MENTRE', 'ESEGUI', 'PER', 'DA', 'A', 'PASSO', 'RIPETI', 'LEGGI', 'SCRIVI', 'CHIAMA', 'RESTITUISCI', 'AND', 'OR', 'NOT', 'MOD', 'VERO', 'FALSO', 'DICHIARA', 'ARRAY', 'DI', 'INDIETRO', 'APRI', 'CHIUDI', 'IN', 'LETTURA', 'SCRITTURA'],
  generate(prog) {
    const L = {
      str: (s) => '"' + s + '"', T: 'VERO', F: 'FALSO', pi: 'π', not: 'NOT ', notPrec: P.un, or: 'OR', and: 'AND', mod: 'MOD', pow: '^',
      rel: { '==': '=', '!=': '≠', '<': '<', '<=': '≤', '>': '>', '>=': '≥' },

    const E = (src, sc) => { const t = tryParse(src); return t ? pr(t, sc).s : src; };
    const block = (stmts, sc) => {
      for (const s of stmts) {
        switch (s.kind) {
          case 'const': o.line(`COSTANTE ${s.name} : ${TIPO[s.type]} = ${E(s.expression, sc)}`); break;
          case 'declare': o.line(`DICHIARA ${s.array ? `ARRAY ${s.name.split(',').map((x) => x.trim() + '[' + E(s.size, sc) + ']').join(', ')} DI ${TIPO[s.type]}` : `${s.name} : ${TIPO[s.type]}`}`); break;
          case 'assign': o.line(`${targetsOf(s).map((x) => E(x, sc)).join(', ')} ← ${E(s.expression, sc)}`); break;
          case 'input': o.line(`LEGGI ${E(s.variable, sc)}`); break;
          case 'output': o.line(`SCRIVI ${E(s.expression, sc)}${s.newline ? '' : '   // senza a capo'}`); break;

            o.line('FINE SE'); break;
          case 'while': o.line(`MENTRE ${E(s.expression, sc)} ESEGUI`); o.in(); block(s.body, sc); o.out(); o.line('FINE MENTRE'); break;
          case 'do': o.line('RIPETI'); o.in(); block(s.body, sc); o.out(); o.line(`MENTRE ${E(s.expression, sc)}`); break;
          case 'for': {
            const st = String(s.step).trim();
            o.line(`PER ${E(s.variable, sc)} DA ${E(s.start, sc)} A ${E(s.end, sc)}${s.direction === 'dec' ? ' INDIETRO' : ''}${st && st !== '1' ? ' PASSO ' + E(st, sc) : ''} ESEGUI`);

          case 'comment': for (const l of String(s.text).split('\n')) o.line('// ' + l); break;
          case 'breakpoint': o.line(`// punto di interruzione${s.always ? '' : ' se ' + s.expression}`); break;
          case 'open': o.line(`APRI ${E(s.expression, sc)} IN ${s.mode === 'read' ? 'LETTURA' : 'SCRITTURA'}`); break;
          case 'close': o.line(`CHIUDI FILE IN ${s.mode === 'read' ? 'LETTURA' : 'SCRITTURA'}`); break;
          case 'read': o.line(`LEGGI ${E(s.variable, sc)} DAL FILE`); break;

    };
    prog.functions.forEach((f, i) => {
      const sc = buildScope(prog, f);
      if (i > 0) o.line('');
      if (i === 0) o.line(`ALGORITMO ${prog.attrs.name ? prog.attrs.name.replace(/\s+/g, '_') : 'Main'}`);
      else {
        const ps = f.params.map((p) => `${p.name} : ${p.array ? 'array di ' : ''}${TIPO[p.type]}`).join(', ');
        const rl = _CM.rets(f);
        o.line(!rl.length ? `PROCEDURA ${f.name}(${ps})` : `FUNZIONE ${f.name}(${ps}) : ${rl.map((r) => TIPO[r.type]).join(', ')}`);
      }
      o.in(); block(f.body, sc);
      if (i > 0 && _CM.rets(f).length) o.line(`RESTITUISCI ${_CM.rets(f).map((r) => r.name).join(', ')}`);
      o.out();
      o.line(i === 0 ? 'FINE' : (!_CM.rets(f).length ? 'FINE PROCEDURA' : 'FINE FUNZIONE'));
    });
    return o.text();
  },
};

/* =============================== PYTHON ================================== */
LANGS.python = {
  label: 'Python', ext: 'py', comment: '#',
  keywords: ['def', 'return', 'if', 'elif', 'else', 'while', 'for', 'in', 'range', 'and', 'or', 'not', 'True', 'False', 'import', 'break', 'print', 'input', 'int', 'float', 'str', 'len', 'None', 'pass', 'global', 'open', 'with', 'as'],
  generate(prog) {
    const used = new Set();
    const L = {
      str: (s) => escStr(s, '"'), T: 'True', F: 'False', pi: 'math.pi', use: (x) => used.add(x === 'pi' ? 'math' : x), not: 'not ', notPrec: P.notLow, or: 'or', and: 'and', pow: '**',
      rel: { '==': '==', '!=': '!=', '<': '<', '<=': '<=', '>': '>', '>=': '>=' },
      bin(n, sc, pr) {
        if (n.op === '&') {
          const parts = concatParts(n).map((x) => { const t = _CE.inferType(x, sc); const e = pr(x, sc); return t === 'String' ? (e.p <= P.add ? `(${e.s})` : e.s) : `str(${e.s})`; });
          return { s: parts.join(' + '), p: P.add };
        }
        return null;
      },
      call(n, sc, pr) {
        const a = n.args.map((x) => pr(x, sc));
        const A = (i) => (a[i] ? a[i].s : '');
        const At = (i) => (a[i] ? (a[i].p < P.atom ? `(${a[i].s})` : a[i].s) : '');
        if (sc.funcs.has(n.name.toLowerCase())) return { s: `${fname(n.name, sc)}(${a.map((x) => x.s).join(', ')})`, p: P.atom };
        const low = n.name.toLowerCase();
        const M = (f) => { used.add('math'); return { s: `math.${f}(${A(0)})`, p: P.atom }; };
        switch (low) {
          case 'abs': return { s: `abs(${A(0)})`, p: P.atom };
          case 'arccos': return M('acos'); case 'arcsin': return M('asin'); case 'arctan': return M('atan');
          case 'cos': case 'sin': case 'tan': case 'cosh': case 'sinh': case 'tanh': case 'sqrt': case 'log10': return M(low);
          case 'arccosh': return M('acosh'); case 'arcsinh': return M('asinh'); case 'arctanh': return M('atanh');
          case 'ln': case 'log': return M('log');
          case 'int': return { s: `int(${A(0)})`, p: P.atom };
          case 'sgn': return { s: `((${A(0)} > 0) - (${A(0)} < 0))`, p: P.atom };
          case 'random': used.add('random'); return { s: `random.randrange(${A(0)})`, p: P.atom };
          case 'len': case 'size': return { s: `len(${A(0)})`, p: P.atom };
          case 'char': return { s: `${At(0)}[${A(1)}]`, p: P.atom };
          case 'tochar': return { s: `chr(${A(0)})`, p: P.atom };
          case 'tocode': return { s: `ord(${A(0)})`, p: P.atom };
          case 'tofixed': return { s: `"{:.{}f}".format(${A(0)}, ${A(1)})`, p: P.atom };
          case 'tointeger': return { s: `int(${A(0)})`, p: P.atom };
          case 'toreal': return { s: `float(${A(0)})`, p: P.atom };
          case 'tostring': return { s: `str(${A(0)})`, p: P.atom };
          case 'eof': used.add('eof'); return { s: 'fine_file()', p: P.atom };
        }
        return { s: `${n.name}(${a.map((x) => x.s).join(', ')})`, p: P.atom };
      },
    };
    const pr = exprPrinter(L);
    const E = (src, sc) => { const t = tryParse(src); return t ? pr(t, sc).s : src; };
    const DEF = { Integer: '0', Real: '0.0', String: '""', Boolean: 'False' };
    const CAST = { Integer: 'int(input())', Real: 'float(input())', String: 'input()', Boolean: 'input().strip().lower() == "true"' };
    const lvType = (v, sc) => { const t = tryParse(v); const x = t && strip(t); return x && sc.vars.get(x.name.toLowerCase()) ? sc.vars.get(x.name.toLowerCase()).type : 'String'; };
    const body = new Out();
    const block = (stmts, sc, o) => {
      const start = o.lines.length;
      for (const s of stmts) {
        switch (s.kind) {
          case 'const': o.line(`${vname(s.name.trim(), sc)} = ${E(s.expression, sc)}  # costante`); break;
          case 'declare':
            for (const nm of s.name.split(',').map((x) => x.trim()).filter(Boolean)) o.line(s.array ? `${nm} = [${DEF[s.type]}] * (${E(s.size, sc)})` : `${nm} = ${DEF[s.type]}`);
            break;
          case 'assign': o.line(`${targetsOf(s).map((x) => E(x, sc)).join(', ')} = ${E(s.expression, sc)}`); break;
          case 'input': o.line(`${E(s.variable, sc)} = ${CAST[lvType(s.variable, sc)]}`); break;
          case 'output': o.line(s.newline ? `print(${E(s.expression, sc)})` : `print(${E(s.expression, sc)}, end="")`); break;
          case 'if': {
            o.line(`if ${E(s.expression, sc)}:`); o.in(); block(s.then, sc, o); o.out();
            if (s.else.length === 1 && s.else[0].kind === 'if') {
              // catena elif
              let cur = s.else[0];
              for (;;) {
                o.line(`elif ${E(cur.expression, sc)}:`); o.in(); block(cur.then, sc, o); o.out();
                if (cur.else.length === 1 && cur.else[0].kind === 'if') { cur = cur.else[0]; continue; }
                if (cur.else.length) { o.line('else:'); o.in(); block(cur.else, sc, o); o.out(); }
                break;
              }
            } else if (s.else.length) { o.line('else:'); o.in(); block(s.else, sc, o); o.out(); }
            break;
          }
          case 'while': o.line(`while ${E(s.expression, sc)}:`); o.in(); block(s.body, sc, o); o.out(); break;
          case 'do': {
            o.line('while True:'); o.in(); block(s.body, sc, o);
            const t = tryParse(s.expression); const c = t ? pr(t, sc) : { s: s.expression, p: 0 };
            o.line(`if not ${c.p <= P.notLow ? '(' + c.s + ')' : c.s}:`); o.in(); o.line('break'); o.out(); o.out();
            break;
          }
          case 'for': {
            const step = String(s.step).trim() || '1';
            const isReal = lvType(s.variable, sc) === 'Real';
            if (isReal) {
              o.line(`${E(s.variable, sc)} = ${E(s.start, sc)}`);
              o.line(`while ${E(s.variable, sc)} ${s.direction === 'dec' ? '>=' : '<='} ${E(s.end, sc)}:`); o.in(); block(s.body, sc, o);
              o.line(`${E(s.variable, sc)} ${s.direction === 'dec' ? '-=' : '+='} ${E(step, sc)}`); o.out();
            } else {
              const endT = tryParse(s.end); const endP = endT ? pr(endT, sc) : { s: s.end, p: 0 };
              const endS = endP.p < P.add ? `(${endP.s})` : endP.s;
              const lim = s.direction === 'dec' ? `${endS} - 1` : `${endS} + 1`;
              const stepS = step === '1' ? '' : `, ${s.direction === 'dec' ? '-' : ''}${E(step, sc)}`;
              o.line(`for ${E(s.variable, sc)} in range(${E(s.start, sc)}, ${lim}${s.direction === 'dec' && step === '1' ? ', -1' : stepS}):`);
              o.in(); block(s.body, sc, o); o.out();
            }
            break;
          }
          case 'call': o.line(/\(/.test(s.expression) ? E(s.expression, sc) : fname(s.expression.trim(), sc) + '()'); break;
          case 'comment': for (const l of String(s.text).split('\n')) o.line('# ' + l); break;
          case 'breakpoint': o.line(`# punto di interruzione${s.always ? '' : ': ' + s.expression}`); break;
          case 'open': used.add('files'); o.line(s.mode === 'read' ? `file_lettura = open(${E(s.expression, sc)}, "r")` : `file_scrittura = open(${E(s.expression, sc)}, "w")`); break;
          case 'close': used.add('files'); o.line(s.mode === 'read' ? 'file_lettura.close()' : 'file_scrittura.close()'); break;
          case 'read': {
            used.add('files'); const t = lvType(s.variable, sc);
            const raw = 'file_lettura.readline().rstrip("\\n")';
            o.line(`${E(s.variable, sc)} = ${t === 'Integer' ? `int(${raw})` : t === 'Real' ? `float(${raw})` : t === 'Boolean' ? `${raw}.lower() == "true"` : raw}`);
            break;
          }
          case 'write': used.add('files'); o.line(`file_scrittura.write(str(${E(s.expression, sc)}) + "\\n")`); break;
        }
      }
      if (o.lines.length === start) o.line('pass');
    };
    const funcs = new Out();
    prog.functions.slice(1).forEach((f) => {
      const sc = buildScope(prog, f);
      funcs.line(`def ${f.name}(${f.params.map((p) => p.name).join(', ')}):`);
      funcs.in();
      const before = funcs.lines.length;
      block(f.body, sc, funcs);
      const rl = _CM.rets(f);
      if (rl.length) {
        if (funcs.lines.length === before + 1 && funcs.lines[funcs.lines.length - 1].trim() === 'pass') funcs.lines.pop();
        funcs.line(`return ${rl.map((r) => r.name).join(', ')}`);
      }
      funcs.out(); funcs.line(''); funcs.line('');
    });
    const main = prog.functions[0];
    block(main.body, buildScope(prog, main), body);
    const head = [];
    if (prog.attrs.name) head.push(`# ${prog.attrs.name}`);
    if (used.has('math')) head.push('import math');
    if (used.has('random')) head.push('import random');
    if (head.length) head.push('');
    if (used.has('eof')) head.push('def fine_file():', '    pos = file_lettura.tell()', '    riga = file_lettura.readline()', '    file_lettura.seek(pos)', '    return riga == ""', '', '');
    let txt = head.join('\n') + (head.length ? '\n' : '') + (funcs.lines.length ? funcs.text() : '') + '# Main\n' + body.text();
    return txt;
  },
};

/* ======================== Famiglia C (C++, Java, C#, JS) ================= */
function cFamily(cfg) {
  return {
    label: cfg.label, ext: cfg.ext, comment: '//', keywords: cfg.keywords,
    generate(prog) {
      const used = new Set();
      const L = {
        str: (s) => cfg.strLit(s), T: 'true', F: 'false', pi: cfg.pi, use: () => used.add('pi'),
        not: '!', notPrec: P.un, or: '||', and: '&&', pow: '**',
        rel: { '==': cfg.eq || '==', '!=': cfg.neq || '!=', '<': '<', '<=': '<=', '>': '>', '>=': '>=' },
        bin(n, sc, pr) {
          const lt = _CE.inferType(n.l, sc), rt = _CE.inferType(n.r, sc);
          if (n.op === '&') {
            const parts = concatParts(n).map((x) => cfg.toStr(x, _CE.inferType(x, sc), pr(x, sc), used));
            if (cfg.concatPrefix && _CE.inferType(concatParts(n)[0], sc) !== 'String') parts.unshift(cfg.concatPrefix);
            return { s: parts.join(' + '), p: P.add };
          }
          if (n.op === '/' && cfg.intDiv && lt !== 'Real' && rt !== 'Real') {
            const l = pr(n.l, sc), r = pr(n.r, sc);
            return { s: `(double) ${l.p < P.atom ? '(' + l.s + ')' : l.s} / ${r.p <= P.mul ? '(' + r.s + ')' : r.s}`, p: P.mul };
          }
          if (n.op === '%' && cfg.fmod && (lt === 'Real' || rt === 'Real')) return { s: `fmod(${pr(n.l, sc).s}, ${pr(n.r, sc).s})`, p: P.atom };
          if (n.op === '^' && cfg.powFn) {
            const s = `${cfg.powFn}(${pr(n.l, sc).s}, ${pr(n.r, sc).s})`;
            return _CE.inferType(n, sc) === 'Integer' && cfg.intCast ? { s: `${cfg.intCast}${s}`, p: P.un } : { s, p: P.atom };
          }
          if (n.op === '^') { // JavaScript **
            const l = pr(n.l, sc), r = pr(n.r, sc);
            return { s: `${l.p <= P.pow ? '(' + l.s + ')' : l.s} ** ${r.p < P.pow ? '(' + r.s + ')' : r.s}`, p: P.pow };
          }
          if (REL.includes(n.op) && lt === 'String' && rt === 'String' && cfg.strCmp) return cfg.strCmp(n.op, pr(n.l, sc), pr(n.r, sc));
          return null;
        },
        call(n, sc, pr) {
          const a = n.args.map((x) => pr(x, sc));
          if (sc.funcs.has(n.name.toLowerCase())) return { s: `${fname(n.name, sc)}(${a.map((x) => x.s).join(', ')})`, p: P.atom };
          const low = n.name.toLowerCase();
          const r = cfg.builtin(low, a, n, sc, used);
          if (r) return typeof r === 'string' ? { s: r, p: P.atom } : r;
          return { s: `${n.name}(${a.map((x) => x.s).join(', ')})`, p: P.atom };
        },
      };
      const pr = exprPrinter(L);
      const E = (src, sc) => { const t = tryParse(src); return t ? pr(t, sc).s : src; };
      const lvInfo = (v, sc) => { const t = tryParse(v); const x = t && strip(t); return (x && sc.vars.get(x.name.toLowerCase())) || { type: 'String' }; };
      const blk = (o, stmts, sc) => { o.in(); block(o, stmts, sc); o.out(); };
      const unsupported = (o, what) => o.line(`// [${what}: non disponibile in ${cfg.label}]`);
      function block(o, stmts, sc) {
        for (const s of stmts) {
          switch (s.kind) {
            case 'const': o.line(cfg.constDecl(s.name.trim(), s.type, E(s.expression, sc), isLiteralExpr(s.expression))); break;
            case 'declare':
              for (const nm of s.name.split(',').map((x) => x.trim()).filter(Boolean)) o.line(cfg.declare(nm, s.type, s.array, s.array ? E(s.size, sc) : null));
              break;
            case 'assign': {
              const tg = targetsOf(s);
              if (tg.length > 1) cfg.multiAssign(o, tg.map((x) => E(x, sc)), E(s.expression, sc), calleeOf(s, sc), sc, used);
              else o.line(`${E(s.variable, sc)} = ${E(s.expression, sc)};`);
              break;
            }
            case 'input': cfg.input(o, E(s.variable, sc), lvInfo(s.variable, sc).type, used); break;
            case 'output': o.line(cfg.output(E(s.expression, sc), s.newline) + ';'); break;
            case 'if': {
              o.line(`if (${E(s.expression, sc)}) {`); blk(o, s.then, sc);
              let cur = s;
              while (cur.else.length === 1 && cur.else[0].kind === 'if') {
                cur = cur.else[0];
                o.line(`} else if (${E(cur.expression, sc)}) {`); blk(o, cur.then, sc);
              }
              if (cur.else.length) { o.line('} else {'); blk(o, cur.else, sc); }
              o.line('}');
              break;
            }
            case 'while': o.line(`while (${E(s.expression, sc)}) {`); blk(o, s.body, sc); o.line('}'); break;
            case 'do': o.line('do {'); blk(o, s.body, sc); o.line(`} while (${E(s.expression, sc)});`); break;
            case 'for': {
              const v = E(s.variable, sc), step = String(s.step).trim() || '1', dec = s.direction === 'dec';
              const inc = step === '1' ? (dec ? `${v}--` : `${v}++`) : `${v} ${dec ? '-=' : '+='} ${E(step, sc)}`;
              o.line(`for (${v} = ${E(s.start, sc)}; ${v} ${dec ? '>=' : '<='} ${E(s.end, sc)}; ${inc}) {`); blk(o, s.body, sc); o.line('}');
              break;
            }
            case 'call': o.line((/\(/.test(s.expression) ? E(s.expression, sc) : fname(s.expression.trim(), sc) + '()') + ';'); break;
            case 'comment': for (const l of String(s.text).split('\n')) o.line('// ' + l); break;
            case 'breakpoint': o.line(`// punto di interruzione${s.always ? '' : ': ' + s.expression}`); break;
            case 'open': case 'close': case 'read': case 'write':
              if (cfg.files) cfg.files(o, s, E, sc, lvInfo, used); else unsupported(o, `file: ${s.kind} ${s.expression || s.variable || s.mode}`);
              break;
          }
        }
      }
      return cfg.program(prog, { block, E, buildScope: (f) => buildScope(prog, f), used, Out });
    },
  };
}

const T_CPP = { Integer: 'int', Real: 'double', String: 'string', Boolean: 'bool', None: 'void' };
LANGS.cpp = cFamily({
  label: 'C++', ext: 'cpp', intDiv: true, fmod: true, powFn: 'pow', intCast: '(int) ',
  keywords: ['int', 'double', 'string', 'bool', 'void', 'return', 'if', 'else', 'while', 'for', 'do', 'true', 'false', 'using', 'namespace', 'std', 'include', 'cout', 'cin', 'endl', 'vector', 'const', 'main'],
  pi: 'PI',
  strLit: (s) => escStr(s, '"'),
  toStr(x, t, e, used) {
    if (t === 'String') return x.k === 'str' ? `string(${e.s})` : (e.p <= P.add ? `(${e.s})` : e.s);
    if (t === 'Boolean') return `string(${e.s} ? "true" : "false")`;
    if (t === 'Real') { used.add('fmt'); return `formatta(${e.s})`; }
    return `to_string(${e.s})`;
  },
  builtin(low, a, n, sc, used) {
    const A = (i) => (a[i] ? a[i].s : '');
    const At = (i) => (a[i] ? (strip(n.args[i]).k === 'str' ? `string(${a[i].s})` : a[i].p < P.atom ? `(${a[i].s})` : a[i].s) : '');
    const map = { abs: 'abs', arccos: 'acos', arcsin: 'asin', arctan: 'atan', cos: 'cos', sin: 'sin', tan: 'tan', cosh: 'cosh', sinh: 'sinh', tanh: 'tanh', arccosh: 'acosh', arcsinh: 'asinh', arctanh: 'atanh', ln: 'log', log: 'log', log10: 'log10', sqrt: 'sqrt' };
    if (map[low]) return `${map[low]}(${A(0)})`;
    switch (low) {
      case 'int': return { s: `(int) ${At(0)}`, p: P.un };
      case 'sgn': return `((${A(0)} > 0) - (${A(0)} < 0))`;
      case 'random': used.add('rand'); return { s: `rand() % ${At(0)}`, p: P.mul };
      case 'len': return `(int) ${At(0)}.length()`;
      case 'size': return `(int) ${At(0)}.size()`;
      case 'char': return `string(1, ${At(0)}[${A(1)}])`;
      case 'tochar': return `string(1, (char) ${At(0)})`;
      case 'tocode': return `(int) ${At(0)}[0]`;
      case 'tofixed': used.add('fixed'); return `aDecimali(${A(0)}, ${A(1)})`;
      case 'tointeger': return `stoi(${A(0)})`;
      case 'toreal': return `stod(${A(0)})`;
      case 'tostring': { const t = _CE.inferType(n.args[0], sc); if (t === 'String') return A(0); if (t === 'Real') { used.add('fmt'); return `formatta(${A(0)})`; } if (t === 'Boolean') return `string(${A(0)} ? "true" : "false")`; return `to_string(${A(0)})`; }
      case 'eof': return 'fileLettura.peek() == EOF';
    }
    return null;
  },
  declare: (n, t, arr, size) => (arr ? `vector<${T_CPP[t]}> ${n}(${size});` : `${T_CPP[t]} ${n};`),
  constDecl: (n, t, e) => `const ${T_CPP[t]} ${n} = ${e};`,
  input: (o, v, t) => { if (t === 'String') o.line(`getline(cin >> ws, ${v});`); else o.line(`cin >> ${v};`); },
  output: (e, nl) => `cout << ${e}${nl ? ' << endl' : ''}`,
  files(o, s, E, sc, lvInfo, used) {
    used.add('fstream');
    if (s.kind === 'open') o.line(s.mode === 'read' ? `fileLettura.open(${E(s.expression, sc)});` : `fileScrittura.open(${E(s.expression, sc)});`);
    if (s.kind === 'close') o.line(s.mode === 'read' ? 'fileLettura.close();' : 'fileScrittura.close();');
    if (s.kind === 'read') { const t = lvInfo(s.variable, sc).type; if (t === 'String') o.line(`getline(fileLettura, ${E(s.variable, sc)});`); else { o.line(`fileLettura >> ${E(s.variable, sc)};`); o.line('fileLettura >> ws;'); } }
    if (s.kind === 'write') o.line(`fileScrittura << ${E(s.expression, sc)} << endl;`);
  },
  multiAssign(o, tg, call, f, sc, used) { used.add('tuple'); o.line(`tie(${tg.join(', ')}) = ${call};`); },
  program(prog, g) {
    const o = new g.Out();
    const retT = (f) => { const rl = _CM.rets(f); if (rl.length > 1) { g.used.add('tuple'); return `tuple<${rl.map((r) => T_CPP[r.type]).join(', ')}>`; } return T_CPP[f.type]; };
    const sig = (f) => `${retT(f)} ${f.name}(${f.params.map((p) => (p.array ? `vector<${T_CPP[p.type]}>& ${p.name}` : `${T_CPP[p.type]} ${p.name}`)).join(', ')})`;
    const fns = prog.functions.slice(1);
    const bodyOut = new g.Out();
    for (const f of fns) {
      const sc = g.buildScope(f);
      bodyOut.line(''); bodyOut.line(sig(f) + ' {'); bodyOut.in(); g.block(bodyOut, f.body, sc);
      const rl = _CM.rets(f);
      if (rl.length) { bodyOut.line(''); bodyOut.line(rl.length > 1 ? `return make_tuple(${rl.map((r) => r.name).join(', ')});` : `return ${rl[0].name};`); }
      bodyOut.out(); bodyOut.line('}');
    }
    const mainOut = new g.Out();
    mainOut.in(); g.block(mainOut, prog.functions[0].body, g.buildScope(prog.functions[0])); mainOut.out();
    const u = g.used;
    o.line('#include <iostream>'); o.line('#include <string>'); o.line('#include <vector>'); o.line('#include <cmath>');

  if (textW(t, font) <= max) return t;

function wrapLines(text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(/(\s+)/);
    let cur = '';
    for (const w of words) {
      if (textW(cur + w, CFONT) <= maxW) { cur += w; continue; }
      if (cur.trim()) out.push(cur.trimEnd());
      cur = w.trimStart();
      while (textW(cur, CFONT) > maxW) { // parola più lunga della riga

  switch (shape) {
    case 'term': return `<rect x="${l}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/>`;
    case 'rect': return `<rect x="${l}" y="${y}" width="${w}" height="${h}" rx="2"/>`;
    case 'decl': return `<rect x="${l}" y="${y}" width="${w}" height="${h}" rx="2"/><path class="inner" d="M${l + 7} ${y}V${b}M${l} ${y + 7}H${r}"/>`;
    case 'para': { const k = 11; return `<path d="M${l + k} ${y}H${r}L${r - k} ${b}H${l}Z"/>`; }
    case 'diamond': return `<path d="M${cx} ${y}L${r} ${m}L${cx} ${b}L${l} ${m}Z"/>`;
    case 'hex': { const k = 14; return `<path d="M${l + k} ${y}H${r - k}L${r} ${m}L${r - k} ${b}H${l + k}L${l} ${m}Z"/>`; }
    case 'call': return `<rect x="${l}" y="${y}" width="${w}" height="${h}" rx="2"/><path class="inner" d="M${l + 8} ${y}V${b}M${r - 8} ${y}V${b}"/>`;
    case 'note': { const k = 9; return `<path class="note" d="M${l} ${y}H${r - k}L${r} ${y + k}V${b}H${l}Z"/><path class="inner" d="M${r - k} ${y}V${y + k}H${r}"/>`; }
    case 'oct': { const k = 9; return `<path d="M${l + k} ${y}H${r - k}L${r} ${y + k}V${b - k}L${r - k} ${b}H${l + k}L${l} ${b - k}V${y + k}Z"/>`; }
    case 'doc': { const q = 5; return `<path d="M${l} ${y}H${r}V${b - q}C${r - w * 0.25} ${b - q * 3} ${cx} ${b + q} ${l} ${b - q}Z"/>`; }
  }
  return '';
}
const SHAPE_OF = {
  declare: 'decl', const: 'decl', assign: 'rect', input: 'para', output: 'para', if: 'diamond', while: 'diamond', do: 'diamond', for: 'hex',
  call: 'call', comment: 'note', breakpoint: 'oct',
  open: 'doc', close: 'doc', read: 'doc', write: 'doc',
};
const CAT_OF = {
  declare: 'decl', const: 'decl', assign: 'assign', input: 'in', output: 'out', if: 'cond', while: 'loop', do: 'loop', for: 'loop', call: 'call',
  comment: 'comment', breakpoint: 'brk',
  open: 'file', close: 'file', read: 'file', write: 'file',
};

class Renderer {
  constructor() { this.reset(); }
  reset() { this.ins = []; this.sh = []; this.ln = []; this.hit = []; this.lbl = []; this.edges = []; }

  /* ---- grafo dei percorsi (per il cursore che segue le frecce) ----
     Ogni disegno riceve "head" = {node, pts, tag}: il percorso pendente che arriva
     al suo ingresso, e restituisce "tail": il percorso che parte dalla sua uscita. */
  edge(from, to, pts, tag) { this.edges.push({ from, to, pts: dedupe(pts), tag: tag || null }); }

  /* ---- primitive ---- */
  line(pts, head, cls) {
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join('');
    this.ln.push(`<path class="flow${cls ? ' ' + cls : ''}" d="${d}"${head ? ' marker-end="url(#ah)"' : ''}/>`);
  }
  insPoint(arr, idx, x, y1, y2, head) {
    const k = this.ins.length;
    this.ins.push({ arr, idx });
    this.line([[x, y1], [x, y2]], head);
    const hh = y2 - y1;
    this.hit.push(`<g class="ins" data-ins="${k}"><rect x="${x - 22}" y="${y1}" width="44" height="${hh}"/><circle cx="${x}" cy="${y1 + hh / 2}" r="9"/><path d="M${x - 4} ${y1 + hh / 2}H${x + 4}M${x} ${y1 + hh / 2 - 4}V${y1 + hh / 2 + 4}"/></g>`);
  }
  label(x, y, t, anchor) { this.lbl.push(`<text class="blabel" x="${x}" y="${y}" text-anchor="${anchor || 'middle'}">${t}</text>`); }

  shape(id, kind, cat, shp, cx, y, w, h, text, title, extra, badge) {
    const tw = w - (shp === 'diamond' ? 36 : shp === 'hex' ? 30 : shp === 'para' ? 24 : 18) - (badge ? 18 : 0);
    const t = fit(text, tw);
    let s = `<g class="shape c-${cat}${extra || ''}" data-id="${id}"${kind ? ` data-kind="${kind}"` : ''}><title>${esc(title || text)}</title>${shapePath(shp, cx, y, w, h)}`;
    s += `<text x="${cx}" y="${y + h / 2}" dy="0.35em">${esc(t)}</text>`;
    if (badge) s += `<text class="badge" x="${cx + w / 2 - 13}" y="${y + 11}" dy="0.35em">${badge}</text>`;
    s += '</g>';
    this.sh.push(s);
  }

  /* ---- impaginazione ---- */
  boxW(text, shp) {
    const pad = shp === 'diamond' ? 56 : shp === 'hex' ? 44 : shp === 'para' ? 40 : R_.PADX * 2;
    return Math.round(Math.min(R_.MAXW + pad, Math.max(R_.MINW, textW(text) + pad)));
  }

  seq(arr, tailHead) {
    const parts = arr.map((s) => this.stmt(s));
    let L = 22, R = 22, h = R_.GAP * (arr.length + 1);
    for (const p of parts) { L = Math.max(L, p.L); R = Math.max(R, p.R); h += p.h; }
    return {
      L, R, h,
      draw: (cx, y, head) => {
        let cur = y;
        let pend = head;
        parts.forEach((p, i) => {
          this.insPoint(arr, i, cx, cur, cur + R_.GAP, true);
          const arrow = [[cx, cur], [cx, cur + R_.GAP]];
          cur += R_.GAP;
          pend = p.draw(cx, cur, { node: pend.node, pts: cat2(pend.pts, arrow), tag: pend.tag });
          cur += p.h;
        });
        this.insPoint(arr, arr.length, cx, cur, cur + R_.GAP, tailHead);
        return { node: pend.node, pts: cat2(pend.pts, [[cx, cur], [cx, cur + R_.GAP]]), tag: pend.tag };
      },
    };
  }

  stmt(s) {
    const cap = caption(s);
    const shp = SHAPE_OF[s.kind];
    const cat = cap.incomplete ? 'inc' : CAT_OF[s.kind];
    const title = cap.incomplete ? `${KIND_IT[s.kind]} — incompleto: doppio clic per completarlo` : `${KIND_IT[s.kind]}: ${cap.text}`;
    const H = R_.H, DH = R_.DH;
    if (s.kind === 'if') {
      const dw = this.boxW(cap.text, 'diamond');
      const T = this.seq(s.then, false), E = this.seq(s.else, false);
      const offR = Math.max(dw / 2 + R_.BRANCH, T.L + 26);
      const offL = Math.max(dw / 2 + R_.BRANCH, E.R + 26);
      const bh = Math.max(T.h, E.h);
      const h = DH / 2 + bh + 8;
      return {
        L: Math.max(dw / 2, offL + E.L), R: Math.max(dw / 2, offR + T.R), h,
        draw: (cx, y, head) => {
          const m = y + DH / 2, j = y + h, J = s.id + ':join';
          this.edge(head.node, s.id, head.pts, head.tag);
          this.shape(s.id, s.kind, cat, 'diamond', cx, y, dw, DH, cap.text, title);
          this.line([[cx + dw / 2, m], [cx + offR, m]]);
          this.line([[cx - dw / 2, m], [cx - offL, m]]);
          this.label(cx + dw / 2 + 6, m - 6, 'Vero', 'start');
          this.label(cx - dw / 2 - 6, m - 6, 'Falso', 'end');
          const tT = T.draw(cx + offR, m, { node: s.id, pts: [[cx + dw / 2, m], [cx + offR, m]], tag: 'T' });
          const tE = E.draw(cx - offL, m, { node: s.id, pts: [[cx - dw / 2, m], [cx - offL, m]], tag: 'F' });
          this.line([[cx + offR, m + T.h], [cx + offR, j], [cx, j]]);
          this.line([[cx - offL, m + E.h], [cx - offL, j], [cx, j]]);
          this.ln.push(`<circle class="joint" cx="${cx}" cy="${j}" r="3.5"/>`);
          this.edge(tT.node, J, cat2(tT.pts, [[cx + offR, j], [cx, j]]), tT.tag);
          this.edge(tE.node, J, cat2(tE.pts, [[cx - offL, j], [cx, j]]), tE.tag);
          return { node: J, pts: [[cx, j]] };
        },
      };
    }
    if (s.kind === 'while' || s.kind === 'for') {
      const dw = this.boxW(cap.text, s.kind === 'for' ? 'hex' : 'diamond');
      const dh = s.kind === 'for' ? H + 4 : DH;
      const B = this.seq(s.body, false);
      const lo = Math.max(dw / 2, B.L) + 20, ro = Math.max(dw / 2, B.R) + 20;
      const h = dh + B.h + 28;
      return {
        L: lo + 4, R: ro + 4, h,
        draw: (cx, y, head) => {
          const m = y + dh / 2, by = y + dh + B.h;
          this.edge(head.node, s.id, head.pts, head.tag);
          this.shape(s.id, s.kind, cat, s.kind === 'for' ? 'hex' : 'diamond', cx, y, dw, dh, cap.text, title);
          const tB = B.draw(cx, y + dh, { node: s.id, pts: [[cx, y + dh]], tag: 'T' });
          this.label(cx + 6, y + dh + 13, s.kind === 'for' ? 'Ripeti' : 'Vero', 'start');
          // il ritorno si innesta a metà della freccia che entra nella condizione
          const jy = y - R_.GAP / 2;
          this.line([[cx, by], [cx, by + 10], [cx - lo, by + 10], [cx - lo, jy], [cx - 4, jy]], true, 'back');
          this.ln.push(`<circle class="joint" cx="${cx}" cy="${jy}" r="3.5"/>`);
          this.line([[cx + dw / 2, m], [cx + ro, m], [cx + ro, by + 22], [cx, by + 22], [cx, y + h]]);
          this.label(cx + dw / 2 + 6, m - 6, s.kind === 'for' ? 'Fine' : 'Falso', 'start');
          this.edge(tB.node, s.id, cat2(tB.pts, [[cx, by + 10], [cx - lo, by + 10], [cx - lo, jy], [cx, jy], [cx, y]]), tB.tag);
          return { node: s.id, pts: [[cx + dw / 2, m], [cx + ro, m], [cx + ro, by + 22], [cx, by + 22]], tag: 'F' };
        },
      };
    }
    if (s.kind === 'do') {
      const dw = this.boxW(cap.text, 'diamond');
      const B = this.seq(s.body, true);
      const lo = Math.max(dw / 2, B.L) + 20;
      const h = 6 + B.h + DH;
      return {
        L: lo + 4, R: Math.max(dw / 2, B.R) + 4, h,
        draw: (cx, y, head) => {
          const top = y + 6, dy = top + B.h, m = dy + DH / 2, J = s.id + ':top';
          this.line([[cx, y], [cx, top]]);
          this.ln.push(`<circle class="joint" cx="${cx}" cy="${top}" r="3.5"/>`);
          this.edge(head.node, J, cat2(head.pts, [[cx, top]]), head.tag);
          const tB = B.draw(cx, top, { node: J, pts: [[cx, top]] });
          this.edge(tB.node, s.id, tB.pts, tB.tag);
          this.shape(s.id, s.kind, cat, 'diamond', cx, dy, dw, DH, cap.text, title);
          this.line([[cx - dw / 2, m], [cx - lo, m], [cx - lo, top], [cx - 4, top]], true, 'back');
          this.label(cx - dw / 2 - 6, m - 6, 'Vero', 'end');
          this.label(cx + 6, dy + DH + 13, 'Falso', 'start');
          this.edge(s.id, J, [[cx - dw / 2, m], [cx - lo, m], [cx - lo, top], [cx, top]], 'T');
          return { node: s.id, pts: [[cx, dy + DH]], tag: 'F' };
        },
      };
    }
    if (s.kind === 'comment' && !cap.incomplete) return this.comment(s, title);
    const w = this.boxW(cap.text, shp) + (cap.badge ? 18 : 0);
    const h = H;
    return {
      L: w / 2 + 6, R: w / 2 + 6, h,
      draw: (cx, y, head) => {
        this.edge(head.node, s.id, head.pts, head.tag);
        this.shape(s.id, s.kind, cat, shp, cx, y, w, h, cap.text, title, s.kind === 'comment' ? ' comment' : '', cap.incomplete ? null : cap.badge);
        return { node: s.id, pts: [[cx, y + h]] };
      },
    };
  }

  /* Commento: una riga; se il testo è lungo compare «+» per espanderlo nel riquadro */
  comment(s, title) {
    const TOG = 24, PAD = 14, LH = 17, MAXT = R_.MAXW;
    const lines = wrapLines(s.text, MAXT);
    // margine di sicurezza: misura e disegno possono differire di qualche decimo di pixel
    const SAFE = 6;
    const multi = lines.length > 1;
    const firstW = textW(lines[0], CFONT);
    const truncated = multi || firstW > MAXT;
    let expandable = truncated;
    let open = expandable && this.expanded && this.expanded.has(s.id);
    let shown = open ? lines : [lines[0] + (multi ? ' …' : '')];
    const widthFor = (exp, sh) => Math.ceil(Math.max(R_.MINW, Math.min(MAXT + 12, Math.max(...sh.map((l) => textW(l, CFONT)))) + PAD * 2 + SAFE + (exp ? TOG : 0)));
    let w = widthFor(expandable, shown);
    // se il testo chiuso verrebbe comunque tagliato, il pulsante + deve esserci sempre
    if (!expandable && fit(shown[0], w - PAD * 2 + SAFE, CFONT) !== shown[0]) {
      expandable = true; open = this.expanded && this.expanded.has(s.id);
      w = widthFor(true, shown);
    }
    const h = open ? Math.max(R_.H - 4, shown.length * LH + 14) : R_.H - 4;
    return {
      L: w / 2 + 6, R: w / 2 + 6, h,
      draw: (cx, y, head) => {
        this.edge(head.node, s.id, head.pts, head.tag);
        const l = cx - w / 2, r = cx + w / 2;
        let g = `<g class="shape c-comment comment${open ? ' open' : ''}" data-id="${s.id}" data-kind="comment"><title>${esc(title)}</title>${shapePath('note', cx, y, w, h)}`;
        if (open) {
          shown.forEach((t, i) => { g += `<text class="cline-t" x="${l + PAD}" y="${y + 7 + LH / 2 + i * LH}" dy="0.35em">${esc(t)}</text>`; });
        } else {
          g += `<text x="${expandable ? cx - TOG / 2 : cx}" y="${y + h / 2}" dy="0.35em">${esc(fit(shown[0], w - PAD * 2 - (expandable ? TOG : 0) + SAFE, CFONT))}</text>`;
        }
        if (expandable) {
          const tx = r - 19, ty = y + (R_.H - 4) / 2 + 1;
          g += `<g class="ctoggle" data-toggle="${s.id}" role="button" aria-label="${open ? 'Riduci commento' : 'Espandi commento'}"><title>${open ? 'Riduci il commento' : 'Mostra tutto il commento'}</title><circle cx="${tx}" cy="${ty}" r="8"/><path d="M${tx - 3.5} ${ty}H${tx + 3.5}${open ? '' : `M${tx} ${ty - 3.5}V${ty + 3.5}`}"/></g>`;
        }
        this.sh.push(g + '</g>');
        return { node: s.id, pts: [[cx, y + h]] };
      },
    };
  }

  func(f, expanded) {
    this.reset();
    this.expanded = expanded;
    const isMain = f.name.toLowerCase() === 'main';
    const sig = isMain ? 'Inizio' : `${f.name}(${f.params.map((p) => `${p.name}${p.array ? '[]' : ''}: ${ExprLib.TYPE_IT[p.type]}`).join(', ')})`;
    const rsl = ModelLib.rets(f);
    const endText = rsl.length ? `Restituisci ${rsl.map((x) => x.name || '?').join(', ')}` : 'Fine';
    const sw = this.boxW(sig, 'rect') + 10, ew = this.boxW(endText, 'rect') + 10;
    const B = this.seq(f.body, true);
    const L = Math.max(sw / 2, ew / 2, B.L), R = Math.max(sw / 2, ew / 2, B.R);
    const M = 40;
    const W = Math.ceil(L + R + M * 2), Hh = Math.ceil(R_.H * 2 + B.h + M * 2);
    const cx = Math.round(M + L), y0 = M;
    this.shape('start:' + f.id, '', 'term', 'term', cx, y0, sw, R_.H, sig, isMain ? 'Inizio del programma: doppio clic per le proprietà' : `Inizio di ${f.name}: doppio clic per modificare la funzione`);
    const tail = B.draw(cx, y0 + R_.H, { node: 'start:' + f.id, pts: [[cx, y0 + R_.H]] });
    this.edge(tail.node, 'end:' + f.id, tail.pts, tail.tag);
    this.shape('end:' + f.id, '', 'term', 'term', cx, y0 + R_.H + B.h, ew, R_.H, endText, rsl.length ? `La funzione restituisce ${rsl.map((x) => `${x.name}: ${ExprLib.TYPE_IT[x.type]}`).join(', ')}` : 'Fine della funzione');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" class="chart" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" data-w="${W}" data-h="${Hh}">`
      + '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" class="ahead"/></marker></defs>'
      + `<g class="lines">${this.ln.join('')}</g><g class="hits">${this.hit.join('')}</g><g class="trail"></g><g class="shapes">${this.sh.join('')}</g><g class="labels">${this.lbl.join('')}</g></svg>`;
    return { svg, W, H: Hh, ins: this.ins, edges: this.edges };
  }
}

    set: (variable, expression) => S('assign', { variable, expression }),
    inp: (variable) => S('input', { variable }),
    out: (expression, newline = true) => S('output', { expression, newline }),
    if: (expression, then = [], els = []) => S('if', { expression, then, else: els }),
    while: (expression, body) => S('while', { expression, body }),
    do: (body, expression) => S('do', { expression, body }),
    for: (variable, start, end, body, direction = 'inc', step = '1') => S('for', { variable, start, end, direction, step, body }),
    call: (expression) => S('call', { expression }),
    com: (text) => S('comment', { text }),

  /* Campi */
  function field(spec, val, vars) {

          if (spec.type === 'ident') {
            if (!E.validIdent(v.trim())) throw new Error('Usa lettere, cifre e _ e inizia con una lettera');
            if (E.RESERVED.has(v.trim().toLowerCase())) throw new Error('È una parola riservata');
          }
        } catch (e) { err = e.message; }
      }
      msg.textContent = err || spec.hint || '';
      wrap.classList.toggle('bad', !!err);
      return err;
    };
    input.addEventListener('input', check);
    if (String(val ?? '').trim()) setTimeout(check, 0);
    wrap._get = () => input.value;
    wrap._check = () => {
      const e = check();
      if (e) return `${spec.label}: ${e}`;
      if (spec.required && !String(input.value).trim()) return `Compila il campo «${spec.label}»`;
      return '';
    };
    wrap._input = input;
    return wrap;
  }

  function stmtDialog(s, isNew, done) {
    const form = STMT_FORMS[s.kind];
    const vars = declaredNames(func());
    const body = h('div', { class: 'fields' });
    if (form.help) body.append(h('p', { class: 'help' }, form.help));
    const ws = {};
    const row = h('div', { class: 'row' });
    for (const spec of form.fields) {
      const w = field(spec, s[spec.key], vars);
      ws[spec.key] = w;
      if (spec.inline) { row.append(w); if (!row.parentNode) body.append(row); } else body.append(w);
    }
    const sync = () => {
      for (const spec of form.fields) if (spec.showIf) {
        const neg = spec.showIf.startsWith('!'); const k = spec.showIf.replace('!', '');
        const on = ws[k]._get(); ws[spec.key].hidden = neg ? on : !on;
      }
    };
    body.addEventListener('change', sync); sync();
    openModal({
      title: (isNew ? 'Nuovo blocco: ' : '') + form.title, body, okText: isNew ? 'Aggiungi' : 'Salva',
      onOk: () => {
        const vals = {};
        for (const spec of form.fields) {
          if (ws[spec.key].hidden) { vals[spec.key] = spec.type === 'check' ? false : (spec.key === 'size' ? '' : s[spec.key]); continue; }
          const e = ws[spec.key]._check ? ws[spec.key]._check() : '';
          if (e) return e;
          vals[spec.key] = ws[spec.key]._get();
          if (typeof vals[spec.key] === 'string' && spec.type !== 'textarea') vals[spec.key] = vals[spec.key].trim();
        }
        if (s.kind === 'declare' && vals.array && !String(vals.size).trim()) return 'Indica il numero di elementi dell\'array';
        if (s.kind === 'declare') vals.name = vals.name.split(',').map((x) => x.trim()).join(', ');
        if (s.kind === 'breakpoint' && !vals.always && !String(vals.expression || '').trim()) return 'Scrivi una condizione oppure scegli «Fermati sempre»';
        done(vals);
        return true;
      },
    });
  }

  /* Funzioni */
  function editFunction(index) {
    const isNew = index == null;
    const f = isNew ? M.makeFunction('') : st.prog.functions[index];
    const params = f.params.map((p) => ({ ...p }));
    const body = h('div', { class: 'fields' });
    const nameW = field({ key: 'fname', label: 'Nome della funzione', type: 'ident', required: true, placeholder: 'es. Massimo' }, f.name);
    const rets = M.rets(f).map((r) => ({ ...r }));
    body.append(nameW);
    const plist = h('div', { class: 'params' });
    const drawParams = () => {
      plist.innerHTML = '';
      if (!params.length) plist.append(h('p', { class: 'muted small' }, 'Nessun parametro.'));
      params.forEach((p, i) => {
        const nm = h('input', { type: 'text', class: 'mono', value: p.name, 'aria-label': 'Nome parametro ' + (i + 1), placeholder: 'nome', oninput: (e) => { p.name = e.target.value.trim(); } });
        const tp = h('select', { 'aria-label': 'Tipo parametro ' + (i + 1), onchange: (e) => { p.type = e.target.value; } }, TYPE_OPTS.map(([v, l]) => h('option', { value: v, selected: v === p.type }, l)));
        const arr = h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: p.array, onchange: (e) => { p.array = e.target.checked; } }), h('span', null, 'array'));
        plist.append(h('div', { class: 'prow' }, nm, tp, arr,
          h('button', { class: 'iconbtn', type: 'button', title: 'Sposta su', 'aria-label': 'Sposta su', disabled: i === 0, onclick: () => { params.splice(i - 1, 0, params.splice(i, 1)[0]); drawParams(); } }, '↑'),
          h('button', { class: 'iconbtn', type: 'button', title: 'Rimuovi', 'aria-label': 'Rimuovi parametro', onclick: () => { params.splice(i, 1); drawParams(); } }, '✕')));
      });
    };
    drawParams();
    body.append(h('div', { class: 'flabel' }, 'Parametri'), plist,
      h('button', { class: 'btn small', type: 'button', onclick: () => { params.push({ name: '', type: 'Integer', array: false }); drawParams(); plist.querySelector('.prow:last-child input').focus(); } }, '+ Aggiungi parametro'));
    // valori restituiti: nessuno = procedura, uno = funzione classica, più di uno = come in Python
    const rlist = h('div', { class: 'params' });
    const drawRets = () => {
      rlist.innerHTML = '';
      if (!rets.length) rlist.append(h('p', { class: 'muted small' }, 'Nessun valore: è una procedura.'));
      rets.forEach((r, i) => {
        const nm = h('input', { type: 'text', class: 'mono', value: r.name, 'aria-label': 'Variabile restituita ' + (i + 1), placeholder: 'variabile', oninput: (e) => { r.name = e.target.value.trim(); } });
        const tp = h('select', { 'aria-label': 'Tipo del valore restituito ' + (i + 1), onchange: (e) => { r.type = e.target.value; } }, TYPE_OPTS.map(([v, l]) => h('option', { value: v, selected: v === r.type }, l)));
        rlist.append(h('div', { class: 'prow rrow' }, nm, tp,
          h('button', { class: 'iconbtn', type: 'button', title: 'Sposta su', 'aria-label': 'Sposta su', disabled: i === 0, onclick: () => { rets.splice(i - 1, 0, rets.splice(i, 1)[0]); drawRets(); } }, '↑'),
          h('button', { class: 'iconbtn', type: 'button', title: 'Rimuovi', 'aria-label': 'Rimuovi valore restituito', onclick: () => { rets.splice(i, 1); drawRets(); } }, '✕')));
      });
    };
    drawRets();
    body.append(h('div', { class: 'flabel' }, 'Valori restituiti'), h('p', { class: 'muted small', style: 'margin:0' }, 'Le variabili vanno dichiarate nel corpo della funzione: quelle nuove vengono dichiarate in automatico. Con più valori la chiamata si scrive a, b ← Funzione(...)'), rlist,
      h('button', { class: 'btn small', type: 'button', onclick: () => { rets.push({ name: '', type: 'Integer' }); drawRets(); rlist.querySelector('.prow:last-child input').focus(); } }, '+ Aggiungi valore restituito'));
    openModal({
      title: isNew ? 'Nuova funzione' : 'Modifica funzione', body, okText: isNew ? 'Crea' : 'Salva', wide: true,
      onOk: () => {
        const e1 = nameW._check(); if (e1) return e1;
        const name = nameW._get().trim();
        if (name.toLowerCase() === 'main') return 'Il nome Main è riservato al programma principale (Inizio)';
        if (E.BUILTINS[name.toLowerCase()]) return `${name} è già una funzione integrata`;
        if (st.prog.functions.some((g, i) => i !== index && g.name.toLowerCase() === name.toLowerCase())) return `Esiste già una funzione chiamata ${name}`;
        const rseen = new Set();
        for (const r of rets) {
          if (!E.validIdent(r.name)) return `Valore restituito "${r.name || '(vuoto)'}": nome di variabile non valido`;
          if (E.RESERVED.has(r.name.toLowerCase())) return `"${r.name}" è una parola riservata`;
          if (rseen.has(r.name)) return `La variabile restituita ${r.name} è ripetuta`;
          rseen.add(r.name);
        }
        const seen = new Set();
        for (const p of params) {
          if (!E.validIdent(p.name)) return `Parametro "${p.name || '(vuoto)'}": nome non valido`;
          if (seen.has(p.name)) return `Il parametro ${p.name} è ripetuto`;
          seen.add(p.name);
        }
        mutate(() => {
          const target = isNew ? M.makeFunction(name, { params }) : f;
          Object.assign(target, { name, params });
          M.setRets(target, rets);
          // dichiara le variabili restituite che non sono ancora dichiarate (raggruppate per tipo)
          const known = new Set(params.map((p) => p.name));
          M.walk(target.body, (x) => { if (x.kind === 'declare') x.name.split(',').forEach((n) => known.add(n.trim())); });
          const missing = rets.filter((r) => !known.has(r.name));
          const decls = [];
          for (const r of missing) {
            const last = decls[decls.length - 1];
            if (last && last.type === r.type) last.name += ', ' + r.name;
            else decls.push(M.makeStmt('declare', { name: r.name, type: r.type }));
          }
          target.body.unshift(...decls);
          if (isNew) { st.prog.functions.push(target); st.fi = st.prog.functions.length - 1; }
        });
        return true;
      },
    });
  }
  function deleteFunction() {
    if (st.fi === 0) return;

  /* ------------------------ Interazione col disegno ---------------------- */
  let drag = null, suppressClick = false;
  function bindChart() {
    const chart = $('#chart');
    chart.addEventListener('click', (e) => {
      if (suppressClick) { suppressClick = false; return; }
      const tog = e.target.closest('.ctoggle');
      if (tog) { const id = tog.dataset.toggle; st.expanded.has(id) ? st.expanded.delete(id) : st.expanded.add(id); render(); return; }
      const ins = e.target.closest('.ins');
      if (ins) { if (isRunning()) { toast('Ferma il programma per modificare il diagramma', 'warn'); return; } insertMenu(+ins.dataset.ins, e.clientX + 6, e.clientY + 6); return; }
      const g = e.target.closest('.shape');
      st.sel = g && !g.dataset.id.includes(':') ? g.dataset.id : null;
      decorate();
    });
    chart.addEventListener('dblclick', (e) => {
      if (e.target.closest('.ctoggle')) return;
      const g = e.target.closest('.shape'); if (!g) return;
      const id = g.dataset.id;
      if (id.startsWith('start:') || id.startsWith('end:')) { if (isRunning()) return; st.fi === 0 ? editProgram() : editFunction(st.fi); return; }
      editStmt(id);
    });
    chart.addEventListener('contextmenu', (e) => {
      const g = e.target.closest('.shape'); if (!g) return;
      e.preventDefault();
      if (!g.dataset.id.includes(':')) { st.sel = g.dataset.id; decorate(); }
      shapeMenu(g.dataset.id, e.clientX, e.clientY);
    });
    chart.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || isRunning() || e.target.closest('.ctoggle')) return;
      const g = e.target.closest('.shape'); if (!g || g.dataset.id.includes(':')) return;
      drag = { id: g.dataset.id, x: e.clientX, y: e.clientY, on: false, ghost: null };
    });
    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) {
        drag.on = true;
        document.body.classList.add('dragging');
        const f = M.findStmt(st.prog, drag.id);
        drag.ghost = h('div', { class: 'ghost' }, RenderLib.KIND_IT[f.stmt.kind] + ': ' + RenderLib.caption(f.stmt).text);
        document.body.append(drag.ghost);
      }
      if (drag.on) {
        drag.ghost.style.left = e.clientX + 14 + 'px'; drag.ghost.style.top = e.clientY + 10 + 'px';
        const el = document.elementFromPoint(e.clientX, e.clientY);
        $$('#chart .ins.drop').forEach((x) => x.classList.remove('drop'));
        const ins = el && el.closest && el.closest('#chart .ins');
        if (ins) ins.classList.add('drop');
      }
    });
    window.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const d = drag; drag = null;
      if (!d.on) return;
      document.body.classList.remove('dragging');
      d.ghost.remove();
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const ins = el && el.closest && el.closest('#chart .ins');
      if (ins) moveStmt(d.id, st.ins[+ins.dataset.ins]);
      $$('#chart .ins.drop').forEach((x) => x.classList.remove('drop'));
    });
    $('#canvasWrap').addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      setZoom(st.zoom * (e.deltaY < 0 ? 1.1 : 0.9));
    }, { passive: false });
  }

  /* ============================ ESECUZIONE =============================== */
  const run = { state: 'idle', gen: null, interp: null, timer: null, steps: 0, curId: null, curFrame: null, errId: null, pending: undefined, mode: 'run', mainFrame: null, viewFrame: null, prevVals: new Map(), lastVarsAt: 0 };

  /* ---- Console ---- */
  let conLine = null;
  function conClear() { $('#conOut').innerHTML = ''; conLine = null; }
  function conWrite(text, nl, cls) {
    const out = $('#conOut');
    if (cls === 'echo' && conLine) {
      conLine.append(h('span', { class: 'echo-inline' }, text));
      conLine = null;
    } else if (cls) {
      if (conLine && conLine.textContent === '') { conLine.remove(); }
      out.append(h('div', { class: 'cline ' + cls }, text));
      conLine = null;
    } else {
      if (!conLine) { conLine = h('div', { class: 'cline' }); out.append(conLine); }
      conLine.append(document.createTextNode(text));
      if (nl) conLine = null;
    }
    while (out.childElementCount > 4000) out.firstElementChild.remove();
    scheduleScroll();
  }
  let scrollPending = false;
  function scheduleScroll() {
    if (scrollPending) return; scrollPending = true;
    requestAnimationFrame(() => { scrollPending = false; const o = $('#conOut'); o.scrollTop = o.scrollHeight; });
  }

  /* ---- File virtuali ---- */
  const streams = { read: null, write: null };
  function saveVfs() { store.set('vfs', Object.fromEntries(st.vfs)); renderFiles(); }
  function fileOpen(name, mode) {
    if (!name.trim()) throw new E.FlowError('Il nome del file è vuoto');
    if (streams[mode]) throw new E.FlowError(`C'è già un file aperto in ${mode === 'read' ? 'lettura' : 'scrittura'}: chiudilo prima di aprirne un altro`);
    if (mode === 'read') {
      if (!st.vfs.has(name)) throw new E.FlowError(`File "${name}" non trovato: caricalo nella scheda File`);
      const lines = st.vfs.get(name).split(/\r?\n/);
      if (lines.length && lines[lines.length - 1] === '') lines.pop();
      streams.read = { name, lines, pos: 0 };
    } else streams.write = { name, lines: [] };
  }
  function fileClose(mode) {
    if (!streams[mode]) throw new E.FlowError(`Nessun file aperto in ${mode === 'read' ? 'lettura' : 'scrittura'}`);
    if (mode === 'write') { st.vfs.set(streams.write.name, streams.write.lines.join('\n') + (streams.write.lines.length ? '\n' : '')); saveVfs(); }
    streams[mode] = null;
  }
  function flushStreams() { if (streams.write) { try { fileClose('write'); } catch (e) { /* ignora */ } } streams.read = null; streams.write = null; }

  const env = {
    output: (t, nl, cls) => conWrite(t, nl, cls),
    eof: () => { if (!streams.read) throw new E.FlowError('EOF(): nessun file aperto in lettura'); return streams.read.pos >= streams.read.lines.length; },
    fileOpen, fileClose,
    fileRead: () => {
      const r = streams.read;
      if (!r) throw new E.FlowError('Nessun file aperto in lettura');
      if (r.pos >= r.lines.length) throw new E.FlowError(`Lettura oltre la fine del file "${r.name}" (controlla con EOF())`);
      return r.lines[r.pos++];
    },
    fileWrite: (s) => { if (!streams.write) throw new E.FlowError('Nessun file aperto in scrittura'); streams.write.lines.push(s); },
  };

  function setStatus(kind, text) {
    const s = $('#status');
    s.className = 'status ' + kind;
    $('#statusText').textContent = text;
    $('#stepCount').textContent = run.steps ? `${run.steps.toLocaleString('it-IT')} passi` : '';
    document.body.dataset.run = run.state;
    $('#runBtn').querySelector('span').textContent = run.state === 'paused' ? 'Continua' : 'Esegui';
    $('#pauseBtn').disabled = run.state !== 'running';
    $('#stopBtn').disabled = !isRunning();
  }

  function startRun(mode) {
    stopTimer();
    run.mode = mode;
    run.steps = 0; run.curId = null; run.errId = null; run.pending = undefined; run.mainFrame = null; run.viewFrame = null; run.prevVals = new Map();
    run.trail = null; clearTrail();
    conClear(); flushStreams();
    conWrite(`▶ ${st.prog.attrs.name || 'Programma'}`, true, 'sys');
    // esegue una copia, così le modifiche al diagramma non toccano l'esecuzione
    const prog = JSON.parse(JSON.stringify(st.prog));
    run.interp = new Interpreter(prog, env);
    run.gen = run.interp.run();
    if (!paneVisible('console') && !paneVisible('vars')) showPane('console');
    if (mode === 'run') { run.state = 'running'; setStatus('running', 'In esecuzione…'); pump(); }
    else { run.state = 'paused'; stepOnce(); }
  }

  function stopTimer() { if (run.timer) { clearTimeout(run.timer); run.timer = null; } }

  function advance() {
    let r, ev;
    for (;;) {
      try { r = run.gen.next(run.pending); run.pending = undefined; } catch (e) { onError(e); return null; }
      if (r.done) { onFinish(); return null; }
      ev = r.value;
      // il ramo scelto da un Se serve solo al cursore: non è un passo

    if (ev.type === 'stmt') {
      run.steps++; run.curId = ev.stmt.id; run.curFrame = ev.frame;

    if (ev.type === 'input') { onInput(ev); return null; }
    if (ev.type === 'break') {

  function pump() {
    run.timer = null;

    const t0 = performance.now();
    while (run.state === 'running') {
      const ev = advance();
      if (!ev) return;
      if (ms > 0) { showCurrent(); run.timer = setTimeout(pump, ms); return; }

        run.timer = setTimeout(pump, 0);

  }

  function stepOnce() {
    if (run.state === 'input') return;

    const ev = advance();
    if (ev) { showCurrent(); setStatus('paused', 'Passo a passo: premi Passo per continuare'); }
  }

  function showCurrent() {
    const fid = run.curFrame && run.curFrame.func.id;

  /* ---- Cursore lungo le frecce ---- */
  let trailRaf = 0;
  function clearTrail() {
    cancelAnimationFrame(trailRaf);
    run.hold = null;
    const g = $('#chart svg .trail'); if (g) g.innerHTML = '';
    run.trailShown = null;
  }
  function findPath(from, to, branch) {
    const out = new Map();
    for (const e of st.edges || []) { if (!out.has(e.from)) out.set(e.from, []); out.get(e.from).push(e); }
    // ricerca in ampiezza: il primo passo da un Se segue il ramo davvero preso
    let first = out.get(from) || [];
    if (branch && branch.id === from) first = first.filter((e) => e.tag === (branch.taken ? 'T' : 'F'));
    const queue = first.map((e) => ({ node: e.to, path: [e] }));
    const seen = new Set();
    while (queue.length) {
      const { node, path } = queue.shift();
      if (node === to) return path;
      if (seen.has(node)) continue;
      seen.add(node);
      for (const e of out.get(node) || []) queue.push({ node: e.to, path: path.concat(e) });
    }
    return null;
  }
  function drawTrail() {
    const t = run.trail;
    const animate = run.mode === 'step' || SPEEDS[st.speed].ms > 0;
    if (!t || !animate || run.trailShown === t.step) return;
    run.trailShown = t.step;
    cancelAnimationFrame(trailRaf);
    if (run.hold) { run.hold = null; decorate(); }
    const g = $('#chart svg .trail'); if (!g) return;
    g.innerHTML = '';
    if (!t.from || func().id !== t.frame.func.id) return;
    const path = findPath(t.from, t.to, t.branch);
    if (!path) return;
    const pts = [];
    for (const e of path) for (const p of e.pts) { const q = pts[pts.length - 1]; if (!q || q[0] !== p[0] || q[1] !== p[1]) pts.push(p); }
    if (pts.length < 2) return;
    const seg = []; let total = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
    const NS = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(NS, 'path');
    line.setAttribute('class', 'trail-path');
    line.setAttribute('d', pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(''));
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('class', 'trail-cursor'); dot.setAttribute('r', '6');
    g.append(line, dot);
    const at = (d) => {
      let i = 0;
      while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
      const k = seg[i] ? Math.min(1, d / seg[i]) : 1;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
    };
    const place = (f) => {
      line.style.strokeDasharray = `${total} ${total}`;
      line.style.strokeDashoffset = String(total * (1 - f));
      const [x, y] = at(total * f); dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    };
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ms = run.mode === 'step' ? 520 : Math.min(SPEEDS[st.speed].ms * 0.8, 650);
    if (reduce || ms < 60) { place(1); return; }
    // durante il tragitto il blocco di arrivo resta spento; si illumina all'arrivo del cursore
    run.hold = t.to; run.holdFrom = t.from; decorate();
    const t0 = performance.now();
    const tick = (now) => {
      const f = Math.min(1, (now - t0) / ms);
      place(f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2);
      if (f < 1) trailRaf = requestAnimationFrame(tick);
      else { run.hold = null; decorate(); }
    };
    place(0);
    trailRaf = requestAnimationFrame(tick);
  }

  /* ---- Codice ---- */

  function highlight(code, lang) {
    const L = CodeGen.LANGS[lang];
    const kw = new Set(L.keywords);
    const cm = L.comment === '#' ? '#[^\\n]*' : '\\/\\/[^\\n]*';
    const re = new RegExp(`(${cm})|("(?:[^"\\\\\\n]|\\\\.)*"|'(?:[^'\\\\\\n]|\\\\.)*')|(\\b\\d+(?:\\.\\d+)?\\b)|([\\p{L}_][\\p{L}\\p{N}_]*)|(\\n)|([\\s\\S])`, 'gu');
    const escH = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let out = '<span class="ln"></span>';
    let m;
    while ((m = re.exec(code))) {
      if (m[1]) out += `<span class="tc">${escH(m[1])}</span>`;
      else if (m[2]) out += `<span class="ts">${escH(m[2])}</span>`;
      else if (m[3]) out += `<span class="tn">${m[3]}</span>`;
      else if (m[4]) out += kw.has(m[4]) ? `<span class="tk">${m[4]}</span>` : escH(m[4]);
      else if (m[5]) out += '\n<span class="ln"></span>';
      else out += escH(m[6]);
    }
    return out.replace(/\n<span class="ln"><\/span>$/, '\n');
  }

    winHost().append(win);
    Object.assign(win.style, { left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px' });
    if (g.min) setMinUi(win, true);

    const head = win.querySelector('.fwin-head');
    head.addEventListener('pointerdown', (e) => {

      win.classList.add('moving');

  function clampWin(win) {

    const x = Math.max(0, Math.min(win.offsetLeft, W - win.offsetWidth));

  function saveWin(id, win) {

  /* ----------------------------- Salvataggio ----------------------------- */
  function safeName(s) { return (s || 'programma').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').slice(0, 60) || 'programma'; }
  async function download(name, text, mime) {
    if (window.showSaveFilePicker && window.self === window.top) {
      try {
        const ext = name.split('.').pop();
        const hdl = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext.toUpperCase(), accept: { [mime]: ['.' + ext] } }] });
        const w = await hdl.createWritable(); await w.write(text); await w.close();
        toast('Salvato: ' + hdl.name, 'ok');
        return hdl.name;
      } catch (e) { if (e && e.name === 'AbortError') return null; }
    }
    const blob = text instanceof Blob ? text : new Blob([text], { type: mime + ';charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    if (window.self !== window.top) toast('Se il download non parte, usa «Copia XML» dal menu File', 'warn');
    return name;
  }
  async function saveFile() {
    const xml = M.serializeFprg(st.prog);
    const multi = st.prog.functions.filter((f) => M.rets(f).length > 1).map((f) => f.name);
    if (multi.length) toast(`Attenzione: ${multi.join(', ')} ${multi.length > 1 ? 'restituiscono' : 'restituisce'} più valori. FlowLab riapre il file senza problemi, ma gli altri programmi che usano il formato .fprg non potranno eseguirlo.`, 'warn');
    const name = st.fileName || safeName(st.prog.attrs.name) + '.fprg';
    const saved = await download(name, xml, 'application/xml');
    if (saved) { st.fileName = saved; st.dirty = false; autosave(); }
  }
  async function copyXml() {
    const xml = M.serializeFprg(st.prog);
    try { await navigator.clipboard.writeText(xml); toast('XML del programma copiato negli appunti', 'ok'); }
    catch (e) {
      const ta = h('textarea', { class: 'mono', rows: 14, readonly: true, 'aria-label': 'XML del programma' }); ta.value = xml;
      openModal({ title: 'XML del programma', wide: true, body: ta, okText: 'Chiudi', noCancel: true });
      setTimeout(() => ta.select(), 50);
    }
  }
  function loadText(text, name) {
    let prog;
    try { prog = M.parseFprg(text); } catch (e) { toast(e.message, 'error'); return; }
    if (isRunning()) stopRun();
    st.undo = []; st.redo = []; st.prog = prog; st.fi = 0; st.sel = null; st.fileName = name || null; st.dirty = false;
    run.errId = null; run.mainFrame = null;
    render(); renderVars();
    setTimeout(fitIfLarge, 0);
    if (prog.skipped && prog.skipped.length) toast(`Aperto ${name || 'programma'}: ignorati ${prog.skipped.length} blocchi non supportati (${[...new Set(prog.skipped)].join(', ')})`, 'warn');
    else toast(`Aperto ${name || 'programma'}`, 'ok');
  }
  function fitIfLarge() {

      else { st.vfs.set(file.name, r.result); saveVfs(); setTab('files'); toast(`File di testo ${file.name} aggiunto alla scheda File`, 'ok'); }

  function exportSvg() {
    const svg = $('#chart svg').cloneNode(true);
    svg.setAttribute('width', svg.dataset.w); svg.setAttribute('height', svg.dataset.h);
    svg.insertBefore(h('style', null, exportCss()), svg.firstChild);
    $$('.hits, .ctoggle', svg).forEach((x) => x.remove());
    return new XMLSerializer().serializeToString(svg);
  }
  function exportCss() {
    const cs = getComputedStyle(document.documentElement);
    const v = (n) => cs.getPropertyValue(n).trim();
    let css = `text{font:${RenderLib.R_.font};fill:${v('--sh-text')};text-anchor:middle}.cline-t{text-anchor:start}.comment text{font-weight:400;font-style:italic}.badge{font-size:10px}.c-in .badge{fill:${v('--s-in')}}.c-out .badge{fill:${v('--s-out')}}.c-decl .badge{fill:${v('--s-decl')}}.blabel{font-size:11px;font-weight:600;fill:${v('--muted')}}.flow{fill:none;stroke:${v('--flow')};stroke-width:1.6}.ahead{fill:${v('--flow')}}.joint{fill:${v('--flow')}}.shape>path,.shape>rect{stroke-width:1.6}.inner{fill:none!important}.note{stroke-dasharray:4 3}svg{background:${v('--paper')}}`;
    for (const c of ['term', 'decl', 'assign', 'in', 'out', 'cond', 'loop', 'call', 'comment', 'brk', 'file', 'inc']) css += `.c-${c}>path,.c-${c}>rect{fill:${v('--f-' + c)};stroke:${v('--s-' + c)}}`;

  function exportPng() {
    const s = exportSvg();

    img.onload = () => {
      const c = h('canvas', { width: w * k, height: hh * k });

      c.toBlob((b) => download(safeName(st.prog.attrs.name) + '_' + fname(func()) + '.png', b, 'image/png'));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  }

  /* ------------------------------ Tastiera ------------------------------- */
  function bindKeys() {
    document.addEventListener('keydown', (e) => {
      if (e.defaultPrevented) return;
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      const ctrl = e.ctrlKey || e.metaKey;
      if (e.key === 'Escape') {
        if (!$('#pop').hidden) { closePop(); e.preventDefault(); return; }
        if (modalStack.length) { modalStack[modalStack.length - 1](); e.preventDefault(); return; }
        if (drag && drag.on) { drag.ghost.remove(); drag = null; document.body.classList.remove('dragging'); }
        return;
      }
      if (modalStack.length) return;
      if (e.key === 'F5' || (ctrl && e.key === 'Enter')) { e.preventDefault(); onRunBtn(); return; }
      if (e.key === 'F10') { e.preventDefault(); onStepBtn(); return; }
      if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); return; }
      if (ctrl && e.key.toLowerCase() === 'o') { e.preventDefault(); openFile(); return; }
      if (typing) return;
      if (ctrl && e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newProgram(); return; }
      if (ctrl && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (ctrl && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
      if (ctrl && e.key.toLowerCase() === 'c') { if (st.sel) { e.preventDefault(); copySel(false); } return; }
      if (ctrl && e.key.toLowerCase() === 'x') { if (st.sel) { e.preventDefault(); copySel(true); } return; }
      if (ctrl && e.key.toLowerCase() === 'v') { if (st.clip) { e.preventDefault(); paste(); } return; }
      if (ctrl && e.key.toLowerCase() === 'd') { if (st.sel) { e.preventDefault(); duplicate(); } return; }
      if ((e.key === 'Delete' || e.key === 'Backspace') && st.sel) { e.preventDefault(); deleteSel(); return; }
      if (e.key === 'Enter' && st.sel) { e.preventDefault(); editStmt(st.sel); return; }
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && st.sel) {
        const f = M.findStmt(st.prog, st.sel); if (!f) return;
        const n = f.arr[f.index + (e.key === 'ArrowDown' ? 1 : -1)];
        if (n) { e.preventDefault(); st.sel = n.id; decorate(); const el = $(`#chart .shape[data-id="${n.id}"]`); if (el) scrollIntoViewIfNeeded(el); }
      }
    });
  }

      if (document.body.classList.contains('side-hidden')) return;
      grip.setPointerCapture(e.pointerId);
      const mv = (ev) => { const w = Math.max(280, Math.min(window.innerWidth - 320, window.innerWidth - ev.clientX)); document.documentElement.style.setProperty('--side-w', w + 'px'); store.set('sideW', w); };
      const up = () => { grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); };
      grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up);
    });
    grip.addEventListener('keydown', (e) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      const cur = $('#side').getBoundingClientRect().width; const w = Math.max(280, cur + (e.key === 'ArrowLeft' ? 30 : -30));
      document.documentElement.style.setProperty('--side-w', w + 'px'); store.set('sideW', w);
    });
    // tema
    const theme = store.get('theme', null);
    if (theme) document.documentElement.dataset.theme = theme;
    $('#themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nx = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nx; store.set('theme', nx);
    });
    window.addEventListener('beforeunload', (e) => { if (st.dirty && window.self === window.top) { e.preventDefault(); e.returnValue = ''; } });
  }

  function init() {
    bindUi(); bindChart(); bindKeys();
    const saved = store.get('autosave', null);
    let ok = false;
    if (saved && saved.xml) {
      try { st.prog = M.parseFprg(saved.xml); st.fi = Math.min(saved.fi || 0, st.prog.functions.length - 1); st.fileName = saved.fileName || null; ok = true; } catch (e) { ok = false; }
    }
    if (!ok) st.prog = Examples.get('media').make();
    render(); initLayout(); renderVars(); renderFiles(); setStatus('idle', 'Pronto');
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { render(); fitIfLarge(); });
    setTimeout(fitIfLarge, 0);
    // API minima per i test automatici
    window.FlowLab = { get state() { return st; }, run, loadText, serialize: () => M.serializeFprg(st.prog), render, setTab, submitInput, loadExample: (id) => { st.dirty = false; loadExample(id); } };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
