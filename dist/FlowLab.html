<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowLab</title>
<meta name="description" content="Editor ed esecutore di diagrammi di flusso compatibile con i file .fprg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra strumenti in alto · foglio quadrettato al centro · pannello laterale a schede (console, variabili, codice, file) */
:root {
  --bg: #e9edf1; --panel: #f7f9fb; --paper: #fdfefe; --grid: rgba(44, 92, 132, 0.075); --grid-strong: rgba(44, 92, 132, 0.13);
  --ink: #17222d; --muted: #5a6875; --faint: #8693a0; --line: #cfd8e1; --line-soft: #e1e7ed;
  --accent: #0c6c80; --accent-ink: #ffffff; --accent-soft: #d5ecf0;
  --exec: #f2a21b; --exec-soft: #fff1d3; --err: #cf3d3d; --err-soft: #fbe0de; --ok: #2b8a4a;
  --flow: #4c5b69; --sel: #0c6c80;
  --sh-text: #1b2631;
  --f-term: #e8e2f5; --s-term: #74609e;
  --f-decl: #f3efd8; --s-decl: #9f9150;
  --f-assign: #fcf4cf; --s-assign: #ae9533;
  --f-in: #d9e9fb; --s-in: #4e7cab;
  --f-out: #d9f1df; --s-out: #47925b;
  --f-cond: #fadedb; --s-cond: #b45d54;
  --f-loop: #fde6c9; --s-loop: #b57d32;
  --f-call: #ebe4f6; --s-call: #8167b0;
  --f-comment: #ffffff; --s-comment: #9aa6b2;
  --f-brk: #f6d8d8; --s-brk: #ad4545;
  --f-file: #e6e9ef; --s-file: #687384;
  --f-inc: #eceff2; --s-inc: #8f9aa6;
  --con-bg: #10161c; --con-ink: #dbe6ee; --con-echo: #7fd1e3; --con-sys: #7f8d99; --con-err: #ff8f8f;
  --shadow: 0 10px 30px rgba(20, 40, 60, 0.18), 0 2px 6px rgba(20, 40, 60, 0.12);
  --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, "Liberation Mono", monospace;
  --side-w: 420px;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --panel: #151c22; --paper: #182027; --grid: rgba(140, 190, 230, 0.06); --grid-strong: rgba(140, 190, 230, 0.1);
    --ink: #e2e9ef; --muted: #9aa8b5; --faint: #6c7a87; --line: #2b3741; --line-soft: #222c35;
    --accent: #4cc1d6; --accent-ink: #062228; --accent-soft: #173944;
    --exec: #f5b33c; --exec-soft: #3d3016; --err: #ff6b6b; --err-soft: #43201f; --ok: #5bc77c;
    --flow: #8e9dab; --sel: #4cc1d6; --sh-text: #e9eef3;
    --f-term: #352d48; --s-term: #a996d6; --f-decl: #37352a; --s-decl: #c9bb78; --f-assign: #3c3622; --s-assign: #d6bd5c;
    --f-in: #1f3249; --s-in: #7eabdb; --f-out: #1f3a29; --s-out: #74c08a; --f-cond: #462826; --s-cond: #e08b81;
    --f-loop: #43331d; --s-loop: #e0a85a; --f-call: #332a45; --s-call: #ae95dc; --f-comment: #1b232b; --s-comment: #6d7b88;
    --f-brk: #452424; --s-brk: #e07a7a; --f-file: #262d36; --s-file: #9aa5b3;
    --f-inc: #232a31; --s-inc: #6d7883;
    --con-bg: #0a0e11; --shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #151c22; --paper: #182027; --grid: rgba(140, 190, 230, 0.06); --grid-strong: rgba(140, 190, 230, 0.1);
  --ink: #e2e9ef; --muted: #9aa8b5; --faint: #6c7a87; --line: #2b3741; --line-soft: #222c35;
  --accent: #4cc1d6; --accent-ink: #062228; --accent-soft: #173944;
  --exec: #f5b33c; --exec-soft: #3d3016; --err: #ff6b6b; --err-soft: #43201f; --ok: #5bc77c;
  --flow: #8e9dab; --sel: #4cc1d6; --sh-text: #e9eef3;
  --f-term: #352d48; --s-term: #a996d6; --f-decl: #37352a; --s-decl: #c9bb78; --f-assign: #3c3622; --s-assign: #d6bd5c;
  --f-in: #1f3249; --s-in: #7eabdb; --f-out: #1f3a29; --s-out: #74c08a; --f-cond: #462826; --s-cond: #e08b81;
  --f-loop: #43331d; --s-loop: #e0a85a; --f-call: #332a45; --s-call: #ae95dc; --f-comment: #1b232b; --s-comment: #6d7b88;
  --f-brk: #452424; --s-brk: #e07a7a; --f-file: #262d36; --s-file: #9aa5b3;
  --f-inc: #232a31; --s-inc: #6d7883;
  --con-bg: #0a0e11; --shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- App shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.bar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand .bt { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand b { font-size: 15px; letter-spacing: 0.01em; }
.brand button { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand button:hover { color: var(--accent); }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
.grow { flex: 1; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid transparent; background: transparent; cursor: pointer; white-space: nowrap; }
.tb:hover:not(:disabled) { background: var(--line-soft); }
.tb:disabled { opacity: 0.4; cursor: default; }
.tb svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb.icon { padding: 0 7px; }
.tb.run { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0 14px; }
.tb.run:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.tb.run svg { fill: currentColor; stroke: none; }
.funcbox { display: inline-flex; align-items: center; gap: 2px; }
.funcbox label { font-size: 12px; color: var(--muted); margin-right: 4px; }
select.fsel { height: 32px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); padding: 0 8px; max-width: 220px; }
.speed { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.speed input { width: 86px; accent-color: var(--accent); }
.speed output { min-width: 62px; color: var(--ink); }

main.work { display: grid; grid-template-columns: minmax(0, 1fr) 6px var(--side-w); min-height: 0; }
#grip { cursor: col-resize; background: var(--line-soft); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
#grip:hover, #grip:focus-visible { background: var(--accent-soft); }
#grip { position: relative; }
#sideToggle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 48px; padding: 0; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; cursor: pointer; z-index: 27; box-shadow: 0 1px 4px rgba(20, 40, 60, 0.12); }
#sideToggle:hover, #sideToggle:focus-visible { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#sideToggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
body.side-hidden main.work { grid-template-columns: minmax(0, 1fr) 6px 0; }
body.side-hidden #side { display: none; }
body.side-hidden #grip { cursor: default; }
body.side-hidden #sideToggle svg { transform: rotate(180deg); }
body.side-hidden #sideToggle { left: auto; right: 3px; transform: translateY(-50%); }

/* ---------- Foglio del diagramma ---------- */
.canvas-col { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: 1fr auto; }
#canvasWrap {
  overflow: auto; min-height: 0; position: relative;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
}
#chart { display: flex; justify-content: center; min-width: max-content; padding: 12px 12px 80px; }
#chart svg { display: block; overflow: visible; }
.zoombar { position: absolute; left: 12px; bottom: 44px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.zoombar button { border: 0; background: transparent; height: 28px; min-width: 28px; border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoombar button:hover { background: var(--line-soft); }
#zoomVal { min-width: 50px; font-size: 12px; }
.statusbar { display: flex; align-items: center; gap: 12px; padding: 6px 14px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--muted); min-height: 32px; }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.status.running::before { background: var(--exec); box-shadow: 0 0 0 3px var(--exec-soft); animation: pulse 1s infinite; }
.status.input::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.status.paused::before { background: var(--exec); }
.status.done::before { background: var(--ok); }
.status.error::before { background: var(--err); }
@keyframes pulse { 50% { opacity: 0.45; } }
#stepCount { font-variant-numeric: tabular-nums; }
.hint-add { margin-left: auto; color: var(--faint); }

/* Forme SVG */
.chart text { font: 700 12.5px var(--font-ui); fill: var(--sh-text); pointer-events: none; }
.chart .shape text { text-anchor: middle; }
.chart .badge { font: 700 11px var(--font-ui); letter-spacing: 0.02em; }
.chart .c-in .badge { fill: var(--s-in); }
.chart .c-decl .badge { fill: var(--s-decl); }
.chart .c-out .badge { fill: var(--s-out); }
.chart .blabel { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: 0.02em; }
.chart .flow { fill: none; stroke: var(--flow); stroke-width: 1.6; }
.chart .ahead, .chart .joint { fill: var(--flow); }
.chart .shape { cursor: pointer; }
.chart .shape > path, .chart .shape > rect { stroke-width: 1.6; transition: stroke-width .12s, filter .12s; }
.chart .shape .inner { fill: none !important; stroke-width: 1.2; }
.chart .shape .note { stroke-dasharray: 4 3; }
.chart .shape.comment text { font-weight: 400; font-style: italic; fill: var(--muted); }
.chart .shape.comment.open text.cline-t { text-anchor: start; }
.chart .ctoggle { cursor: pointer; pointer-events: all; }
.chart .ctoggle circle { fill: var(--paper); stroke: var(--s-comment); stroke-width: 1.3; }
.chart .ctoggle path { stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; fill: none; }
.chart .ctoggle:hover circle { fill: var(--accent); stroke: var(--accent); }
.chart .ctoggle:hover path { stroke: var(--accent-ink); }
.chart .shape.c-inc text { font-weight: 400; fill: var(--muted); font-style: italic; }
.chart .shape.c-inc > path, .chart .shape.c-inc > rect { stroke-dasharray: 5 3; }
.c-term > path, .c-term > rect { fill: var(--f-term); stroke: var(--s-term); }
.c-decl > path, .c-decl > rect { fill: var(--f-decl); stroke: var(--s-decl); }
.c-assign > path, .c-assign > rect { fill: var(--f-assign); stroke: var(--s-assign); }
.c-in > path, .c-in > rect { fill: var(--f-in); stroke: var(--s-in); }
.c-out > path, .c-out > rect { fill: var(--f-out); stroke: var(--s-out); }
.c-cond > path, .c-cond > rect { fill: var(--f-cond); stroke: var(--s-cond); }
.c-loop > path, .c-loop > rect { fill: var(--f-loop); stroke: var(--s-loop); }
.c-call > path, .c-call > rect { fill: var(--f-call); stroke: var(--s-call); }
.c-comment > path, .c-comment > rect { fill: var(--f-comment); stroke: var(--s-comment); }
.c-brk > path, .c-brk > rect { fill: var(--f-brk); stroke: var(--s-brk); }
.c-file > path, .c-file > rect { fill: var(--f-file); stroke: var(--s-file); }
.c-inc > path, .c-inc > rect { fill: var(--f-inc); stroke: var(--s-inc); }
.chart .shape:hover > path, .chart .shape:hover > rect { stroke-width: 2.4; }
.chart .shape.sel > path:not(.inner), .chart .shape.sel > rect { stroke: var(--sel); stroke-width: 3; }
.chart .shape.exec > path:not(.inner), .chart .shape.exec > rect { fill: var(--exec-soft); stroke: var(--exec); stroke-width: 3.2; filter: drop-shadow(0 0 6px var(--exec)); }
.chart .shape.exec > path:not(.inner), .chart .shape.exec > rect { animation: lit 0.32s ease-out; }
@keyframes lit { 0% { filter: drop-shadow(0 0 0 var(--exec)); stroke-width: 1.6; } 45% { filter: drop-shadow(0 0 14px var(--exec)); } 100% { filter: drop-shadow(0 0 6px var(--exec)); } }
.chart .shape.err > path:not(.inner), .chart .shape.err > rect { fill: var(--err-soft); stroke: var(--err); stroke-width: 3.2; }
.chart .trail { pointer-events: none; }
.chart .trail-path { fill: none; stroke: var(--exec); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
.chart .trail-cursor { fill: var(--exec); stroke: var(--paper); stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--exec)); }
.chart .ins { cursor: copy; }
.chart .ins rect { fill: transparent; }
.chart .ins circle { fill: var(--accent); opacity: 0; transition: opacity .12s, transform .12s; }
.chart .ins path { stroke: var(--accent-ink); stroke-width: 2; opacity: 0; }
.chart .ins:hover circle, .chart .ins:focus circle { opacity: 1; }
.chart .ins:hover path { opacity: 1; }
body.dragging .chart .ins circle { opacity: 0.25; }
body.dragging .chart .ins.drop circle { opacity: 1; }
body.dragging .chart .ins.drop path { opacity: 1; }
body.dragging, body.dragging * { cursor: grabbing !important; }
body[data-run="running"] .chart .ins, body[data-run="paused"] .chart .ins, body[data-run="input"] .chart .ins { cursor: not-allowed; }
.ghost { position: fixed; z-index: 60; pointer-events: none; background: var(--panel); border: 1px solid var(--accent); color: var(--ink); padding: 4px 10px; border-radius: 6px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Pannello laterale ---------- */
#side { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; background: var(--panel); }
#tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
#tabs { align-items: stretch; }
.tabw { display: flex; align-items: center; border-bottom: 2px solid transparent; border-radius: 7px 7px 0 0; }
.tabw:has([aria-selected=true]) { border-bottom-color: var(--accent); }
.tabw.dragging { opacity: 0.4; }
.tabw.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
.tabw.drop-after { box-shadow: inset -3px 0 0 var(--accent); }
#tabs [role=tab] { border: 0; background: transparent; padding: 8px 4px 9px 11px; cursor: grab; color: var(--muted); white-space: nowrap; font-weight: 700; font-size: 13px; }
#tabs [role=tab][aria-selected=true] { color: var(--ink); }
#tabs [role=tab]:hover { color: var(--ink); }
.tabw .detach { border: 0; background: transparent; width: 24px; height: 24px; margin-right: 4px; border-radius: 5px; color: var(--faint); cursor: pointer; display: grid; place-items: center; padding: 0; }
.tabw .detach svg, .fwin .dock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabw .detach:hover, .tabw .detach:focus-visible { background: var(--line-soft); color: var(--accent); }
body.side-empty main.work { grid-template-columns: minmax(0, 1fr); }
body.side-empty #side, body.side-empty #grip { display: none; }
body.panedrag #canvasWrap { outline: 2px dashed var(--accent); outline-offset: -8px; }

/* Finestre mobili sopra l'area del diagramma */
.fwin { position: absolute; z-index: 30; pointer-events: auto; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; resize: both; min-width: 260px; min-height: 160px; }
.fwin.active { border-color: var(--accent); }
.fwin-head { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 12px; cursor: move; user-select: none; touch-action: none; background: var(--bg); border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.fwin.active .fwin-head { background: var(--accent-soft); }
.fwin.moving { opacity: 0.92; }
.fwin-body { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); }
.fwin-body > .pane { min-height: 0; }
.fwin .dock, .fwin .minbtn { width: 28px; height: 28px; }
.fwin .minbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fwin.min { height: auto !important; min-height: 0; resize: none; }
.fwin.min .fwin-body { display: none; }
.fwin.min .fwin-head { border-bottom: 0; }
#floatLayer { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.pane { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
.pane[hidden] { display: none !important; }
.panehead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; color: var(--muted); min-height: 44px; flex-wrap: wrap; }
.panehead .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary.danger, .btn.danger:hover { background: var(--err); border-color: var(--err); color: #fff; }
.btn.danger { color: var(--err); }
.iconbtn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.iconbtn:hover:not(:disabled) { background: var(--line-soft); color: var(--ink); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.empty { color: var(--muted); padding: 14px 16px; margin: 0; max-width: 46ch; }

/* Console */
#pane-console { grid-template-rows: auto 1fr auto; }
#conOut { background: var(--con-bg); color: var(--con-ink); font: 13.5px/1.55 var(--font-mono); padding: 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word; min-height: 0; }
.cline { min-height: 1.55em; }
.cline.echo { color: var(--con-echo); }
.cline.echo::before { content: "› "; opacity: .6; }
.echo-inline { color: var(--con-echo); }
.cline.sys { color: var(--con-sys); font-size: 12px; }
.cline.error { color: var(--con-err); }
#conForm { display: flex; gap: 6px; padding: 8px; background: var(--con-bg); border-top: 1px solid rgba(255,255,255,.08); align-items: center; }
#conPrompt { color: var(--con-sys); font: 600 13px var(--font-mono); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
#conForm.waiting #conPrompt { color: var(--con-echo); }
#conInput { flex: 1; min-width: 0; height: 34px; border-radius: 6px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: var(--con-ink); padding: 0 10px; font: 13.5px var(--font-mono); }
#conInput:disabled { opacity: .55; }
#conForm.waiting #conInput { border-color: var(--con-echo); box-shadow: 0 0 0 3px rgba(127, 209, 227, .18); }
#conSend { height: 34px; border-radius: 6px; border: 0; background: var(--con-echo); color: #08242b; font-weight: 700; padding: 0 12px; cursor: pointer; }
#conSend:disabled { opacity: .35; cursor: default; }

/* Variabili */
#varsBody { overflow: auto; min-height: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 10px 12px 4px; font-size: 12.5px; }
.crumbs button { border: 0; background: transparent; padding: 3px 7px; border-radius: 5px; cursor: pointer; color: var(--muted); font-weight: 700; }
.crumbs button.on { background: var(--accent-soft); color: var(--ink); }
.crumbs .sep { color: var(--faint); }
table.vars { width: 100%; border-collapse: collapse; font-size: 13px; }
table.vars th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 12px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
table.vars td { padding: 5px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.vars td:first-child { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
table.vars td:last-child { font-family: var(--font-mono); word-break: break-all; }
table.vars tr.item td:first-child { padding-left: 26px; color: var(--muted); font-weight: 400; }
table.vars tr.changed td { background: var(--exec-soft); }
.undef { color: var(--faint); font-family: var(--font-ui); font-style: italic; font-size: 12px; }
.v-String { color: var(--s-out); }
.v-Boolean { color: var(--s-call); }
.ptag { font: 700 9.5px var(--font-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }

/* Codice */
#codeOut { margin: 0; overflow: auto; padding: 12px 0; font: 13px/1.6 var(--font-mono); background: var(--paper); min-height: 0; counter-reset: ln; tab-size: 4; }
#codeOut .ln { counter-increment: ln; display: inline-block; width: 3.4em; padding-right: 1em; text-align: right; color: var(--faint); user-select: none; }
#codeOut .ln::before { content: counter(ln); }
.tk { color: var(--s-call); font-weight: 600; }
.ts { color: var(--s-out); }
.tn { color: var(--s-loop); }
.tc { color: var(--faint); font-style: italic; }

/* File */
#filesBody { overflow: auto; min-height: 0; }
ul.files { list-style: none; margin: 0; padding: 6px 0; }
ul.files li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.fname { display: flex; flex-direction: column; flex: 1; min-width: 120px; }
.fname strong { font-family: var(--font-mono); font-size: 13px; word-break: break-all; }
.factions { display: flex; gap: 6px; }

/* ---------- Popover e menu ---------- */
#pop { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; max-height: calc(100vh - 16px); overflow: auto; }
.pophead { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 6px 8px 4px; }
.insmenu { width: min(460px, calc(100vw - 32px)); }
.insgroup { padding: 2px 4px 6px; }
.glabel { font-size: 11px; color: var(--faint); padding: 2px 4px 3px; }
.insgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 4px; }
.insbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border: 1px solid transparent; border-radius: 7px; background: transparent; cursor: pointer; font-size: 12px; }
.insbtn:hover, .insbtn:focus-visible { background: var(--accent-soft); border-color: var(--accent); outline: none; }
.mini { width: 32px; height: 26px; overflow: visible; }
.mini path, .mini rect, .mini circle { stroke-width: 1.5; }
.mini .inner { fill: none !important; stroke-width: 1.4; }
.ilabel { line-height: 1.15; text-align: center; }
.pastebtn { width: 100%; margin-top: 4px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 7px; padding: 8px; cursor: pointer; font-weight: 700; }
.ctxmenu { min-width: 220px; display: flex; flex-direction: column; }
.ctxmenu button { display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.ctxmenu button:hover, .ctxmenu button:focus-visible { background: var(--accent-soft); outline: none; }
.ctxmenu button.danger { color: var(--err); }
.ctxmenu kbd { font: 11px var(--font-mono); color: var(--faint); }
.ctxmenu hr { border: 0; border-top: 1px solid var(--line-soft); margin: 4px 0; }
.ctxmenu.examples { min-width: 290px; }
.ctxmenu .tag { font-size: 11.5px; color: var(--faint); }

/* ---------- Finestre modali ---------- */
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(10, 20, 30, 0.42); display: grid; place-items: center; padding: 16px; }
.modal { width: min(460px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.modal.wide { width: min(640px, 100%); }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px 20px; }
.modal h2 { margin: 0; font-size: 17px; text-wrap: balance; }
.modal-body { padding: 4px 20px 6px; overflow: auto; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; }
.formerr { color: var(--err); font-size: 13px; padding: 0 20px; min-height: 0; }
.formerr:not(:empty) { padding-top: 6px; }
.fields { display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; }
.fields .row { display: flex; gap: 10px; flex-wrap: wrap; }
.fields .row > .field { flex: 1 1 120px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field[hidden] { display: none; }
.flabel { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.field input[type=text], .field select, .field textarea, .modal textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 8px 10px; min-height: 38px; }
.field textarea, .modal textarea { resize: vertical; }
.field.bad input { border-color: var(--err); }
.fmsg { font-size: 12px; color: var(--faint); min-height: 0; }
.field.bad .fmsg { color: var(--err); }
.help { margin: 0 0 2px; color: var(--muted); font-size: 13px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); align-self: flex-start; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 12px; cursor: pointer; border-right: 1px solid var(--line-soft); font-size: 13px; }
.seg label:last-child { border-right: 0; }
.seg input:checked + label { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 20px; padding: 1px 9px; font: 12px var(--font-mono); cursor: pointer; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.params { display: flex; flex-direction: column; gap: 6px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto 30px 30px; gap: 6px; align-items: center; }
.prow.rrow { grid-template-columns: minmax(0, 1fr) 110px 30px 30px; }
.prow input[type=text], .prow select { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 8px; min-width: 0; height: 34px; }
.confirm { margin: 4px 0 8px; }
.help-body { font-size: 13.5px; }
.help-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
table.ref { width: 100%; border-collapse: collapse; }
table.ref td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.ref td:first-child { white-space: nowrap; width: 1%; padding-right: 18px; }

/* ---------- Avvisi ---------- */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 70; background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; box-shadow: var(--shadow); transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: var(--exec); color: #2a1c00; }
.toast.error { background: var(--err); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
body.filedrag #canvasWrap { outline: 3px dashed var(--accent); outline-offset: -10px; }

/* ---------- Schermi stretti ---------- */
@media (max-width: 1480px) {
  .funcbox label, .speed .lbl { display: none; }
  .bar { gap: 4px; }
}
@media (max-width: 1120px) {
  #stepBtn .lbl, #exBtn .lbl, #fileBtn .lbl { display: none; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .bar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  .bar > * { flex: none; }
  .bar .grow { flex: 1 0 8px; }
  #app { height: auto; min-height: 100%; }
  main.work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(420px, 62vh) auto; }
  #grip { display: none; }
  #side { border-top: 1px solid var(--line); min-height: 460px; }
  .speed input { width: 70px; }
  .hint-add { display: none; }
  .tb .lbl { display: none; }
  .tb.run .lbl { display: inline; }
  .brand button { max-width: 130px; }
}
@media (max-width: 520px) {
  .funcbox label { display: none; }
  select.fsel { max-width: 130px; }
  .prow { grid-template-columns: minmax(0, 1fr) 96px auto 30px; }
  .prow .iconbtn[title="Sposta su"] { display: none; }
  .prow.rrow { grid-template-columns: minmax(0, 1fr) 96px 30px; }
}

@media print {
  body { overflow: visible; background: #fff; }
  .bar, #side, #grip, .statusbar, .zoombar, #pop, .toast, .fwin, #floatLayer { display: none !important; }
  main.work { display: block; }
  #canvasWrap { overflow: visible; background: #fff; }
  #chart { padding: 0; }
  .chart .ins { display: none; }
}

</style>
</head>

<div id="app">
  <header class="bar" role="toolbar" aria-label="Strumenti">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="1.5" width="14" height="6" rx="3" fill="var(--f-term)" stroke="var(--s-term)" stroke-width="1.5"/><path d="M16 7.5V11" stroke="var(--flow)" stroke-width="1.5"/><path d="M16 11L24 17L16 23L8 17Z" fill="var(--f-cond)" stroke="var(--s-cond)" stroke-width="1.5"/><path d="M24 17H28V27H16M8 17H4V27H16V30.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="bt"><b>FlowLab</b><button type="button" id="progName" title="Proprietà del programma">Programma</button></div>
    </div>
    <button class="tb" id="fileBtn" type="button" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lbl">File</span></button>
    <button class="tb icon" id="openBtn" type="button" title="Apri file .fprg (Ctrl+O)" aria-label="Apri"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="tb icon" id="saveBtn" type="button" title="Salva come .fprg (Ctrl+S)" aria-label="Salva"><svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-2zM8 3v5h7V3M8 21v-7h8v7"/></svg></button>
    <button class="tb icon" id="undoBtn" type="button" title="Annulla (Ctrl+Z)" aria-label="Annulla"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb icon" id="redoBtn" type="button" title="Ripeti (Ctrl+Y)" aria-label="Ripeti"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <div class="funcbox">
      <label for="funcSel">Funzione</label>
      <select id="funcSel" class="fsel"></select>

      <button class="iconbtn" id="funcEdit" type="button" title="Modifica funzione o proprietà del programma" aria-label="Modifica funzione"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></button>
      <button class="iconbtn" id="funcDel" type="button" title="Elimina funzione" aria-label="Elimina funzione"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb run" id="runBtn" type="button" title="Esegui (F5)"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><span class="lbl">Esegui</span></button>
    <button class="tb" id="stepBtn" type="button" title="Esegui un passo (F10)"><svg viewBox="0 0 24 24"><path d="M5 5v14M10 6l9 6-9 6z"/></svg><span class="lbl">Passo</span></button>

    <span class="grow"></span>
    <button class="tb" id="exBtn" type="button" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z"/></svg><span class="lbl">Esempi</span></button>
    <button class="tb icon" id="helpBtn" type="button" title="Guida rapida" aria-label="Guida rapida"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></button>

<script>
/* ==========================================================================
   FlowLab — motore delle espressioni
   Lessico, parser (precedenze compatibili con i file .fprg), valori tipizzati,
   funzioni integrate, valutatore a generatore (per eseguire funzioni utente
   passo-passo dentro le espressioni) e inferenza statica dei tipi.
   ========================================================================== */
'use strict';

class FlowError extends Error {
  constructor(msg, extra) { super(msg); Object.assign(this, extra || {}); }
}

const TYPES = ['Integer', 'Real', 'String', 'Boolean'];
const TYPE_IT = { Integer: 'Intero', Real: 'Reale', String: 'Stringa', Boolean: 'Booleano', None: 'Nessuno' };

/* ---------------------------- Lessico ---------------------------------- */
const SYM = [
  ['<=', '<='], ['>=', '>='], ['==', '=='], ['!=', '!='], ['<>', '!='], ['&&', 'and'], ['||', 'or'],
  ['≤', '<='], ['≥', '>='], ['≠', '!='], ['∧', 'and'], ['∨', 'or'], ['¬', 'not'],
  ['×', '*'], ['∗', '*'], ['÷', '/'], ['⁄', '/'], ['∕', '/'], ['↑', '^'], ['⭡', '^'], ['−', '-'],
  ['(', '('], [')', ')'], ['[', '['], [']', ']'], [',', ','], ['<', '<'], ['>', '>'], ['=', '=='],
  ['&', '&'], ['+', '+'], ['-', '-'], ['*', '*'], ['/', '/'], ['%', '%'], ['^', '^'], ['!', 'not'],
];
const WORD_OPS = { and: 'and', or: 'or', not: 'not', mod: '%' };

function tokenize(src) {
  const toks = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    const start = i;
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      let s = '';
      while (i < n && /[0-9]/.test(src[i])) s += src[i++];
      let real = false;
      if (src[i] === '.' && /[0-9]/.test(src[i + 1] || '')) {
        real = true; s += src[i++];
        while (i < n && /[0-9]/.test(src[i])) s += src[i++];
      } else if (src[i] === '.' && !/[A-Za-z_]/.test(src[i + 1] || '')) {
        real = true; i++; // "3." -> 3.0
      }
      if (/[eE]/.test(src[i] || '') && /[-+0-9]/.test(src[i + 1] || '')) {
        let j = i + 1; let e = 'e';
        if (/[-+]/.test(src[j])) e += src[j++];
        if (/[0-9]/.test(src[j] || '')) {
          while (j < n && /[0-9]/.test(src[j])) e += src[j++];
          s += e; i = j; real = true;
        }
      }
      toks.push({ k: 'num', v: Number(s), real, pos: start, text: s });
      continue;
    }
    if (c === '"' || c === "'") {
      i++;
      let s = '';
      while (i < n && src[i] !== c) s += src[i++];
      if (i >= n) throw new FlowError('Stringa non terminata: manca la virgoletta di chiusura ' + c, { pos: start });
      i++;
      toks.push({ k: 'str', v: s, pos: start });
      continue;
    }
    if (/[\p{L}_]/u.test(c)) {
      let s = '';
      while (i < n && /[\p{L}\p{N}_]/u.test(src[i])) s += src[i++];
      const low = s.toLowerCase();
      if (WORD_OPS[low]) toks.push({ k: 'op', v: WORD_OPS[low], pos: start, text: s });
      else toks.push({ k: 'id', v: s, pos: start });
      continue;
    }
    let matched = false;
    for (const [sym, op] of SYM) {
      if (src.startsWith(sym, i)) {
        toks.push({ k: 'op', v: op, pos: start, text: sym });
        i += sym.length; matched = true; break;
      }
    }
    if (!matched) throw new FlowError(`Carattere non valido "${c}"`, { pos: start });
  }
  toks.push({ k: 'eof', pos: n });
  return toks;
}

/* ----------------------------- Parser ---------------------------------- */
/* Precedenze (dalla più bassa):
   or < and < not < relazionali < & < + - < * / % < ^ < meno unario     */
function parseExpr(src) {
  if (src == null || String(src).trim() === '') throw new FlowError('Espressione vuota');
  const toks = tokenize(String(src));
  let p = 0;
  const peek = () => toks[p];
  const isOp = (v) => toks[p].k === 'op' && toks[p].v === v;
  const eat = (v) => {
    if (!isOp(v)) {
      const t = toks[p];
      throw new FlowError(t.k === 'eof' ? `Manca "${v}" alla fine dell'espressione` : `Atteso "${v}" ma trovato "${t.text ?? t.v}"`, { pos: t.pos });
    }
    return toks[p++];
  };
  const node = (o, t) => { o.pos = t ? t.pos : 0; return o; };

  function orE() {
    let l = andE();
    while (isOp('or')) { const t = toks[p++]; l = node({ k: 'bin', op: 'or', l, r: andE() }, t); }
    return l;
  }
  function andE() {
    let l = notE();
    while (isOp('and')) { const t = toks[p++]; l = node({ k: 'bin', op: 'and', l, r: notE() }, t); }
    return l;
  }
  function notE() {
    if (isOp('not')) { const t = toks[p++]; return node({ k: 'un', op: 'not', e: notE() }, t); }
    return relE();
  }
  function relE() {
    let l = catE();
    while (['==', '!=', '<', '<=', '>', '>='].some(isOp)) {
      const t = toks[p++]; l = node({ k: 'bin', op: t.v, l, r: catE() }, t);
    }
    return l;
  }
  function catE() {
    let l = addE();
    while (isOp('&')) { const t = toks[p++]; l = node({ k: 'bin', op: '&', l, r: addE() }, t); }
    return l;
  }
  function addE() {
    let l = mulE();
    while (isOp('+') || isOp('-')) { const t = toks[p++]; l = node({ k: 'bin', op: t.v, l, r: mulE() }, t); }
    return l;
  }
  function mulE() {
    let l = powE();
    while (isOp('*') || isOp('/') || isOp('%')) { const t = toks[p++]; l = node({ k: 'bin', op: t.v, l, r: powE() }, t); }
    return l;
  }
  function powE() {
    const l = unE();
    if (isOp('^')) { const t = toks[p++]; return node({ k: 'bin', op: '^', l, r: powE() }, t); }
    return l;
  }
  function unE() {
    if (isOp('-')) { const t = toks[p++]; return node({ k: 'un', op: 'neg', e: unE() }, t); }
    if (isOp('+')) { p++; return unE(); }
    if (isOp('not')) { const t = toks[p++]; return node({ k: 'un', op: 'not', e: unE() }, t); }
    return primary();
  }
  function primary() {
    const t = peek();
    if (t.k === 'num') { p++; return node({ k: 'num', v: t.v, t: t.real ? 'Real' : 'Integer', text: t.text }, t); }
    if (t.k === 'str') { p++; return node({ k: 'str', v: t.v }, t); }
    if (isOp('(')) { p++; const e = orE(); eat(')'); return node({ k: 'par', e }, t); }
    if (t.k === 'id') {
      p++;
      const low = t.v.toLowerCase();
      if (low === 'true' || low === 'false') return node({ k: 'bool', v: low === 'true' }, t);
      if ((low === 'pi' || t.v === 'π') && !isOp('(')) return node({ k: 'pi' }, t);
      if (isOp('(')) {
        p++;
        const args = [];
        if (!isOp(')')) {
          args.push(orE());
          while (isOp(',')) { p++; args.push(orE()); }
        }
        eat(')');
        return node({ k: 'call', name: t.v, args }, t);
      }
      if (isOp('[')) {
        p++;
        const idx = orE();
        eat(']');
        return node({ k: 'var', name: t.v, index: idx }, t);
      }
      return node({ k: 'var', name: t.v }, t);
    }
    if (t.k === 'eof') throw new FlowError("L'espressione termina in modo inatteso", { pos: t.pos });
    throw new FlowError(`Simbolo inatteso "${t.text ?? t.v}"`, { pos: t.pos });
  }

  const e = orE();
  if (peek().k !== 'eof') {
    const t = peek();
    throw new FlowError(`Simbolo inatteso "${t.text ?? t.v}" dopo la fine dell'espressione`, { pos: t.pos });
  }
  return e;
}

/* Riferimento modificabile: nome oppure nome[indice] */
function parseLValue(src) {
  const e = parseExpr(src);
  const inner = e.k === 'par' ? e.e : e;
  if (inner.k !== 'var') throw new FlowError('Serve il nome di una variabile (eventualmente con indice, es. v[i])');
  return inner;
}

/* Divide "a, b[i], c" sulle virgole di primo livello (non dentro parentesi o virgolette) */
function splitTop(src) {
  const out = []; let depth = 0, cur = '', q = null;
  for (const ch of String(src)) {
    if (q) { cur += ch; if (ch === q) q = null; continue; }
    if (ch === '"' || ch === "'") { q = ch; cur += ch; continue; }
    if (ch === '(' || ch === '[') depth++;
    if (ch === ')' || ch === ']') depth--;
    if (ch === ',' && depth === 0) { out.push(cur.trim()); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur.trim());
  return out;
}
function parseLValueList(src) {
  const parts = splitTop(src);
  if (parts.some((p) => !p)) throw new FlowError('Manca il nome di una variabile tra due virgole');
  const lvs = parts.map((p) => parseLValue(p));
  if (lvs.length > 1) {
    const seen = new Set();
    for (const lv of lvs) { const k = lv.name.toLowerCase() + (lv.index ? '[]' : ''); if (!lv.index && seen.has(k)) throw new FlowError(`La variabile "${lv.name}" compare più volte`); seen.add(k); }
  }
  return lvs;
}

function validIdent(s) { return /^[\p{L}_][\p{L}\p{N}_]*$/u.test(s); }

const RESERVED = new Set(['and', 'or', 'not', 'mod', 'true', 'false', 'pi', 'π', 'integer', 'real', 'string', 'boolean', 'if', 'while', 'do', 'for', 'main']);

/* ------------------------------ Valori --------------------------------- */
const V = {
  int: (v) => ({ t: 'Integer', v }),
  real: (v) => ({ t: 'Real', v }),
  str: (v) => ({ t: 'String', v }),
  bool: (v) => ({ t: 'Boolean', v }),
};
const isNum = (x) => x.t === 'Integer' || x.t === 'Real';

function fmtReal(x) {
  if (!isFinite(x)) return isNaN(x) ? 'NaN' : (x > 0 ? 'Infinity' : '-Infinity');
  const r = Number(x.toPrecision(15));
  let s = String(r);
  if (/e/.test(s)) {
    const [m, ex] = s.split('e');
    s = m + 'E' + (ex[0] === '-' ? '-' : '+') + ex.replace(/^[-+]/, '').padStart(2, '0');
  }
  return s;
}
function fmtValue(x) {
  if (x == null) return '';
  switch (x.t) {
    case 'Integer': return String(x.v);
    case 'Real': return fmtReal(x.v);
    case 'Boolean': return x.v ? 'true' : 'false';
    default: return String(x.v);
  }
}
function literalOf(x) {
  return x.t === 'String' ? '"' + x.v + '"' : fmtValue(x);
}
function checkInt(v, node) {
  if (!Number.isSafeInteger(v)) throw new FlowError('Overflow: il risultato intero è troppo grande', { node });
  return V.int(v);
}

/* Conversione per assegnamento/parametri */
function coerce(val, type, what) {
  if (val.t === type) return val;
  if (type === 'Real' && val.t === 'Integer') return V.real(val.v);
  if (type === 'Integer' && val.t === 'Real') return V.int(Math.trunc(val.v));
  throw new FlowError(`Tipi incompatibili: ${what || 'il valore'} è ${TYPE_IT[val.t]} ma serve ${TYPE_IT[type]}`);
}

/* Conversione testo digitato dall'utente */
function parseInputText(text, type) {
  const s = String(text).trim();
  switch (type) {
    case 'Integer':
      if (!/^[-+]?\d+$/.test(s)) throw new FlowError(`"${text}" non è un numero intero valido`);
      return checkInt(parseInt(s, 10));
    case 'Real': {
      const t = s.replace(',', '.');
      if (!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) throw new FlowError(`"${text}" non è un numero reale valido`);
      return V.real(parseFloat(t));
    }
    case 'Boolean': {
      const l = s.toLowerCase();
      if (['true', 'vero', 'v', 't', '1', 'sì', 'si', 'yes'].includes(l)) return V.bool(true);
      if (['false', 'falso', 'f', '0', 'no'].includes(l)) return V.bool(false);
      throw new FlowError(`"${text}" non è un valore booleano (usa true o false)`);
    }
    default: return V.str(String(text));
  }
}

const BUILTIN_NAMES = { abs: 'Abs', arccos: 'Arccos', arcsin: 'Arcsin', arctan: 'Arctan', cos: 'Cos', sin: 'Sin', tan: 'Tan', cosh: 'Cosh', sinh: 'Sinh', tanh: 'Tanh', arccosh: 'Arccosh', arcsinh: 'Arcsinh', arctanh: 'Arctanh', int: 'Int', ln: 'Ln', log: 'Log', log10: 'Log10', sgn: 'Sgn', sqrt: 'Sqrt', random: 'Random', len: 'Len', char: 'Char', tochar: 'ToChar', tocode: 'ToCode', tofixed: 'ToFixed', tointeger: 'ToInteger', toreal: 'ToReal', tostring: 'ToString', size: 'Size', eof: 'EOF' };

/* --------------------- Valutatore (a generatore) ----------------------- */
/* ctx: { getVar(name,node) -> cella, callUser*(name, argNodes, node) -> Value,
          hasUser(name), env: {eof()} }               */
function* evalE(node, ctx) {
  switch (node.k) {
    case 'num': return node.t === 'Integer' ? checkInt(node.v, node) : V.real(node.v);
    case 'str': return V.str(node.v);
    case 'bool': return V.bool(node.v);
    case 'pi': return V.real(Math.PI);
    case 'par': return yield* evalE(node.e, ctx);
    case 'var': {
      const cell = ctx.getVar(node.name, node);
      if (cell.array) {
        if (!node.index) throw new FlowError(`"${node.name}" è un array: serve un indice, es. ${node.name}[0]`, { node });
        const iv = yield* evalE(node.index, ctx);
        const i = arrIndex(iv, cell, node);
        const item = cell.items[i];
        if (item === undefined) throw new FlowError(`L'elemento ${node.name}[${i}] non ha ancora un valore`, { node });
        return item;
      }
      if (node.index) throw new FlowError(`"${node.name}" non è un array`, { node });
      if (cell.value === undefined) throw new FlowError(`La variabile "${node.name}" non ha ancora un valore`, { node });
      return cell.value;
    }
    case 'un': {
      const x = yield* evalE(node.e, ctx);
      if (node.op === 'neg') {
        if (!isNum(x)) throw new FlowError(`Il segno meno si applica solo ai numeri, non a ${TYPE_IT[x.t]}`, { node });
        return x.t === 'Integer' ? checkInt(-x.v, node) : V.real(-x.v);
      }
      if (x.t !== 'Boolean') throw new FlowError(`"not" si applica solo a valori booleani, non a ${TYPE_IT[x.t]}`, { node });
      return V.bool(!x.v);
    }
    case 'bin': return yield* evalBin(node, ctx);
    case 'call': return yield* evalCall(node, ctx);
  }
  throw new FlowError('Espressione non riconosciuta');
}

function arrIndex(iv, cell, node) {
  if (iv.t !== 'Integer') throw new FlowError(`L'indice di "${node.name}" deve essere intero, non ${TYPE_IT[iv.t]}`, { node });
  if (iv.v < 0 || iv.v >= cell.items.length) throw new FlowError(`Indice ${iv.v} fuori dai limiti: "${node.name}" ha ${cell.items.length} elementi (indici da 0 a ${cell.items.length - 1})`, { node });
  return iv.v;
}

function* evalBin(node, ctx) {
  const op = node.op;
  if (op === 'and' || op === 'or') {
    const l = yield* evalE(node.l, ctx);
    if (l.t !== 'Boolean') throw new FlowError(`"${op}" richiede valori booleani, a sinistra c'è ${TYPE_IT[l.t]}`, { node });
    if (op === 'and' && !l.v) return V.bool(false);
    if (op === 'or' && l.v) return V.bool(true);
    const r = yield* evalE(node.r, ctx);
    if (r.t !== 'Boolean') throw new FlowError(`"${op}" richiede valori booleani, a destra c'è ${TYPE_IT[r.t]}`, { node });
    return V.bool(r.v);
  }
  const l = yield* evalE(node.l, ctx);
  const r = yield* evalE(node.r, ctx);
  switch (op) {
    case '&': return V.str(fmtValue(l) + fmtValue(r));
    case '+': case '-': case '*': case '%': case '/': case '^': {
      if (!isNum(l) || !isNum(r)) {
        const hint = op === '+' && (l.t === 'String' || r.t === 'String') ? ' (per unire testi usa &)' : '';
        throw new FlowError(`L'operatore ${op} funziona solo con numeri${hint}`, { node });
      }
      const bothInt = l.t === 'Integer' && r.t === 'Integer';
      switch (op) {
        case '+': return bothInt ? checkInt(l.v + r.v, node) : V.real(l.v + r.v);
        case '-': return bothInt ? checkInt(l.v - r.v, node) : V.real(l.v - r.v);
        case '*': return bothInt ? checkInt(l.v * r.v, node) : V.real(l.v * r.v);
        case '/':
          if (r.v === 0) throw new FlowError('Divisione per zero', { node });
          return V.real(l.v / r.v);
        case '%':
          if (r.v === 0) throw new FlowError('Modulo per zero', { node });
          return bothInt ? V.int(l.v % r.v) : V.real(l.v % r.v);
        case '^': {
          const v = Math.pow(l.v, r.v);
          if (isNaN(v)) throw new FlowError('Potenza non definita (base negativa con esponente non intero)', { node });
          return bothInt && r.v >= 0 ? checkInt(v, node) : V.real(v);
        }
      }
      break;
    }
    case '==': case '!=': case '<': case '<=': case '>': case '>=': {
      let a, b;
      if (isNum(l) && isNum(r)) { a = l.v; b = r.v; }
      else if (l.t === r.t) { a = l.v; b = r.v; }
      else throw new FlowError(`Impossibile confrontare ${TYPE_IT[l.t]} con ${TYPE_IT[r.t]}`, { node });
      if (l.t === 'Boolean' && !['==', '!='].includes(op)) throw new FlowError('I valori booleani si possono solo confrontare con = oppure !=', { node });
      let res;
      switch (op) {
        case '==': res = a === b; break;
        case '!=': res = a !== b; break;
        case '<': res = a < b; break;
        case '<=': res = a <= b; break;
        case '>': res = a > b; break;
        case '>=': res = a >= b; break;
      }
      return V.bool(res);
    }
  }
  throw new FlowError('Operatore sconosciuto ' + op);
}

function* evalCall(node, ctx) {
  const low = node.name.toLowerCase();
  if (ctx.hasUser(node.name)) return yield* ctx.callUser(node.name, node.args, node);
  const b = BUILTINS[low];
  if (!b) throw new FlowError(`Funzione "${node.name}" non definita`, { node });
  if (node.args.length !== b.sig.length) throw new FlowError(`${BUILTIN_NAMES[low]} richiede ${b.sig.length} argomenti, ne sono stati passati ${node.args.length}`, { node });
  if (low === 'size') {
    const a = node.args[0];
    const inner = a.k === 'par' ? a.e : a;
    if (inner.k !== 'var' || inner.index) throw new FlowError('Size richiede il nome di un array', { node });
    const cell = ctx.getVar(inner.name, inner);
    if (!cell.array) throw new FlowError(`"${inner.name}" non è un array`, { node });
    return V.int(cell.items.length);
  }
  if (low === 'eof') return V.bool(ctx.env.eof(node));
  const args = [];
  for (let i = 0; i < node.args.length; i++) {
    const v = yield* evalE(node.args[i], ctx);
    const want = b.sig[i];
    if (want === N && !isNum(v)) throw new FlowError(`${BUILTIN_NAMES[low]}: l'argomento ${i + 1} deve essere un numero, non ${TYPE_IT[v.t]}`, { node });
    if (want === 'Integer' && v.t !== 'Integer') {
      if (v.t === 'Real') { args.push(V.int(Math.trunc(v.v))); continue; }
      throw new FlowError(`${BUILTIN_NAMES[low]}: l'argomento ${i + 1} deve essere intero, non ${TYPE_IT[v.t]}`, { node });

    if (want === 'String' && v.t !== 'String') throw new FlowError(`${BUILTIN_NAMES[low]}: l'argomento ${i + 1} deve essere una stringa, non ${TYPE_IT[v.t]}`, { node });

/* -------------------- Inferenza statica dei tipi ----------------------- */
/* scope: { vars: Map(name -> {type, array}), funcs: Map(name -> {type}) } */
function inferType(node, scope) {
  switch (node.k) {
    case 'num': return node.t;
    case 'str': return 'String';
    case 'bool': return 'Boolean';
    case 'pi': return 'Real';
    case 'par': return inferType(node.e, scope);
    case 'var': { const v = scope.vars.get(node.name.toLowerCase()); return v ? v.type : 'Unknown'; }
    case 'un': return node.op === 'not' ? 'Boolean' : inferType(node.e, scope);
    case 'bin': {
      const op = node.op;
      if (['and', 'or', '==', '!=', '<', '<=', '>', '>='].includes(op)) return 'Boolean';
      if (op === '&') return 'String';
      if (op === '/') return 'Real';
      const a = inferType(node.l, scope), b = inferType(node.r, scope);
      if (a === 'Real' || b === 'Real') return 'Real';
      if (a === 'Integer' && b === 'Integer') return 'Integer';
      return a === 'Unknown' ? b : a;
    }
    case 'call': {
      const f = scope.funcs.get(node.name.toLowerCase());
      if (f) return f.type;
      const b = BUILTINS[node.name.toLowerCase()];
      if (!b) return 'Unknown';
      if (typeof b.ret === 'function') return node.args[0] ? inferType(node.args[0], scope) : 'Real';
      return b.ret;
    }
  }

}

'use strict';

let __id = 1;

/* Definizione dei tipi di blocco: campi salvati nel file e valori di default */
const KINDS = {
  declare:    { fields: { name: '', type: 'Integer', array: false, size: '' } },
  const:      { fields: { name: '', type: 'Integer', expression: '' } },
  assign:     { fields: { variable: '', expression: '' } },
  input:      { fields: { variable: '' } },
  output:     { fields: { expression: '', newline: true } },
  if:         { fields: { expression: '' }, blocks: ['then', 'else'] },
  while:      { fields: { expression: '' }, blocks: ['body'] },
  for:        { fields: { variable: '', start: '', end: '', direction: 'inc', step: '1' }, blocks: ['body'] },
  do:         { fields: { expression: '' }, blocks: ['body'] },
  call:       { fields: { expression: '' } },
  comment:    { fields: { text: '' } },
  breakpoint: { fields: { expression: '', always: true } },
  open:       { fields: { expression: '', mode: 'read' } },
  close:      { fields: { mode: 'read' } },
  read:       { fields: { variable: '' } },
  write:      { fields: { expression: '' } },

function makeStmt(kind, props) {
  const def = KINDS[kind];

  for (const [k, v] of Object.entries(def.fields)) s[k] = v;
  for (const b of def.blocks || []) s[b] = [];
  if (props) Object.assign(s, props);
  return s;
}

function makeFunction(name, props) {
  return Object.assign({ id: newId(), name, type: 'None', variable: '', params: [], body: [] }, props || {});
}

/* Valori restituiti da una funzione: [{name, type}] (vuoto = procedura).
   type/variable restano allineati al primo valore, come nel formato .fprg. */
function rets(f) {

  return f.type && f.type !== 'None' ? [{ name: f.variable || '', type: f.type }] : [];
}

  f.variable = list.length ? list[0].name : '';
}

function newProgram() {
  return {
    attrs: { name: '', authors: '', about: '', created: '', edited: '' },
    functions: [makeFunction('Main')],

}

/* Copia profonda con nuovi id (per copia/incolla) */
function cloneStmt(s, keepIds) {

}
function reId(s) {

/* Visita ricorsiva di tutti i blocchi */
function walk(stmts, fn, parent) {
  for (let i = 0; i < stmts.length; i++) {

}

/* ------------------------------ XML ------------------------------------ */
const boolAttr = (v, d) => (v == null ? d : String(v).toLowerCase() === 'true');

function parseFprg(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const err = doc.querySelector('parsererror');
  if (err) throw new Error('Il file non è un XML valido.');
  const root = doc.documentElement;
  if (root.nodeName.toLowerCase() !== FPRG_ROOT) throw new Error('Il file non è un programma .fprg valido (elemento principale mancante).');
  _skipped = [];
  const prog = { attrs: { name: '', authors: '', about: '', created: '', edited: '' }, functions: [], fileversion: root.getAttribute('fileversion') || '' };
  for (const el of root.children) {
    const tag = el.nodeName.toLowerCase();
    if (tag === 'attributes') {
      for (const a of el.children) {
        const n = (a.getAttribute('name') || '').toLowerCase();
        if (n in prog.attrs || n === 'saved') prog.attrs[n] = a.getAttribute('value') || '';
      }
    } else if (tag === 'function') {
      const f = makeFunction(el.getAttribute('name') || 'Main', {
        type: normType(el.getAttribute('type'), true),
        variable: el.getAttribute('variable') || '',
      });
      // estensione FlowLab: più valori restituiti, "nome:Tipo;nome:Tipo"
      const multi = el.getAttribute('flowlab-returns');
      if (multi) {
        const list = multi.split(';').map((x) => x.trim()).filter(Boolean).map((x) => { const [n, t] = x.split(':'); return { name: (n || '').trim(), type: normType(t) }; }).filter((r) => r.name);
        if (list.length > 1) setRets(f, list);
      }
      for (const c of el.children) {
        const ct = c.nodeName.toLowerCase();
        if (ct === 'parameters') {
          for (const p of c.children) {
            f.params.push({ name: p.getAttribute('name') || '', type: normType(p.getAttribute('type')), array: boolAttr(p.getAttribute('array'), false) });
          }
        } else if (ct === 'body') {
          f.body = parseBlock(c);
        }
      }
      prog.functions.push(f);
    }
  }
  prog.skipped = _skipped;
  if (!prog.functions.length) prog.functions.push(makeFunction('Main'));
  const mi = prog.functions.findIndex((f) => f.name.toLowerCase() === 'main');
  if (mi > 0) prog.functions.unshift(prog.functions.splice(mi, 1)[0]);
  if (mi < 0) prog.functions.unshift(makeFunction('Main'));
  return prog;
}

function normType(t, allowNone) {
  const l = String(t || '').toLowerCase();
  if (l === 'integer') return 'Integer';
  if (l === 'real') return 'Real';
  if (l === 'string') return 'String';
  if (l === 'boolean') return 'Boolean';
  return allowNone ? 'None' : 'Integer';
}

let _skipped = [];
function parseBlock(el) {
  const out = [];
  const kids = [...el.children];
  for (let i = 0; i < kids.length; i++) {
    const c = kids[i];
    // estensione FlowLab: costante = <declare flowlab-const="True"/> seguita dall'assegnamento del valore
    if (c.nodeName.toLowerCase() === 'declare' && String(c.getAttribute('flowlab-const')).toLowerCase() === 'true') {
      const name = (c.getAttribute('name') || '').trim();
      const nx = kids[i + 1];
      let expression = '';
      if (nx && nx.nodeName.toLowerCase() === 'assign' && (nx.getAttribute('variable') || '').trim().toLowerCase() === name.toLowerCase()) { expression = nx.getAttribute('expression') || ''; i++; }
      out.push(makeStmt('const', { name, type: normType(c.getAttribute('type')), expression }));
      continue;
    }
    const s = parseStmt(c);
    if (s) out.push(s); else _skipped.push(c.nodeName);
  }
  return out;
}

function parseStmt(el) {
  const tag = el.nodeName.toLowerCase();
  const A = (n) => el.getAttribute(n);
  const S = (n) => A(n) ?? '';
  switch (tag) {
    case 'declare': return makeStmt('declare', { name: S('name'), type: normType(A('type')), array: boolAttr(A('array'), false), size: S('size') });
    case 'assign': return makeStmt('assign', { variable: S('variable'), expression: S('expression') });
    case 'input': return makeStmt('input', { variable: S('variable') });
    case 'output': return makeStmt('output', { expression: S('expression'), newline: boolAttr(A('newline'), true) });
    case 'if': {
      const s = makeStmt('if', { expression: S('expression') });
      for (const c of el.children) {
        const t = c.nodeName.toLowerCase();
        if (t === 'then') s.then = parseBlock(c);
        else if (t === 'else') s.else = parseBlock(c);
      }
      return s;
    }
    case 'while': return makeStmt('while', { expression: S('expression'), body: parseBlock(el) });
    case 'do': return makeStmt('do', { expression: S('expression'), body: parseBlock(el) });
    case 'for': return makeStmt('for', {
      variable: S('variable'), start: S('start'), end: S('end'),
      direction: (A('direction') || 'inc').toLowerCase() === 'dec' ? 'dec' : 'inc',
      step: A('step') ?? '1', body: parseBlock(el),
    });
    case 'call': return makeStmt('call', { expression: S('expression') });
    case 'comment': return makeStmt('comment', { text: S('text') });
    case 'breakpoint': return makeStmt('breakpoint', { expression: S('expression'), always: boolAttr(A('always'), !S('expression')) });
    case 'open': return makeStmt('open', { expression: S('expression'), mode: (A('mode') || 'read').toLowerCase() === 'write' ? 'write' : 'read' });
    case 'close': return makeStmt('close', { mode: (A('mode') || 'read').toLowerCase() === 'write' ? 'write' : 'read' });
    case 'read': return makeStmt('read', { variable: S('variable') });
    case 'write': return makeStmt('write', { expression: S('expression') });
  }
  return null; // elemento sconosciuto: ignorato
}

/* Serializzazione */
const _MX = (typeof module !== 'undefined') ? require('./expr.js') : ExprLib;
/* il formato .fprg prevede solo stringhe tra virgolette doppie: 'testo' diventa "testo" */
function fgExpr(src) {

  if (!s.includes("'")) return s;

  try { toks = _MX.tokenize(s); } catch (e) { return s; }

  for (const t of toks.filter((x) => x.k === 'str').reverse()) {
    if (s[t.pos] !== "'" || t.v.includes('"')) continue;
    out = out.slice(0, t.pos) + '"' + t.v + '"' + out.slice(t.pos + t.v.length + 2);
  }

}

  const edited = b64(`flowlab;browser;${stamp(now)};1`);
  const L = [];
  L.push('<?xml version="1.0"?>');
  L.push(`<${FPRG_ROOT} fileversion="4.2">`);
  L.push('    <attributes>');
  L.push(`        <attribute name="name" value="${xmlEsc(prog.attrs.name || '')}"/>`);
  L.push(`        <attribute name="authors" value="${xmlEsc(prog.attrs.authors || '')}"/>`);
  L.push(`        <attribute name="about" value="${xmlEsc(prog.attrs.about || '')}"/>`);
  L.push(`        <attribute name="saved" value="${xmlEsc(stamp(now))}"/>`);
  L.push(`        <attribute name="created" value="${xmlEsc(created)}"/>`);
  L.push(`        <attribute name="edited" value="${xmlEsc(edited)}"/>`);
  L.push('    </attributes>');
  for (const f of prog.functions) {
    const rs = rets(f);
    const extra = rs.length > 1 ? ` flowlab-returns="${xmlEsc(rs.map((r) => r.name + ':' + r.type).join(';'))}"` : '';
    // per le procedure si conserva il nome eventualmente lasciato in "variable" da altri editor
    L.push(`    <function name="${xmlEsc(f.name)}" type="${rs.length ? rs[0].type : 'None'}" variable="${xmlEsc(rs.length ? rs[0].name : (f.variable || ''))}"${extra}>`);

      L.push('        <parameters>');
      for (const p of f.params) L.push(`            <parameter name="${xmlEsc(p.name)}" type="${p.type}" array="${TF(p.array)}"/>`);
      L.push('        </parameters>');
    } else L.push('        <parameters/>');
    if (f.body.length) {
      L.push('        <body>');
      writeBlock(f.body, L, 3);
      L.push('        </body>');
    } else L.push('        <body/>');
    L.push('    </function>');
  }
  L.push(`</${FPRG_ROOT}>`);

}

function writeBlock(stmts, L, depth) {

  const open = (tag, attrs, children) => {
    const a = attrs.map(([k, v]) => ` ${k}="${xmlEsc(EXPR_ATTRS.has(k) ? fgExpr(v) : v)}"`).join('');
    if (!children) { L.push(`${ind}<${tag}${a}/>`); return; }
    L.push(`${ind}<${tag}${a}>`);
    children();
    L.push(`${ind}</${tag}>`);
  };
  const sub = (arr) => (arr.length ? () => writeBlock(arr, L, depth + 1) : null);
  for (const s of stmts) {
    switch (s.kind) {
      case 'declare': open('declare', [['name', s.name], ['type', s.type], ['array', TF(s.array)], ['size', s.array ? s.size : '']]); break;
      case 'assign': open('assign', [['variable', s.variable], ['expression', s.expression]]); break;
      case 'const':
        // gli altri editor vedono una variabile dichiarata e assegnata: il programma resta eseguibile
        open('declare', [['name', s.name], ['type', s.type], ['array', 'False'], ['size', ''], ['flowlab-const', 'True']]);
        open('assign', [['variable', s.name], ['expression', s.expression]]);
        break;
      case 'input': open('input', [['variable', s.variable]]); break;
      case 'output': open('output', [['expression', s.expression], ['newline', TF(s.newline)]]); break;
      case 'if':
        L.push(`${ind}<if expression="${xmlEsc(fgExpr(s.expression))}">`);
        for (const [tag, arr] of [['then', s.then], ['else', s.else]]) {
          if (arr.length) { L.push(`${ind}    <${tag}>`); writeBlock(arr, L, depth + 2); L.push(`${ind}    </${tag}>`); }

        }

        break;
      case 'while': open('while', [['expression', s.expression]], sub(s.body)); break;
      case 'do': open('do', [['expression', s.expression]], sub(s.body)); break;
      case 'for': open('for', [['variable', s.variable], ['start', s.start], ['end', s.end], ['direction', s.direction], ['step', s.step]], sub(s.body)); break;
      case 'call': open('call', [['expression', s.expression]]); break;
      case 'comment': open('comment', [['text', s.text]]); break;
      case 'breakpoint': open('breakpoint', [['expression', s.always ? '' : s.expression], ['always', TF(s.always)]]); break;
      case 'open': open('open', [['expression', s.expression], ['mode', s.mode]]); break;
      case 'close': open('close', [['mode', s.mode]]); break;
      case 'read': open('read', [['variable', s.variable]]); break;
      case 'write': open('write', [['expression', s.expression]]); break;

    case 'declare': return !s.name.trim() || (s.array && !String(s.size).trim());
    case 'const': return !s.name.trim() || !String(s.expression).trim();
    case 'assign': return !s.variable.trim() || !s.expression.trim();
    case 'input': case 'read': return !s.variable.trim();
    case 'output': case 'if': case 'while': case 'do': case 'call': case 'open': case 'write':
      return !String(s.expression).trim();
    case 'for': return !s.variable.trim() || !s.start.trim() || !s.end.trim();

'use strict';

const _M = (typeof module !== 'undefined') ? require('./model.js') : ModelLib;

class Interpreter {
  constructor(prog, env) {

    this.env = env;

    this.funcs = new Map();

      getVar: (name, node) => self.getVar(name, node),
      hasUser: (name) => !!self.findFunc(name),
      callUser: (name, args, node) => self.callUser(name, args, node, false),
      env: {
        eof: (node) => env.eof(node),

    };
  }

  findFunc(name) {
    if (this.funcs.has(name)) return this.funcs.get(name);
    const l = name.toLowerCase();
    for (const f of this.prog.functions) if (f.name.toLowerCase() === l) return f;
    return null;

  get frame() { return this.stack[this.stack.length - 1]; }

  parse(src, what) {

    try {
      r = what === 'lv' ? _E.parseLValue(src) : _E.parseExpr(src);
    } catch (e) {

    }

    return r;
  }

  getVar(name, node) {
    const f = this.frame;
    const cell = f.vars.get(name.toLowerCase());
    if (cell) return cell;
    if (this.findFunc(name)) throw new _E.FlowError(`"${name}" è una funzione: per chiamarla scrivi ${name}(...)`, { node });
    throw new _E.FlowError(`La variabile "${name}" non è stata dichiarata`, { node });
  }

  *run() {
    const main = this.prog.functions[0];
    if (main.params.length) throw new _E.FlowError('La funzione Main non può avere parametri');
    yield* this.invoke(main, [], null);
  }

    const frame = { func, vars: new Map(), depth: this.stack.length };

    yield { type: 'stmt', stmt: { id: 'end:' + func.id, kind: 'end' }, frame };

    const rs = _M.rets(func);
    if (rs.length) {
      const vals = [];
      for (const r of rs) {
        const cell = frame.vars.get(r.name.toLowerCase());
        if (!r.name || !cell) {
          this.stack.pop();
          throw new _E.FlowError(`La funzione ${func.name} deve restituire "${r.name}", ma questa variabile non è stata dichiarata`, { node, stmtId: 'end:' + func.id });

          this.stack.pop();

        vals.push(_E.coerce(cell.value, r.type, `il valore restituito "${r.name}"`));

    const func = this.findFunc(name);

    if (!asStatement && nr > 1 && !allowMulti) {
      const ph = _M.rets(func).map((r) => r.name).join(', ');

      if (p.array) {
        const inner = a.k === 'par' ? a.e : a;
        if (inner.k !== 'var' || inner.index) throw new _E.FlowError(`Il parametro "${p.name}" di ${func.name} è un array: passa il nome di un array`, { node });

          if (frame.vars.has(key)) throw new _E.FlowError(frame.vars.get(key).name === n ? `La variabile "${n}" è già stata dichiarata` : `La variabile "${n}" è già stata dichiarata come "${frame.vars.get(key).name}" (maiuscole e minuscole non contano)`);

        if (_E.RESERVED.has(n.toLowerCase())) throw new _E.FlowError(`"${n}" è una parola riservata`);
        const key = n.toLowerCase();
        if (frame.vars.has(key)) throw new _E.FlowError(`Il nome "${n}" è già usato da ${frame.vars.get(key).constant ? 'un\'altra costante' : 'una variabile'}`);

          if (nr !== targets.length) throw new _E.FlowError(`${callee.name} restituisce ${nr} ${nr === 1 ? 'valore' : 'valori'}, ma a sinistra ci sono ${targets.length} variabili`);

        yield* this.store(lv, val);

          }
        }

      }
      case 'output': {
        yield { type: 'stmt', stmt: s, frame };
        const v = yield* ev(s.expression);
        env.output(_E.fmtValue(v), s.newline);
        return;
      }
      case 'if': {
        yield { type: 'stmt', stmt: s, frame };

        return;
      }
      case 'while': {
        for (;;) {
          yield { type: 'stmt', stmt: s, frame };
          const c = yield* ev(s.expression);
          if (c.t !== 'Boolean') throw new _E.FlowError(`La condizione deve essere vera o falsa, invece è ${_E.TYPE_IT[c.t]}`);

          yield* this.block(s.body);
        }

      }
      case 'do': {
        for (;;) {
          yield* this.block(s.body);
          yield { type: 'stmt', stmt: s, frame };
          const c = yield* ev(s.expression);
          if (c.t !== 'Boolean') throw new _E.FlowError(`La condizione deve essere vera o falsa, invece è ${_E.TYPE_IT[c.t]}`);
          if (!c.v) break;
        }

      }
      case 'for': {
        yield { type: 'stmt', stmt: s, frame };
        const lv = this.parse(s.variable, 'lv');
        const cell = this.getVar(lv.name, lv);
        if (cell.array && !lv.index) throw new _E.FlowError(`La variabile del ciclo "${lv.name}" non può essere un array`);
        if (cell.type !== 'Integer' && cell.type !== 'Real') throw new _E.FlowError(`La variabile del ciclo "${lv.name}" deve essere numerica`);
        const a = yield* ev(s.start), b = yield* ev(s.end);
        const st = yield* ev(String(s.step).trim() || '1');
        for (const [v, n] of [[a, 'iniziale'], [b, 'finale'], [st, 'del passo']]) if (!_E.isNum(v)) throw new _E.FlowError(`Il valore ${n} del ciclo deve essere un numero`);
        if (st.v === 0) throw new _E.FlowError('Il passo del ciclo non può essere zero');
        if (st.v < 0) throw new _E.FlowError('Il passo deve essere positivo: per contare all\'indietro scegli "decrescente"');
        const dec = s.direction === 'dec';

        yield* this.store(lv, mk(i));

          yield* this.block(s.body);
          const now = (yield* _E.evalE(lv, this.ctx)).v;
          yield* this.store(lv, mk(dec ? now - st.v : now + st.v));

      }
      case 'call': {
        yield { type: 'stmt', stmt: s, frame };
        let e = this.parse(s.expression, 'e');
        if (e.k === 'var' && !e.index) e = { k: 'call', name: e.name, args: [] };
        if (e.k !== 'call') throw new _E.FlowError('Il blocco Chiamata deve contenere una chiamata di funzione, es. Stampa(x)');
        if (this.findFunc(e.name)) yield* this.callUser(e.name, e.args, e, true);
        else yield* _E.evalE(e, this.ctx);
        return;
      }
      case 'breakpoint': {
        yield { type: 'stmt', stmt: s, frame };
        let hit = s.always;
        if (!hit) {
          const c = yield* ev(s.expression);
          if (c.t !== 'Boolean') throw new _E.FlowError('La condizione del punto di interruzione deve essere booleana');
          hit = c.v;
        }
        if (hit) yield { type: 'break', stmt: s, frame };
        return;
      }
      case 'open': {
        yield { type: 'stmt', stmt: s, frame };
        const n = yield* ev(s.expression);
        env.fileOpen(_E.fmtValue(n), s.mode);
        return;
      }
      case 'close': yield { type: 'stmt', stmt: s, frame }; env.fileClose(s.mode); return;
      case 'read': {
        yield { type: 'stmt', stmt: s, frame };
        const lv = this.parse(s.variable, 'lv');
        const cell = this.getVar(lv.name, lv);
        const line = env.fileRead();
        let v;
        try { v = _E.parseInputText(line, cell.type); } catch (e) { throw new _E.FlowError(`Lettura dal file: ${e.message}`); }
        yield* this.store(lv, v);
        return;
      }
      case 'write': {
        yield { type: 'stmt', stmt: s, frame };
        const v = yield* ev(s.expression);
        env.fileWrite(_E.fmtValue(v));
        return;
      }
    }
  }

  *store(lv, val) {
    const cell = this.getVar(lv.name, lv);
    if (cell.constant) throw new _E.FlowError(`"${cell.name}" è una costante: il suo valore non si può modificare`);
    if (cell.array) {
      if (!lv.index) throw new _E.FlowError(`"${lv.name}" è un array: indica l'elemento da modificare, es. ${lv.name}[i]`);
      const iv = yield* _E.evalE(lv.index, this.ctx);
      const i = _E.arrIndex(iv, cell, lv);
      cell.items[i] = _E.coerce(val, cell.type, `il valore assegnato a ${lv.name}[${i}]`);
    } else {
      if (lv.index) throw new _E.FlowError(`"${lv.name}" non è un array`);
      cell.value = _E.coerce(val, cell.type, `il valore assegnato a "${lv.name}"`);
    }
  }

/* ==========================================================================
   FlowLab — generatori di codice sorgente
   Pseudocodice (italiano), Python, C++, Java, C#, JavaScript.
   Tutti partono dall'albero sintattico delle espressioni e da un'inferenza
   statica dei tipi, così divisioni, concatenazioni e confronti tra stringhe
   vengono tradotti correttamente in ogni linguaggio.
   ========================================================================== */
'use strict';

const _CE = (typeof module !== 'undefined') ? require('./expr.js') : ExprLib;
const _CM = (typeof module !== 'undefined') ? require('./model.js') : ModelLib;

const P = { or: 1, and: 2, notLow: 3, rel: 4, add: 5, mul: 6, un: 7, pow: 8, atom: 10 };
const REL = ['==', '!=', '<', '<=', '>', '>='];

function buildScope(prog, func) {
  const vars = new Map();
  for (const p of func.params) vars.set(p.name.toLowerCase(), { type: p.type, array: p.array, name: p.name });
  _CM.walk(func.body, (s) => {
    if (s.kind === 'const' && s.name.trim() && !vars.has(s.name.trim().toLowerCase())) vars.set(s.name.trim().toLowerCase(), { type: s.type, array: false, name: s.name.trim(), constant: true });
    if (s.kind === 'declare') for (const n of s.name.split(',').map((x) => x.trim()).filter(Boolean)) if (!vars.has(n.toLowerCase())) vars.set(n.toLowerCase(), { type: s.type, array: s.array, name: n });
  });
  const funcs = new Map();
  for (const f of prog.functions) funcs.set(f.name.toLowerCase(), { type: f.type, rets: _CM.rets(f), f, name: f.name });
  return { vars, funcs, func };
}

function tryParse(src) { try { return _CE.parseExpr(src); } catch (e) { return null; } }
const strip = (n) => (n && n.k === 'par' ? strip(n.e) : n);
/* destinazioni di un'assegnazione (più di una se la funzione restituisce più valori) */
const targetsOf = (s) => _CE.splitTop(s.variable);
function isLiteralExpr(src) {
  const ok = (n) => !!n && (['num', 'str', 'bool'].includes(n.k) || (n.k === 'par' && ok(n.e)) || (n.k === 'un' && ok(n.e)) || (n.k === 'bin' && n.op !== '&' && ok(n.l) && ok(n.r)));
